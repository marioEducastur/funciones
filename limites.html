<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Límites Interactivos - 1º Bachillerato</title>
    
    <!-- Cargar Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cargar React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Cargar Babel para poder usar JSX puro y limpio -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- KaTeX para las matemáticas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>
<body class="bg-slate-50">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Componente auxiliar para renderizar LaTeX ---
        const Latex = ({ math, display = false }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                if (window.katex && containerRef.current) {
                    window.katex.render(math, containerRef.current, {
                        displayMode: display,
                        throwOnError: false,
                    });
                }
            }, [math, display]);

            return <span ref={containerRef} className={display ? "my-4 block text-center" : ""} />;
        };

        // --- Componente Acordeón Desplegable ---
        const Accordion = ({ title, children, defaultOpen = false }) => {
            const [isOpen, setIsOpen] = useState(defaultOpen);
            return (
                <div className="mb-6 border border-slate-200 rounded-xl bg-white shadow-sm overflow-hidden">
                    <button
                        onClick={() => setIsOpen(!isOpen)}
                        className="w-full bg-slate-100 hover:bg-slate-200 p-4 flex justify-between items-center transition-colors focus:outline-none"
                    >
                        <h2 className="text-2xl font-bold text-slate-800 text-left">{title}</h2>
                        <svg className={`w-6 h-6 transform transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                        </svg>
                    </button>
                    {isOpen && <div className="p-6 border-t border-slate-200 animate-fade-in">{children}</div>}
                </div>
            );
        };

        // --- Componente Principal ---
        function App() {
            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 font-sans pb-20">
                    <header className="bg-blue-600 text-white p-6 shadow-md">
                        <div className="max-w-4xl mx-auto">
                            <h2 className="text-sm font-semibold tracking-wider text-blue-200 uppercase mb-1">Matemáticas I - 1º Bachillerato</h2>
                            <h1 className="text-3xl font-bold">Tema 10: Límites y Continuidad</h1>
                        </div>
                    </header>

                    <main className="max-w-4xl mx-auto mt-8 p-4 md:p-6">
                        
                        {/* APARTADO 1 */}
                        <Accordion title="1. Concepto y definición de límite" defaultOpen={false}>
                            <p className="mb-4 text-lg">
                                Si queremos estudiar hacia qué valor se aproxima una función cuando la variable independiente toma valores próximos a un número real dado, resulta imprescindible introducir el concepto de <strong>límite</strong>.
                            </p>
                            
                            <div className="bg-blue-50 p-6 rounded-lg mb-6 border-l-4 border-blue-500">
                                <h3 className="font-bold text-blue-800 mb-2">Definición intuitiva:</h3>
                                <p className="text-lg">
                                    Si <Latex math="a" /> y <Latex math="b" /> son números reales, la expresión:
                                </p>
                                <Latex math="\displaystyle \lim_{x \to a} f(x) = b" display={true} />
                                <p className="text-lg">
                                    quiere decir que siempre que <Latex math="x" /> tome valores próximos al número <Latex math="a" />, tanto menores como mayores, los correspondientes valores de <Latex math="f" /> se aproximan al número <Latex math="b" />.
                                </p>
                            </div>

                            <div className="bg-amber-50 p-4 rounded-lg border border-amber-200 mb-6 text-amber-900">
                                <strong>* Ojo:</strong> <Latex math="f(x)" /> puede <strong>no estar definida</strong> en <Latex math="x = a" />.
                            </div>

                            <p className="text-lg mb-2">
                                <strong>Se lee:</strong> "El límite de <Latex math="f(x)" /> cuando <Latex math="x" /> tiende a <Latex math="a" /> es <Latex math="b" />".
                            </p>
                            <p className="text-lg text-slate-600 italic mb-8">
                                (Si <Latex math="a" /> es <Latex math="+\infty" /> o <Latex math="-\infty" />, hablamos de límite en el infinito).
                            </p>

                            <h3 className="text-xl font-bold text-slate-800 mb-6 border-b border-slate-200 pb-2">Explora los ejemplos:</h3>
                            
                            <InteractiveExample1 />
                            <InteractiveExample2 />
                            <InteractiveExample3 />
                        </Accordion>

                        {/* APARTADO 2 */}
                        <Accordion title="2. Límites laterales" defaultOpen={false}>
                            <div className="mb-6">
                                <p className="text-lg mb-4">
                                    El límite de una función <Latex math="f(x)" /> cuando <Latex math="x" /> toma valores próximos a <Latex math="a" /> pero <strong>menores</strong> se denomina <strong>"límite por la izquierda"</strong>:
                                </p>
                                <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 mb-6 flex justify-center text-xl font-bold text-blue-700">
                                    <Latex math="\displaystyle \lim_{x \to a^-} f(x) = b" />
                                </div>

                                <p className="text-lg mb-4">
                                    El límite de una función <Latex math="f(x)" /> cuando <Latex math="x" /> toma valores próximos a <Latex math="a" /> pero <strong>mayores</strong> se denomina <strong>"límite por la derecha"</strong>:
                                </p>
                                <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 mb-8 flex justify-center text-xl font-bold text-rose-700">
                                    <Latex math="\displaystyle \lim_{x \to a^+} f(x) = c" />
                                </div>
                            </div>

                            <div className="bg-blue-50 p-6 rounded-lg mb-8 border-l-4 border-blue-500">
                                <h3 className="font-bold text-blue-800 mb-4 text-lg">Condición de existencia de límite</h3>
                                <p className="text-lg mb-4">
                                    Se dice que una función <Latex math="f(x)" /> tiene límite <Latex math="L" /> en el punto <Latex math="x = a" /> si y solo si <strong>existen los límites laterales y son iguales</strong>.
                                </p>
                                <div className="bg-white p-4 rounded border border-blue-200 flex justify-center mb-4 text-lg font-bold">
                                    <Latex math="\displaystyle \lim_{x \to a} f(x) = L \iff \lim_{x \to a^-} f(x) = \lim_{x \to a^+} f(x) = L" />
                                </div>
                                <ul className="list-disc pl-6 text-lg space-y-2 text-blue-900">
                                    <li>El límite de una función en un punto, si existe, es <strong>ÚNICO</strong>.</li>
                                    <li>Es <strong>independiente del valor</strong> de la función en el punto.</li>
                                </ul>
                            </div>
                            
                            <InteractiveExample4 />
                        </Accordion>

                        {/* APARTADO 3 */}
                        <Accordion title="3. Límites infinitos" defaultOpen={false}>
                            <p className="mb-4 text-lg">
                                A veces, al acercarse la <Latex math="x" /> a un valor <Latex math="a" />, la función <Latex math="f(x)" /> toma valores que se hacen tan grandes o pequeños como queramos.
                            </p>
                            
                            <div className="flex flex-col md:flex-row gap-6 mb-8 justify-center">
                                <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 text-xl font-bold text-slate-800">
                                    <Latex math="\displaystyle \lim_{x \to a} f(x) = +\infty" />
                                </div>
                                <div className="bg-white p-4 rounded-lg shadow-sm border border-slate-200 text-xl font-bold text-slate-800">
                                    <Latex math="\displaystyle \lim_{x \to a} f(x) = -\infty" />
                                </div>
                            </div>

                            <div className="bg-amber-50 p-6 rounded-lg mb-8 border border-amber-200 text-amber-900">
                                <h3 className="font-bold mb-2">Aclaración Matemática Fundamental:</h3>
                                <p className="text-lg">
                                    Decimos que "el límite de <Latex math="f(x)" /> cuando <Latex math="x" /> tiende a <Latex math="a" /> es infinito". Pero dado que el infinito no es un número real, hablando estrictamente a nivel matemático, <strong>el límite no existe</strong> (decimos que diverge).
                                </p>
                            </div>

                            <InteractiveExample5 />
                            <InteractiveExample6 />
                        </Accordion>

                        {/* APARTADO 4 */}
                        <Accordion title="4. Límites en el infinito" defaultOpen={false}>
                            <p className="mb-4 text-lg">
                                Ahora vamos a estudiar el valor de la función para valores de <Latex math="x" /> cada vez <strong>mayores</strong> (<Latex math="\to +\infty" />) o cada vez <strong>menores</strong> (<Latex math="\to -\infty" />). En vez de buscar acercarnos a un número, vamos a ver qué pasa cuando nos alejamos indefinidamente hacia los extremos del eje.
                            </p>

                            <InteractiveExample7 />
                        </Accordion>

                        {/* APARTADO 5: CÁLCULO E INDETERMINACIONES */}
                        <Accordion title="5. Cálculo de límites. Indeterminaciones" defaultOpen={false}>
                            
                            <div className="bg-indigo-50 border-l-4 border-indigo-500 p-6 mb-8 rounded-r-lg mt-2">
                                <p className="text-lg font-semibold text-indigo-900 mb-2">Paso 1 Universal: Sustitución directa</p>
                                <p className="text-lg text-indigo-800">
                                    Para calcular un límite analíticamente, el primer paso consiste siempre en <strong>sustituir la variable por el valor al que tiende</strong>. Dependiendo del resultado que obtengamos, nos encontraremos ante diferentes situaciones.
                                </p>
                            </div>

                            <div className="space-y-6 mb-10">
                                {/* CASO 1 */}
                                <div className="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                                    <h4 className="font-bold text-lg mb-2 text-slate-800">Caso A: Se obtiene un número real</h4>
                                    <p className="text-lg text-slate-600 mb-4">Ese valor será directamente el límite buscado.</p>
                                    <div className="bg-slate-50 p-4 rounded border border-slate-200 text-center overflow-x-auto">
                                        <Latex math="\displaystyle \lim_{x \to -2} \frac{x^2 - 3}{x + 1} = \frac{(-2)^2 - 3}{-2 + 1} = \frac{4 - 3}{-1} = \mathbf{-1}" />
                                    </div>
                                </div>

                                {/* CASO 2 */}
                                <div className="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                                    <h4 className="font-bold text-lg mb-2 text-slate-800">Caso B: Un número distinto de cero partido por cero <Latex math="\left( \frac{k}{0} \right)" /></h4>
                                    <p className="text-lg text-slate-600 mb-4">La expresión tiende a infinito. No es un número real, pero nos indica que la función <strong>diverge</strong> (habrá que estudiar límites laterales para ver el signo).</p>
                                    <div className="bg-slate-50 p-4 rounded border border-slate-200 text-center overflow-x-auto">
                                        <Latex math="\displaystyle \lim_{x \to 2} \frac{-1}{(x - 2)^2} = \frac{-1}{0} = \mathbf{-\infty}" />
                                    </div>
                                </div>

                                {/* CASO 3 */}
                                <div className="bg-white p-5 rounded-lg border border-slate-200 shadow-sm">
                                    <h4 className="font-bold text-lg mb-2 text-slate-800">Caso C: Aparecen infinitos, pero el valor se puede determinar</h4>
                                    <p className="text-lg text-slate-600 mb-4">Aplicamos las reglas de la "Aritmética del Infinito" para deducir el resultado.</p>
                                    <div className="bg-slate-50 p-4 rounded border border-slate-200 text-center overflow-x-auto flex flex-col md:flex-row justify-center gap-8">
                                        <div><Latex math="\displaystyle \lim_{x \to +\infty} \frac{4}{x} = \frac{4}{+\infty} = \mathbf{0}" /></div>
                                        <div><Latex math="\displaystyle \lim_{x \to +\infty} (x \cdot e^x) = (+\infty) \cdot (+\infty) = \mathbf{+\infty}" /></div>
                                    </div>
                                </div>
                            </div>

                            {/* TABLAS DE ARITMETICA DEL INFINITO */}
                            <InfinityArithmeticTabs />

                            {/* CASO 4: INDETERMINACIONES */}
                            <div className="mt-12">
                                <h3 className="text-2xl font-bold text-red-700 mb-4 border-b border-red-200 pb-2">Caso D: Las Indeterminaciones</h3>
                                <p className="mb-6 text-lg">
                                    A veces, al sustituir, la expresión obtenida no es real ni resulta evidente saber a qué valor o infinito tiende mediante aritmética básica. En matemáticas, decimos que se trata de una <strong>indeterminación</strong>. 
                                </p>
                                
                                <InteractiveSubstitution />

                                <p className="mt-8 mb-6 text-lg font-semibold text-slate-800">Existen 7 tipos de indeterminaciones a las que podemos llegar:</p>
                                
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
                                    <a href="#indet-inf-inf" className="bg-white p-4 rounded-xl shadow-sm border border-red-200 flex flex-col items-center justify-center aspect-square transform transition hover:scale-105 hover:bg-red-50 hover:border-red-400 cursor-pointer">
                                        <span className="text-4xl font-bold text-red-600"><Latex math="\frac{\infty}{\infty}" /></span>
                                    </a>
                                    <a href="#indet-0-0" className="bg-white p-4 rounded-xl shadow-sm border border-red-200 flex flex-col items-center justify-center aspect-square transform transition hover:scale-105 hover:bg-red-50 cursor-pointer" title="Próximamente">
                                        <span className="text-4xl font-bold text-red-600"><Latex math="\frac{0}{0}" /></span>
                                    </a>
                                    <a href="#indet-inf-menos-inf" className="bg-white p-4 rounded-xl shadow-sm border border-red-200 flex flex-col items-center justify-center aspect-square transform transition hover:scale-105 hover:bg-red-50 cursor-pointer" title="Próximamente">
                                        <span className="text-4xl font-bold text-red-600"><Latex math="\infty - \infty" /></span>
                                    </a>
                                    <a href="#indet-0-por-inf" className="bg-white p-4 rounded-xl shadow-sm border border-red-200 flex flex-col items-center justify-center aspect-square transform transition hover:scale-105 hover:bg-red-50 cursor-pointer" title="Próximamente">
                                        <span className="text-4xl font-bold text-red-600"><Latex math="0 \cdot \infty" /></span>
                                    </a>
                                    <a href="#indet-1-inf" className="bg-white p-4 rounded-xl shadow-sm border border-red-200 flex flex-col items-center justify-center aspect-square transform transition hover:scale-105 hover:bg-red-50 cursor-pointer" title="Próximamente">
                                        <span className="text-4xl font-bold text-red-600"><Latex math="1^\infty" /></span>
                                    </a>
                                    <a href="#indet-inf-0" className="bg-white p-4 rounded-xl shadow-sm border border-red-200 flex flex-col items-center justify-center aspect-square transform transition hover:scale-105 hover:bg-red-50 cursor-pointer" title="Próximamente">
                                        <span className="text-4xl font-bold text-red-600"><Latex math="\infty^0" /></span>
                                    </a>
                                    <a href="#indet-0-0-pot" className="bg-white p-4 rounded-xl shadow-sm border border-red-200 flex flex-col items-center justify-center aspect-square transform transition hover:scale-105 hover:bg-red-50 cursor-pointer" title="Próximamente">
                                        <span className="text-4xl font-bold text-red-600"><Latex math="0^0" /></span>
                                    </a>
                                </div>
                            </div>

                            {/* RESOLUCIÓN INDETERMINACIÓN INF / INF */}
                            <div id="indet-inf-inf" className="mt-12 bg-white rounded-xl shadow-md border border-blue-200 overflow-hidden scroll-mt-6">
                                <div className="bg-blue-600 p-6">
                                    <h3 className="text-2xl font-bold text-white mb-2">Resolución: Indeterminación <Latex math="\frac{\infty}{\infty}" /></h3>
                                    <p className="text-blue-100 text-lg">Suele aparecer al calcular el límite en el infinito de funciones racionales (fracciones con polinomios).</p>
                                </div>
                                
                                <div className="p-6">
                                    <div className="mb-8">
                                        <h3 className="text-xl font-bold text-slate-800 mb-4 border-b border-slate-200 pb-2">El método matemático formal</h3>
                                        <p className="text-lg mb-4 text-slate-700">
                                            Para resolver esta indeterminación, el método riguroso consiste en <strong>dividir todos los términos del numerador y del denominador por la <Latex math="x" /> elevada al mayor grado</strong> que aparezca en la fracción.
                                        </p>
                                        <div className="bg-slate-50 p-6 rounded-lg border border-slate-200 shadow-sm overflow-x-auto text-center text-lg">
                                            <div className="mb-2 font-semibold text-slate-600 text-left">Ejemplo paso a paso:</div>
                                            <Latex math="\displaystyle \lim_{x \to +\infty} \frac{2x^2 + 3x - 1}{x^2 + 5} = \left[ \frac{\infty}{\infty} \right]" display={true} />
                                            <p className="text-slate-500 italic my-4">Dividimos todo entre <Latex math="x^2" /> (el mayor grado presente):</p>
                                            <Latex math="\displaystyle \lim_{x \to +\infty} \frac{\frac{2x^2}{x^2} + \frac{3x}{x^2} - \frac{1}{x^2}}{\frac{x^2}{x^2} + \frac{5}{x^2}} = \lim_{x \to +\infty} \frac{2 + \frac{3}{x} - \frac{1}{x^2}}{1 + \frac{5}{x^2}}" display={true} />
                                            <p className="text-slate-500 italic my-4">Como cualquier número dividido entre infinito da cero (<Latex math="\frac{k}{\infty} = 0" />):</p>
                                            <Latex math="\displaystyle \frac{2 + 0 - 0}{1 + 0} = \mathbf{2}" display={true} />
                                        </div>
                                    </div>

                                    <div className="bg-blue-50 p-6 rounded-lg mb-8 border-l-4 border-blue-500">
                                        <h3 className="font-bold text-blue-800 mb-4 text-lg">En la práctica: La regla de los grados (Términos dominantes)</h3>
                                        <p className="text-lg mb-4 text-slate-700">
                                            Si te fijas en el ejemplo anterior, los términos de menor grado acabaron siendo divididos por alguna potencia de <Latex math="x" /> (como <Latex math="x" />, <Latex math="x^2" />...) y se convirtieron en ceros. 
                                        </p>
                                        <p className="text-lg mb-4 text-slate-700">
                                            Por lo tanto, para ir mucho más rápido, <strong>podemos ignorar directamente el resto del polinomio y quedarnos solo con el término de mayor grado del numerador y del denominador</strong>.
                                        </p>
                                        <p className="text-lg text-blue-900 font-semibold">
                                            Al simplificar la fracción resultante, siempre nos encontraremos con uno de estos 3 casos:
                                        </p>
                                    </div>

                                    <InteractiveInfOverInf />
                                </div>
                            </div>

                        </Accordion>

                    </main>
                </div>
            );
        }

        // ---------------------------------------------------------
        // COMPONENTES APARTADO 5: ARITMÉTICA E INDETERMINACIONES
        // ---------------------------------------------------------

        const InfinityArithmeticTabs = () => {
            const [activeTab, setActiveTab] = useState('suma');

            const tabs = [
                { id: 'suma', label: 'Suma y Resta', icon: '+' },
                { id: 'producto', label: 'Producto', icon: '×' },
                { id: 'cociente', label: 'Cociente', icon: '÷' },
                { id: 'potencia', label: 'Potencia', icon: '^' }
            ];

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="bg-slate-100 px-6 py-4 border-b border-slate-200">
                        <h4 className="font-bold text-lg text-slate-800">Aritmética del Infinito (Operaciones válidas)</h4>
                        <p className="text-sm text-slate-500">Reglas matemáticas para operar con valores infinitos y números reales.</p>
                    </div>
                    
                    <div className="flex flex-wrap border-b border-slate-200 bg-slate-50">
                        {tabs.map(tab => (
                            <button 
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`px-6 py-3 font-semibold text-sm transition-colors flex-1 md:flex-none ${activeTab === tab.id ? 'bg-white text-blue-600 border-b-2 border-blue-600' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-100'}`}
                            >
                                <span className="mr-2 opacity-70">{tab.icon}</span> {tab.label}
                            </button>
                        ))}
                    </div>

                    <div className="p-6">
                        {activeTab === 'suma' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-lg animate-fade-in">
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="(+\infty) + k = +\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="(+\infty) - k = +\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="(-\infty) + k = -\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="(-\infty) - k = -\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="(+\infty) + (+\infty) = +\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="(-\infty) + (-\infty) = -\infty" /></div>
                            </div>
                        )}
                        {activeTab === 'producto' && (
                            <div className="grid grid-cols-1 gap-4 text-lg animate-fade-in">
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-center">
                                    <Latex math="\displaystyle k \cdot (+\infty) = \begin{cases} +\infty & \text{si } k > 0 \\ -\infty & \text{si } k < 0 \end{cases}" />
                                </div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-center">
                                    <Latex math="\displaystyle k \cdot (-\infty) = \begin{cases} -\infty & \text{si } k > 0 \\ +\infty & \text{si } k < 0 \end{cases}" />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="(+\infty) \cdot (+\infty) = +\infty" /></div>
                                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="(-\infty) \cdot (-\infty) = +\infty" /></div>
                                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center md:col-span-2"><Latex math="(+\infty) \cdot (-\infty) = -\infty" /></div>
                                </div>
                            </div>
                        )}
                        {activeTab === 'cociente' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-lg animate-fade-in">
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="\displaystyle \frac{k}{\pm\infty} = 0" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="\displaystyle \frac{0}{\pm\infty} = 0" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-center md:col-span-2">
                                    <Latex math="\displaystyle \frac{k}{0} = \begin{cases} +\infty & \text{si } k > 0 \\ -\infty & \text{si } k < 0 \end{cases}" />
                                    <p className="text-sm text-slate-500 mt-2 italic">* Siempre estudiando el signo de los límites laterales</p>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="\displaystyle \frac{+\infty}{0} = \pm\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="\displaystyle \frac{-\infty}{0} = \pm\infty" /></div>
                            </div>
                        )}
                        {activeTab === 'potencia' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-lg animate-fade-in">
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-center md:col-span-2">
                                    <Latex math="\displaystyle k^{+\infty} = \begin{cases} +\infty & \text{si } k > 1 \\ 0 & \text{si } 0 \le k < 1 \end{cases}" />
                                </div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-center md:col-span-2">
                                    <Latex math="\displaystyle k^{-\infty} = \begin{cases} 0 & \text{si } k > 1 \\ +\infty & \text{si } 0 \le k < 1 \end{cases}" />
                                </div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-center md:col-span-2">
                                    <Latex math="\displaystyle (+\infty)^{k} = \begin{cases} +\infty & \text{si } k > 0 \\ 0 & \text{si } k < 0 \end{cases}" />
                                </div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="(+\infty)^{+\infty} = +\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center"><Latex math="(+\infty)^{-\infty} = 0" /></div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const InteractiveSubstitution = () => {
            const [step, setStep] = useState(0);

            return (
                <div className="border border-slate-200 rounded-xl overflow-hidden mb-8 mt-6 max-w-2xl mx-auto shadow-sm">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 text-center">
                        <h4 className="font-bold text-lg text-slate-700">Comprobación interactiva: ¿Qué pasa si sustituyo?</h4>
                    </div>
                    <div className="p-6 text-center bg-white">
                        <div className="flex justify-center mb-8 h-20 items-center">
                            <div className="text-2xl font-bold transition-all duration-500">
                                {step === 0 && <Latex math="\displaystyle \lim_{x \to 1} \frac{x^2 - 3x + 2}{x - 1}" />}
                                {step === 1 && <Latex math="\displaystyle \frac{1^2 - 3(1) + 2}{1 - 1}" />}
                                {step === 2 && <Latex math="\displaystyle \frac{1 - 3 + 2}{0}" />}
                                {step === 3 && <div className="text-red-600 scale-125 transform transition-transform"><Latex math="\displaystyle \frac{0}{0}" /></div>}
                            </div>
                        </div>
                        <div className="flex justify-center gap-4 flex-wrap">
                            <button 
                                onClick={() => setStep(Math.min(3, step + 1))} 
                                disabled={step === 3} 
                                className={`font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2 text-white ${step === 3 ? 'bg-red-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}
                            >
                                {step === 0 ? "Paso 1: Sustituir la x por 1" : 
                                 step === 1 ? "Paso 2: Operar términos" : 
                                 step === 2 ? "Paso 3: Ver resultado final" : 
                                 "Indeterminación detectada"}
                            </button>
                            {step > 0 && (
                                <button onClick={() => setStep(0)} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-6 rounded-lg transition-colors">
                                    Reiniciar
                                </button>
                            )}
                        </div>
                        
                        {step === 3 && (
                            <div className="mt-8 p-4 bg-red-50 text-red-900 rounded-lg animate-fade-in border border-red-200">
                                <span className="block text-2xl mb-2">🚨</span>
                                ¡Atención! Hemos llegado a <Latex math="\frac{0}{0}" />. <br/>
                                Como <strong>no sabemos a qué valor tiende ni si es infinito</strong>, estamos ante una <strong>indeterminación</strong>. En el próximo apartado veremos cómo resolver este tipo de funciones.
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const InteractiveInfOverInf = () => {
            const [activeCase, setActiveCase] = useState(0);

            const cases = [
                {
                    id: 0,
                    title: "Grado Numerador > Grado Denominador",
                    conclusion: "Gana el numerador: El límite siempre es +∞ o -∞",
                    latexFunc: "\\displaystyle \\lim_{x \\to +\\infty} \\frac{2x^3 - 5x + 1}{x^2 + 3}",
                    latexSteps: [
                        "\\approx \\displaystyle \\lim_{x \\to +\\infty} \\frac{2x^3}{x^2}",
                        "= \\displaystyle \\lim_{x \\to +\\infty} 2x",
                        "= +\\infty"
                    ],
                    func: (x) => (2 * Math.pow(x, 3) - 5 * x + 1) / (Math.pow(x, 2) + 3),
                    asymptote: null
                },
                {
                    id: 1,
                    title: "Grado Numerador < Grado Denominador",
                    conclusion: "Gana el denominador: El límite siempre es 0",
                    latexFunc: "\\displaystyle \\lim_{x \\to +\\infty} \\frac{4x^2 - x}{2x^3 + 5}",
                    latexSteps: [
                        "\\approx \\displaystyle \\lim_{x \\to +\\infty} \\frac{4x^2}{2x^3}",
                        "= \\displaystyle \\lim_{x \\to +\\infty} \\frac{2}{x}",
                        "= 0"
                    ],
                    func: (x) => (4 * Math.pow(x, 2) - x) / (2 * Math.pow(x, 3) + 5),
                    asymptote: 0
                },
                {
                    id: 2,
                    title: "Grados Iguales",
                    conclusion: "Empate: El límite es el cociente de los coeficientes",
                    latexFunc: "\\displaystyle \\lim_{x \\to +\\infty} \\frac{6x^2 + 2x}{3x^2 - 1}",
                    latexSteps: [
                        "\\approx \\displaystyle \\lim_{x \\to +\\infty} \\frac{6x^2}{3x^2}",
                        "= \\displaystyle \\lim_{x \\to +\\infty} \\frac{6}{3}",
                        "= 2"
                    ],
                    func: (x) => (6 * Math.pow(x, 2) + 2 * x) / (3 * Math.pow(x, 2) - 1),
                    asymptote: 2
                }
            ];

            const current = cases[activeCase];
            const infinitySteps = [10, 50, 200, 1000];

            return (
                <div className="mb-4 border border-slate-200 rounded-xl overflow-hidden mt-6 shadow-sm">
                    {/* Selector de casos */}
                    <div className="flex flex-col md:flex-row border-b border-slate-200 bg-slate-100">
                        {cases.map((c, idx) => (
                            <button 
                                key={c.id}
                                onClick={() => setActiveCase(idx)}
                                className={`flex-1 py-4 px-4 text-center transition-colors border-b md:border-b-0 md:border-r border-slate-200 last:border-r-0 last:border-b-0 ${activeCase === idx ? 'bg-white border-b-2 border-blue-600 shadow-inner' : 'hover:bg-slate-200'}`}
                            >
                                <span className={`block font-bold text-sm md:text-base ${activeCase === idx ? 'text-blue-700' : 'text-slate-600'}`}>{c.title}</span>
                            </button>
                        ))}
                    </div>

                    <div className="p-4 md:p-6 bg-white">
                        {/* Explicación matemática paso a paso */}
                        <div className="bg-slate-50 p-4 md:p-6 rounded-xl border border-slate-200 mb-8 flex flex-col items-center">
                            <h4 className="font-bold text-lg md:text-xl text-slate-800 mb-6 text-center border-b border-slate-300 pb-2">{current.conclusion}</h4>
                            
                            <div className="flex flex-col lg:flex-row items-center justify-center gap-6 text-lg md:text-xl w-full">
                                <div className="bg-white px-6 py-4 rounded-lg shadow-sm border border-slate-200 overflow-x-auto min-w-[200px] text-center">
                                    <Latex math={current.latexFunc} />
                                </div>
                                <div className="text-slate-400 text-3xl rotate-90 lg:rotate-0">➜</div>
                                <div className="flex flex-col gap-3 bg-white px-6 py-4 rounded-lg shadow-sm border border-slate-200 overflow-x-auto min-w-[200px]">
                                    {current.latexSteps.map((step, idx) => (
                                        <div key={idx} className={idx === current.latexSteps.length - 1 ? "font-bold text-blue-700 mt-2 text-2xl text-center border-t border-blue-100 pt-2" : "text-slate-600"}>
                                            <Latex math={step} />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Motor Gráfico Reutilizado */}
                        <div key={`graph-case-${activeCase}`}>
                            <h4 className="font-bold text-slate-700 mb-4 text-center">Comprobación gráfica interactiva:</h4>
                            <InfinityInteractive 
                                func={current.func} 
                                infinitySteps={infinitySteps} 
                                horizontalAsymptote={current.asymptote} 
                            />
                        </div>
                    </div>
                </div>
            );
        };


        // ---------------------------------------------------------
        // COMPONENTES DE EJEMPLOS ANTERIORES (1, 2, 3, 4, 5, 6, 7)
        // ---------------------------------------------------------

        const InteractiveExample1 = () => {
            const [step, setStep] = useState(0);
            const steps = [0.1, 0.01, 0.001];
            const func = (x) => x * x + 1;

            return (
                <div className="mb-12 border border-slate-200 rounded-xl overflow-hidden">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 1: Función continua</h4>
                        <div className="text-xl font-bold text-blue-700 bg-white px-4 py-3 rounded-lg shadow-sm">
                            <Latex math="\displaystyle \lim_{x \to 2} (x^2 + 1) = 5" />
                        </div>
                    </div>
                    <div className="p-6">
                        <LimitInteractive targetX={2} targetY={5} func={func} step={step} setStep={setStep} steps={steps} graphDomain={[0, 4]} graphRange={[0, 7]} />
                    </div>
                </div>
            );
        };

        const InteractiveExample2 = () => {
            const [step, setStep] = useState(0);
            const steps = [0.1, 0.01, 0.001];
            const func = (x) => {
                if (Math.abs(x - 1) < 0.0000001) return null;
                return (x * x - 1) / (x - 1);
            };

            return (
                <div className="mb-12 border border-slate-200 rounded-xl overflow-hidden">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 2: Discontinuidad evitable</h4>
                        <div className="text-xl font-bold text-blue-700 bg-white px-4 py-3 rounded-lg shadow-sm">
                            <Latex math="\displaystyle \lim_{x \to 1} \frac{x^2 - 1}{x - 1} = 2" />
                        </div>
                    </div>
                    <div className="p-6">
                        <LimitInteractive targetX={1} targetY={2} func={func} step={step} setStep={setStep} steps={steps} holeAtTarget={true} graphDomain={[-1, 3]} graphRange={[-1, 4]} />
                    </div>
                </div>
            );
        };

        const InteractiveExample3 = () => {
            const [step, setStep] = useState(0);
            const steps = [0.1, 0.01, 0.000001];
            const func = (x) => Math.floor(x);

            return (
                <div className="mb-12 border border-slate-200 rounded-xl overflow-hidden">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 3: Función "Parte Entera"</h4>
                        <div className="text-xl font-bold text-red-700 bg-white px-4 py-3 rounded-lg shadow-sm">
                            <Latex math="\displaystyle \lim_{x \to 3} [x] \to \text{No existe}" />
                        </div>
                    </div>
                    <div className="p-6">
                        <LimitInteractive targetX={3} targetY={3} func={func} step={step} setStep={setStep} steps={steps} isStepFunction={true} graphDomain={[0, 5]} graphRange={[0, 5]} />
                    </div>
                </div>
            );
        };

        const InteractiveExample4 = () => {
            const [step, setStep] = useState(0);
            const steps = [0.1, 0.01, 0.001];
            const func = (x) => {
                if (Math.abs(x - 2) < 0.000001) return null;
                if (x < 2) return x + 1;
                return x - 1;
            };

            return (
                <div className="mb-8 border border-slate-200 rounded-xl overflow-hidden mt-8">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 4: Salto Finito</h4>
                        <div className="text-lg font-bold text-purple-700 bg-white px-4 py-2 rounded-lg shadow-sm">
                            <Latex math="f(x) = \begin{cases} x+1 & x < 2 \\ x-1 & x > 2 \end{cases}" />
                        </div>
                    </div>
                    <div className="p-6">
                        <LimitInteractive targetX={2} targetY={2} func={func} step={step} setStep={setStep} steps={steps} breakAtTarget={true} graphDomain={[0, 4]} graphRange={[0, 4]} />
                    </div>
                </div>
            );
        };

        const InteractiveExample5 = () => {
            const [step, setStep] = useState(0);
            const steps = [0.1, 0.01, 0.001, 0.0001, 0.00001];
            
            const func = (x) => {
                if (Math.abs(x) < 0.0000001) return null; // Asíntota en x=0
                return 1 / (x * x);
            };

            let currentDx = 4;
            let maxY = 12;
            if (step > 0) {
                currentDx = steps[step - 1] * 5; 
                maxY = func(0 - steps[step - 1]) * 1.2; 
            }

            return (
                <div className="mb-8 border border-slate-200 rounded-xl overflow-hidden mt-8">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 5: Divergencia positiva</h4>
                        <div className="text-lg font-bold text-blue-700 bg-white px-4 py-2 rounded-lg shadow-sm">
                            <Latex math="\displaystyle \lim_{x \to 0} \frac{1}{x^2} = +\infty" />
                        </div>
                    </div>
                    <div className="p-6">
                        <LimitInteractive 
                            targetX={0} targetY={null} func={func} 
                            step={step} setStep={setStep} steps={steps} 
                            verticalAsymptote={0} 
                            graphDomain={[-currentDx, currentDx]} 
                            graphRange={[-maxY * 0.1, maxY]} 
                            hideZoom={true} 
                            isDivergent={true}
                        />
                    </div>
                </div>
            );
        };

        const InteractiveExample6 = () => {
            const [stepLeft, setStepLeft] = useState(0);
            const [stepRight, setStepRight] = useState(0);
            const steps = [0.1, 0.01, 0.001, 0.0001, 0.00001];
            
            const func = (x) => {
                if (Math.abs(x - 2) < 0.0000001) return null; // Asíntota en x=2
                return 1 / (x - 2);
            };

            const handleSetStepLeft = (val) => {
                setStepLeft(val);
                if (val > 0) setStepRight(0);
            };

            const handleSetStepRight = (val) => {
                setStepRight(val);
                if (val > 0) setStepLeft(0);
            };

            let currentDx = 4;
            let minY = -15;
            let maxY = 15;
            let centerX = 2;

            if (stepLeft > 0) {
                currentDx = steps[stepLeft - 1] * 5;
                minY = func(2 - steps[stepLeft - 1]) * 1.2; 
                maxY = Math.abs(minY) * 0.1; 
                centerX = 2 - steps[stepLeft - 1]; 
            } else if (stepRight > 0) {
                currentDx = steps[stepRight - 1] * 5;
                maxY = func(2 + steps[stepRight - 1]) * 1.2; 
                minY = -maxY * 0.1; 
                centerX = 2 + steps[stepRight - 1]; 
            }

            return (
                <div className="mb-8 border border-slate-200 rounded-xl overflow-hidden mt-8">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center flex-wrap gap-4">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 6: Divergencia con cambio de signo</h4>
                        <div className="flex gap-4">
                            <div className="text-lg font-bold text-blue-700 bg-white px-4 py-2 rounded-lg shadow-sm">
                                <Latex math="\displaystyle \lim_{x \to 2^-} \frac{1}{x-2} = -\infty" />
                            </div>
                            <div className="text-lg font-bold text-rose-700 bg-white px-4 py-2 rounded-lg shadow-sm">
                                <Latex math="\displaystyle \lim_{x \to 2^+} \frac{1}{x-2} = +\infty" />
                            </div>
                        </div>
                    </div>
                    <div className="p-6">
                        <LimitInteractive 
                            targetX={2} targetY={null} func={func} steps={steps} 
                            verticalAsymptote={2} 
                            graphDomain={[centerX - currentDx, centerX + currentDx]} 
                            graphRange={[minY, maxY]} 
                            hideZoom={true} 
                            splitApproaches={true}
                            stepLeft={stepLeft} setStepLeft={handleSetStepLeft}
                            stepRight={stepRight} setStepRight={handleSetStepRight}
                            isDivergent={true}
                        />
                    </div>
                </div>
            );
        };

        const InteractiveExample7 = () => {
            const func = (x) => (10 + 2 * x * x) / (8 + x * x);
            const infinitySteps = [10, 50, 200, 1000];

            return (
                <div className="mb-8 border border-slate-200 rounded-xl overflow-hidden mt-8">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 7: Asíntota Horizontal</h4>
                        <div className="text-lg font-bold text-indigo-700 bg-white px-4 py-2 rounded-lg shadow-sm">
                            <Latex math="\displaystyle \lim_{x \to \pm\infty} \frac{10 + 2x^2}{8 + x^2} = 2" />
                        </div>
                    </div>
                    <div className="p-6">
                        <InfinityInteractive func={func} infinitySteps={infinitySteps} horizontalAsymptote={2} />
                    </div>
                </div>
            );
        };

        // ---------------------------------------------------------
        // MOTORES DE INTERACCIÓN Y GRÁFICOS
        // ---------------------------------------------------------

        const LimitInteractive = ({ targetX, targetY, func, step, setStep, steps, holeAtTarget = false, breakAtTarget = false, isStepFunction = false, verticalAsymptote = null, hideZoom = false, splitApproaches = false, stepLeft, setStepLeft, stepRight, setStepRight, graphDomain, graphRange, isDivergent = false }) => {
            
            const [isZoomed, setIsZoomed] = useState(false);

            const activeStepLeft = splitApproaches ? stepLeft : step;
            const activeStepRight = splitApproaches ? stepRight : step;

            const formatNum = (num) => {
                if (num === null || isNaN(num)) return "Indefinido";
                if (Math.abs(num) >= 100000) {
                    const [base, exp] = num.toExponential(2).split('e');
                    return `${base.replace('.', ',')} \times 10^{${exp.replace('+', '')}}`;
                }
                return parseFloat(num.toFixed(4)).toString().replace('.', ',');
            };

            const getLeftRows = () => {
                let rows = [];
                for (let i = 0; i < activeStepLeft; i++) {
                    let x = targetX - steps[i];
                    rows.push({ x: parseFloat(x.toFixed(5)).toString().replace('.', ','), y: formatNum(func(x)) });
                }
                return rows;
            };

            const getRightRows = () => {
                let rows = [];
                for (let i = 0; i < activeStepRight; i++) {
                    let x = targetX + steps[i];
                    rows.push({ x: parseFloat(x.toFixed(5)).toString().replace('.', ','), y: formatNum(func(x)) });
                }
                return rows;
            };

            const btnTextLeft = activeStepLeft === steps.length 
                ? (isDivergent ? "Divergencia" : "Límite Izquierdo") 
                : "Acercarse por la izquierda";

            const btnTextRight = activeStepRight === steps.length 
                ? (isDivergent ? "Divergencia" : "Límite Derecho") 
                : "Acercarse por la derecha";

            const btnTextCenter = step === steps.length 
                ? (isDivergent ? "Divergencia" : "Límite alcanzado") 
                : `Acercarse más a x = ${targetX}`;

            return (
                <div>
                    <div className="flex justify-center mb-8 flex-wrap gap-4">
                        {splitApproaches ? (
                            <>
                                <button 
                                    onClick={() => { setStepLeft(Math.min(steps.length, stepLeft + 1)); setIsZoomed(false); }}
                                    disabled={stepLeft === steps.length}
                                    className={`text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2 ${stepLeft === steps.length ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}
                                >
                                    {btnTextLeft}
                                </button>
                                <button 
                                    onClick={() => { setStepRight(Math.min(steps.length, stepRight + 1)); setIsZoomed(false); }}
                                    disabled={stepRight === steps.length}
                                    className={`text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2 ${stepRight === steps.length ? 'bg-rose-400 cursor-not-allowed' : 'bg-rose-600 hover:bg-rose-700'}`}
                                >
                                    {btnTextRight}
                                </button>
                            </>
                        ) : (
                            <button 
                                onClick={() => { setStep(Math.min(steps.length, step + 1)); setIsZoomed(false); }}
                                disabled={step === steps.length}
                                className={`text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2 ${step === steps.length ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}
                            >
                                {btnTextCenter}
                            </button>
                        )}
                        
                        {((splitApproaches ? (stepLeft === steps.length || stepRight === steps.length) : (step === steps.length)) && !hideZoom) && (
                            <button 
                                onClick={() => setIsZoomed(!isZoomed)}
                                className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                                {isZoomed ? "Quitar Zoom" : "Ver detalle del punto"}
                            </button>
                        )}

                        {(splitApproaches ? (stepLeft > 0 || stepRight > 0) : (step > 0)) && (
                            <button 
                                onClick={() => { if(splitApproaches){ setStepLeft(0); setStepRight(0); } else { setStep(0); } setIsZoomed(false); }}
                                className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-6 rounded-lg transition-colors"
                            >
                                Reiniciar
                            </button>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="flex flex-col gap-6">
                            <div className={`bg-white rounded-lg border ${splitApproaches && stepRight > 0 ? 'border-slate-100 opacity-50' : 'border-slate-200'} shadow-sm overflow-hidden transition-opacity`}>
                                <div className="bg-blue-50 py-2 text-center text-sm font-semibold text-blue-800 border-b border-blue-100">
                                    Acercándose por la izquierda (<Latex math={`x \\to ${targetX}^-`} />)
                                </div>
                                <table className="w-full text-center">
                                    <thead className="bg-slate-50 border-b border-slate-200">
                                        <tr><th className="py-2 px-4 w-1/2 border-r border-slate-200"><Latex math="x" /></th><th className="py-2 px-4 w-1/2"><Latex math="f(x)" /></th></tr>
                                    </thead>
                                    <tbody>
                                        {getLeftRows().map((r, i) => (
                                            <tr key={i} className="border-b border-slate-100 bg-blue-50/20">
                                                <td className="py-2 px-4 border-r border-slate-200 font-mono text-sm">{r.x}</td>
                                                <td className="py-2 px-4 font-mono text-sm font-semibold text-blue-700">
                                                    {r.y.includes('times') ? <Latex math={r.y} /> : r.y}
                                                </td>
                                            </tr>
                                        ))}
                                        {activeStepLeft === 0 && <tr><td colSpan="2" className="py-4 text-slate-400 italic text-sm">Haz clic en acercarse...</td></tr>}
                                    </tbody>
                                </table>
                            </div>

                            <div className={`bg-white rounded-lg border ${splitApproaches && stepLeft > 0 ? 'border-slate-100 opacity-50' : 'border-slate-200'} shadow-sm overflow-hidden transition-opacity`}>
                                <div className="bg-rose-50 py-2 text-center text-sm font-semibold text-rose-800 border-b border-rose-100">
                                    Acercándose por la derecha (<Latex math={`x \\to ${targetX}^+`} />)
                                </div>
                                <table className="w-full text-center">
                                    <thead className="bg-slate-50 border-b border-slate-200">
                                        <tr><th className="py-2 px-4 w-1/2 border-r border-slate-200"><Latex math="x" /></th><th className="py-2 px-4 w-1/2"><Latex math="f(x)" /></th></tr>
                                    </thead>
                                    <tbody>
                                        {getRightRows().map((r, i) => (
                                            <tr key={i} className="border-b border-slate-100 bg-rose-50/20">
                                                <td className="py-2 px-4 border-r border-slate-200 font-mono text-sm">{r.x}</td>
                                                <td className="py-2 px-4 font-mono text-sm font-semibold text-rose-700">
                                                    {r.y.includes('times') ? <Latex math={r.y} /> : r.y}
                                                </td>
                                            </tr>
                                        ))}
                                        {activeStepRight === 0 && <tr><td colSpan="2" className="py-4 text-slate-400 italic text-sm">Haz clic en acercarse...</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="bg-white rounded-lg border border-slate-200 shadow-sm p-4 relative flex items-center justify-center min-h-[350px] overflow-hidden">
                            <SvgGraph 
                                baseDomain={graphDomain} baseRange={graphRange} func={func} targetX={targetX} targetY={targetY}
                                currentStepLeft={splitApproaches ? (stepLeft > 0 ? steps[stepLeft - 1] : null) : (step > 0 ? steps[step - 1] : null)} 
                                currentStepRight={splitApproaches ? (stepRight > 0 ? steps[stepRight - 1] : null) : (step > 0 ? steps[step - 1] : null)} 
                                holeAtTarget={holeAtTarget} isStepFunction={isStepFunction} 
                                breakAtTarget={breakAtTarget} verticalAsymptote={verticalAsymptote} isZoomed={isZoomed}
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const InfinityInteractive = ({ func, infinitySteps, horizontalAsymptote }) => {
            const [stepLeft, setStepLeft] = useState(0);
            const [stepRight, setStepRight] = useState(0);
            
            const handleSetStepLeft = (val) => {
                setStepLeft(val);
                if (val > 0) setStepRight(0);
            };

            const handleSetStepRight = (val) => {
                setStepRight(val);
                if (val > 0) setStepLeft(0);
            };

            const formatNum = (num) => {
                if (Math.abs(num) >= 100000) {
                    const [base, exp] = num.toExponential(2).split('e');
                    return `${base.replace('.', ',')} \\times 10^{${exp.replace('+', '')}}`;
                }
                return parseFloat(num.toFixed(6)).toString().replace('.', ',');
            }

            const getLeftRows = () => {
                let rows = [];
                for (let i = 0; i < stepLeft; i++) {
                    let x = -infinitySteps[i];
                    rows.push({ x: x, y: formatNum(func(x)) });
                }
                return rows;
            };

            const getRightRows = () => {
                let rows = [];
                for (let i = 0; i < stepRight; i++) {
                    let x = infinitySteps[i];
                    rows.push({ x: x, y: formatNum(func(x)) });
                }
                return rows;
            };

            let currentMinX = -15;
            let currentMaxX = 15;
            if (stepLeft > 0) currentMinX = -infinitySteps[stepLeft - 1] * 1.2;
            if (stepRight > 0) currentMaxX = infinitySteps[stepRight - 1] * 1.2;
            
            const graphDomain = [currentMinX, currentMaxX];
            
            let currentMinY = 0;
            let currentMaxY = 4;
            const activeStep = Math.max(stepLeft, stepRight);
            
            if (activeStep > 0 && horizontalAsymptote !== null && horizontalAsymptote !== undefined) {
                const currentX = stepLeft > 0 ? -infinitySteps[activeStep - 1] : infinitySteps[activeStep - 1];
                const currentY = func(currentX);
                const gap = horizontalAsymptote - currentY;
                
                // Si el gap es muy pequeño o el valor explota (asíntota null), mantenemos una escala lógica
                if (Math.abs(gap) > 0.0001) {
                    currentMinY = horizontalAsymptote - Math.abs(gap) * 3;
                    currentMaxY = horizontalAsymptote + Math.abs(gap) * 3;
                }
            } else if (activeStep > 0 && horizontalAsymptote === null) {
                // Caso divergente
                const currentX = stepLeft > 0 ? -infinitySteps[activeStep - 1] : infinitySteps[activeStep - 1];
                const currentY = func(currentX);
                if (currentY > 0) {
                    currentMaxY = currentY * 1.2;
                    currentMinY = -currentMaxY * 0.1;
                } else {
                    currentMinY = currentY * 1.2;
                    currentMaxY = Math.abs(currentMinY) * 0.1;
                }
            }

            const graphRange = [currentMinY, currentMaxY];

            return (
                <div>
                    <div className="flex justify-center mb-8 flex-wrap gap-4">
                        <button 
                            onClick={() => handleSetStepLeft(Math.min(infinitySteps.length, stepLeft + 1))}
                            disabled={stepLeft === infinitySteps.length}
                            className={`text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2 ${stepLeft === infinitySteps.length ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}
                        >
                            Alejarse hacia -∞
                        </button>
                        
                        <button 
                            onClick={() => handleSetStepRight(Math.min(infinitySteps.length, stepRight + 1))}
                            disabled={stepRight === infinitySteps.length}
                            className={`text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2 ${stepRight === infinitySteps.length ? 'bg-rose-400 cursor-not-allowed' : 'bg-rose-600 hover:bg-rose-700'}`}
                        >
                            Alejarse hacia +∞
                        </button>
                        
                        {(stepLeft > 0 || stepRight > 0) && (
                            <button onClick={() => { setStepLeft(0); setStepRight(0); }} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-6 rounded-lg transition-colors">
                                Reiniciar
                            </button>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="flex flex-col gap-6">
                            <div className={`bg-white rounded-lg border ${stepRight > 0 ? 'border-slate-100 opacity-50' : 'border-slate-200'} shadow-sm overflow-hidden transition-opacity`}>
                                <div className="bg-blue-50 py-2 text-center text-sm font-semibold text-blue-800 border-b border-blue-100">
                                    Hacia menos infinito (<Latex math={`x \\to -\\infty`} />)
                                </div>
                                <table className="w-full text-center">
                                    <thead className="bg-slate-50 border-b border-slate-200">
                                        <tr><th className="py-2 px-4 w-1/2 border-r border-slate-200"><Latex math="x" /></th><th className="py-2 px-4 w-1/2"><Latex math="f(x)" /></th></tr>
                                    </thead>
                                    <tbody>
                                        {getLeftRows().map((r, i) => (
                                            <tr key={`neg-${i}`} className="border-b border-slate-100 bg-blue-50/20">
                                                <td className="py-2 px-4 border-r border-slate-200 font-mono text-sm">{r.x}</td>
                                                <td className="py-2 px-4 font-mono text-sm font-semibold text-blue-700">
                                                    {r.y.includes('times') ? <Latex math={r.y} /> : r.y}
                                                </td>
                                            </tr>
                                        ))}
                                        {stepLeft === 0 && <tr><td colSpan="2" className="py-4 text-slate-400 italic text-sm">Haz clic en alejarse...</td></tr>}
                                    </tbody>
                                </table>
                            </div>

                            <div className={`bg-white rounded-lg border ${stepLeft > 0 ? 'border-slate-100 opacity-50' : 'border-slate-200'} shadow-sm overflow-hidden transition-opacity`}>
                                <div className="bg-rose-50 py-2 text-center text-sm font-semibold text-rose-800 border-b border-rose-100">
                                    Hacia más infinito (<Latex math={`x \\to +\\infty`} />)
                                </div>
                                <table className="w-full text-center">
                                    <thead className="bg-slate-50 border-b border-slate-200">
                                        <tr><th className="py-2 px-4 w-1/2 border-r border-slate-200"><Latex math="x" /></th><th className="py-2 px-4 w-1/2"><Latex math="f(x)" /></th></tr>
                                    </thead>
                                    <tbody>
                                        {getRightRows().map((r, i) => (
                                            <tr key={`pos-${i}`} className="border-b border-slate-100 bg-rose-50/20">
                                                <td className="py-2 px-4 border-r border-slate-200 font-mono text-sm">{r.x}</td>
                                                <td className="py-2 px-4 font-mono text-sm font-semibold text-rose-700">
                                                    {r.y.includes('times') ? <Latex math={r.y} /> : r.y}
                                                </td>
                                            </tr>
                                        ))}
                                        {stepRight === 0 && <tr><td colSpan="2" className="py-4 text-slate-400 italic text-sm">Haz clic en alejarse...</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="bg-white rounded-lg border border-slate-200 shadow-sm p-4 relative flex items-center justify-center min-h-[350px] overflow-hidden">
                            <SvgGraph 
                                baseDomain={graphDomain} baseRange={graphRange} func={func} 
                                targetX={0} targetY={0} // Fallback
                                horizontalAsymptote={horizontalAsymptote}
                                isInfinityLimit={true}
                                currentStepLeft={stepLeft > 0 ? infinitySteps[stepLeft - 1] : null}
                                currentStepRight={stepRight > 0 ? infinitySteps[stepRight - 1] : null}
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const SvgGraph = ({ baseDomain, baseRange, func, targetX = null, targetY = null, currentStepLeft = null, currentStepRight = null, holeAtTarget = false, isStepFunction = false, breakAtTarget = false, verticalAsymptote = null, horizontalAsymptote = null, isZoomed = false, isInfinityLimit = false }) => {
            const width = 350, height = 350, padding = 40;
            const [animProgress, setAnimProgress] = useState(0);

            const [baseAnim, setBaseAnim] = useState({
                domain: baseDomain,
                range: baseRange,
                stepL: currentStepLeft,
                stepR: currentStepRight
            });
            const prevBaseRef = useRef({ domain: baseDomain, range: baseRange, stepL: currentStepLeft, stepR: currentStepRight });

            useEffect(() => {
                const target = { domain: baseDomain, range: baseRange, stepL: currentStepLeft, stepR: currentStepRight };
                const start = { ...prevBaseRef.current };
                
                if (start.domain[0] === target.domain[0] && start.domain[1] === target.domain[1] &&
                    start.range[0] === target.range[0] && start.range[1] === target.range[1] &&
                    start.stepL === target.stepL && start.stepR === target.stepR) {
                    return;
                }

                let startTime;
                const duration = 600; 
                let frame;

                const animate = (time) => {
                    if (!startTime) startTime = time;
                    let t = Math.min((time - startTime) / duration, 1);
                    t = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; 

                    const nextState = {
                        domain: [
                            start.domain[0] + (target.domain[0] - start.domain[0]) * t,
                            start.domain[1] + (target.domain[1] - start.domain[1]) * t
                        ],
                        range: [
                            start.range[0] + (target.range[0] - start.range[0]) * t,
                            start.range[1] + (target.range[1] - start.range[1]) * t
                        ],
                        stepL: (start.stepL !== null && target.stepL !== null) 
                            ? start.stepL + (target.stepL - start.stepL) * t 
                            : target.stepL,
                        stepR: (start.stepR !== null && target.stepR !== null)
                            ? start.stepR + (target.stepR - start.stepR) * t
                            : target.stepR
                    };

                    setBaseAnim(nextState);
                    prevBaseRef.current = nextState;

                    if (t < 1) frame = requestAnimationFrame(animate);
                };

                frame = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(frame);
            }, [baseDomain[0], baseDomain[1], baseRange[0], baseRange[1], currentStepLeft, currentStepRight]);

            const animProgressRef = useRef(animProgress);
            useEffect(() => {
                let startTime;
                const duration = 600;
                let frame;
                const startProgress = animProgressRef.current;
                const endProgress = isZoomed ? 1 : 0;

                const animate = (time) => {
                    if (!startTime) startTime = time;
                    let t = Math.min((time - startTime) / duration, 1);
                    t = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
                    const nextVal = startProgress + (endProgress - startProgress) * t;
                    
                    setAnimProgress(nextVal);
                    animProgressRef.current = nextVal;
                    
                    if (t < 1) frame = requestAnimationFrame(animate);
                };
                frame = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(frame);
            }, [isZoomed]);

            let zoomDomain = baseAnim.domain, zoomRange = baseAnim.range;
            if (isZoomed && !isInfinityLimit) {
                zoomDomain = [targetX - 0.05, targetX + 0.05];
                if (isStepFunction) zoomRange = [targetY - 1.5, targetY + 0.5];
                else if (breakAtTarget) zoomRange = [targetY - 1.5, targetY + 1.5];
                else zoomRange = [targetY - 0.1, targetY + 0.1];
            }

            const minX = isInfinityLimit ? baseAnim.domain[0] : baseAnim.domain[0] + (zoomDomain[0] - baseAnim.domain[0]) * animProgress;
            const maxX = isInfinityLimit ? baseAnim.domain[1] : baseAnim.domain[1] + (zoomDomain[1] - baseAnim.domain[1]) * animProgress;
            const minY = isInfinityLimit ? baseAnim.range[0] : baseAnim.range[0] + (zoomRange[0] - baseAnim.range[0]) * animProgress;
            const maxY = isInfinityLimit ? baseAnim.range[1] : baseAnim.range[1] + (zoomRange[1] - baseAnim.range[1]) * animProgress;

            const mapX = (x) => padding + ((x - minX) / (maxX - minX)) * (width - 2 * padding);
            const mapY = (y) => height - padding - ((y - minY) / (maxY - minY)) * (height - 2 * padding);

            const getTicks = (min, max) => {
                const range = max - min;
                const roughStep = range / 5;
                if (roughStep <= 0) return [min];
                const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
                const normalized = roughStep / magnitude;
                let step = magnitude;
                if (normalized > 3.5) step = 5 * magnitude;
                else if (normalized > 1.5) step = 2 * magnitude;
                const start = Math.ceil(min / step) * step;
                const ticks = [];
                for (let i = start; i <= max + step/10; i += step) {
                    ticks.push(parseFloat(i.toPrecision(10)));
                }
                return ticks;
            };

            const formatTick = (val) => {
                if (Math.abs(val) >= 1000) {
                    const [base, exp] = val.toExponential(0).split('e');
                    return `${base.replace('.', ',')}×10^{${exp.replace('+', '')}}`;
                }
                return parseFloat(val.toFixed(6)).toString().replace('.', ',');
            };

            const xTicks = getTicks(minX, maxX);
            const yTicks = getTicks(minY, maxY);

            let pathD = "";
            if (isStepFunction) {
                for (let x = Math.floor(minX) - 1; x <= Math.ceil(maxX); x++) {
                    let y = func(x);
