                                <div id="indet-0-por-inf" className="mt-12">
                                    <InteractiveZeroTimesInf />
                                </div>

                                {/* RESOLUCIÓN INDETERMINACIÓN 1^INF */}
                                <div id="indet-1-inf" className="mt-12">
                                    <InteractiveOneToInf />
                                </div>

                                {/* EXPLICACIÓN INDETERMINACIONES FUTURAS */}
                                <div id="indet-futuras" className="mt-12">
                                    <FutureIndeterminations />
                                </div>

                            </SectionCard>

                            {/* NUEVO APARTADO 6: ASÍNTOTAS */}
                            <SectionCard id="sec-6" title="6. Asíntotas (Aplicación de los Límites)">
                                <p className="mb-6 text-lg text-slate-700">
                                    Las asíntotas son rectas imaginarias a las que la función se aproxima indefinidamente sin llegar nunca a tocarlas de forma estabilizada. ¡Son las "vías del tren" que guían a la curva en el infinito o en puntos conflictivos! Son la <strong>aplicación gráfica directa</strong> del cálculo de límites.
                                </p>

                                <AsymptotesTabs />
                            </SectionCard>

                        </main>
                    </div>
                </div>
            );
        }

        // ---------------------------------------------------------
        // COMPONENTES DE ASÍNTOTAS (SECCIÓN 6)
        // ---------------------------------------------------------

        const AsymptotesTabs = () => {
            const [activeTab, setActiveTab] = useState('vertical');

            return (
                <div className="border border-slate-200 rounded-xl overflow-hidden shadow-sm bg-white">
                    {/* Navegación de Pestañas */}
                    <div className="flex flex-col md:flex-row border-b border-slate-200 bg-slate-100">
                        <button 
                            onClick={() => setActiveTab('vertical')} 
                            className={`flex-1 py-4 px-4 text-center transition-colors font-bold text-lg border-b md:border-b-0 md:border-r border-slate-200 ${activeTab === 'vertical' ? 'bg-white border-b-2 border-indigo-600 text-indigo-700 shadow-inner' : 'text-slate-600 hover:bg-slate-200'}`}
                        >
                            Verticales (A.V.)
                        </button>
                        <button 
                            onClick={() => setActiveTab('horizontal')} 
                            className={`flex-1 py-4 px-4 text-center transition-colors font-bold text-lg border-b md:border-b-0 md:border-r border-slate-200 ${activeTab === 'horizontal' ? 'bg-white border-b-2 border-indigo-600 text-indigo-700 shadow-inner' : 'text-slate-600 hover:bg-slate-200'}`}
                        >
                            Horizontales (A.H.)
                        </button>
                        <button 
                            onClick={() => setActiveTab('oblicua')} 
                            className={`flex-1 py-4 px-4 text-center transition-colors font-bold text-lg ${activeTab === 'oblicua' ? 'bg-white border-b-2 border-indigo-600 text-indigo-700 shadow-inner' : 'text-slate-600 hover:bg-slate-200'}`}
                        >
                            Oblicuas (A.O.)
                        </button>
                    </div>

                    <div className="p-6 md:p-8">
                        {activeTab === 'vertical' && <VerticalAsymptotesContent />}
                        {activeTab === 'horizontal' && <HorizontalAsymptotesContent />}
                        {activeTab === 'oblicua' && <ObliqueAsymptotesContent />}
                    </div>
                </div>
            );
        };

        const VerticalAsymptotesContent = () => {
            return (
                <div className="animate-fade-in space-y-8">
                    <div className="bg-indigo-50 border-l-4 border-indigo-500 p-6 rounded-r-lg">
                        <h3 className="font-bold text-indigo-900 mb-2 text-xl">Definición matemática</h3>
                        <p className="text-lg text-slate-700 mb-4">
                            La recta <Latex math="x = a" /> (con <Latex math="a \in \mathbb{R}" />) es una asíntota vertical de la función <Latex math="f(x)" /> si se cumple <strong>al menos una</strong> de estas condiciones:
                        </p>
                        <div className="bg-white p-4 rounded border border-indigo-200 flex flex-col md:flex-row justify-center items-center gap-6 text-xl font-bold text-indigo-800">
                            <Latex math="\displaystyle \lim_{x \to a^-} f(x) = \pm\infty" />
                            <span className="text-slate-400">ó</span>
                            <Latex math="\displaystyle \lim_{x \to a^+} f(x) = \pm\infty" />
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <h4 className="font-bold text-slate-800 text-lg mb-4 border-b border-slate-100 pb-2">¿Dónde buscamos las candidatas a A.V.?</h4>
                        <p className="text-lg text-slate-700 mb-4">
                            Generalmente, las buscamos en los valores que <strong>no pertenecen al dominio</strong> de la función (ej. valores que anulan un denominador), o en los puntos de salto de las funciones definidas a trozos.
                        </p>
                        
                        <div className="bg-red-50 p-5 rounded-lg border border-red-200 text-red-900 flex gap-4 items-start shadow-sm mt-6">
                            <span className="text-3xl">⚠️</span>
                            <div>
                                <h5 className="font-bold mb-1">¡Ojo! No todos los puntos fuera del dominio son asíntotas.</h5>
                                <p className="text-sm">
                                    Si al calcular el límite en <Latex math="x = a" /> obtenemos <Latex math="\left[\frac{0}{0}\right]" /> en lugar de <Latex math="\frac{k}{0}" />, es muy probable que haya una <strong>discontinuidad evitable (un agujero)</strong> y NO una asíntota. ¡Por eso hay que calcular siempre el límite para comprobarlo!
                                </p>
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 text-center">
                        <h4 className="font-bold text-slate-800 text-lg mb-6">Comportamientos gráficos (Límites laterales)</h4>
                        <p className="text-slate-600 mb-8">Al calcular los límites laterales en una asíntota vertical, los infinitos determinan si la curva sube o baja junto a la "pared" imaginaria.</p>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="bg-white p-4 rounded border border-slate-200 shadow-sm flex flex-col items-center">
                                <span className="font-semibold text-blue-700 mb-2 flex items-center gap-1">Ambos a <Latex math="+\infty" /> (Divergencia Positiva)</span>
                                <Latex math="f(x) = \frac{1}{x^2}" />
                                <div className="h-40 w-full bg-slate-100 mt-4 rounded border border-slate-200 flex items-center justify-center relative overflow-hidden">
                                    {/* SVG Decorativo Simplificado */}
                                    <svg viewBox="0 0 100 100" className="w-full h-full stroke-blue-500 fill-none" strokeWidth="2">
                                        <line x1="50" y1="0" x2="50" y2="100" stroke="#f59e0b" strokeDasharray="4" strokeWidth="2"/>
                                        <line x1="0" y1="90" x2="100" y2="90" stroke="#94a3b8" strokeWidth="1"/>
                                        <path d="M 10 90 Q 45 90 48 10" />
                                        <path d="M 90 90 Q 55 90 52 10" />
                                    </svg>
                                </div>
                            </div>
                            <div className="bg-white p-4 rounded border border-slate-200 shadow-sm flex flex-col items-center">
                                <span className="font-semibold text-rose-700 mb-2">Signos opuestos (Salto Infinito)</span>
                                <Latex math="f(x) = \frac{1}{x}" />
                                <div className="h-40 w-full bg-slate-100 mt-4 rounded border border-slate-200 flex items-center justify-center relative overflow-hidden">
                                    <svg viewBox="0 0 100 100" className="w-full h-full stroke-rose-500 fill-none" strokeWidth="2">
                                        <line x1="50" y1="0" x2="50" y2="100" stroke="#f59e0b" strokeDasharray="4" strokeWidth="2"/>
                                        <line x1="0" y1="50" x2="100" y2="50" stroke="#94a3b8" strokeWidth="1"/>
                                        <path d="M 10 55 Q 45 55 48 95" />
                                        <path d="M 90 45 Q 55 45 52 5" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const HorizontalAsymptotesContent = () => {
            const [testVal, setTestVal] = useState(100);
            
            // Función de ejemplo para posición interactiva: f(x) = (2x+1)/(x-1). L = 2
            const f_h = (x) => (2*x + 1) / (x - 1);
            const L = 2;
            const diff = f_h(testVal) - L;

            return (
                <div className="animate-fade-in space-y-8">
                    <div className="bg-indigo-50 border-l-4 border-indigo-500 p-6 rounded-r-lg">
                        <h3 className="font-bold text-indigo-900 mb-2 text-xl">Definición matemática</h3>
                        <p className="text-lg text-slate-700 mb-4">
                            La recta <Latex math="y = L" /> (con <Latex math="L \in \mathbb{R}" />) es una asíntota horizontal de la función <Latex math="f(x)" /> si al tender la variable al infinito, la función se estabiliza en ese número:
                        </p>
                        <div className="bg-white p-4 rounded border border-indigo-200 flex flex-col md:flex-row justify-center items-center gap-6 text-xl font-bold text-indigo-800">
                            <Latex math="\displaystyle \lim_{x \to +\infty} f(x) = L" />
                            <span className="text-slate-400">ó</span>
                            <Latex math="\displaystyle \lim_{x \to -\infty} f(x) = L" />
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <h4 className="font-bold text-slate-800 text-lg mb-4 border-b border-slate-100 pb-2">El Mito: "¿Se pueden cruzar las asíntotas?"</h4>
                        <p className="text-lg text-slate-700 mb-6">
                            ¡Sí! Las asíntotas verticales nunca se pueden cruzar porque implicaría dividir por cero (estar fuera del dominio). Pero <strong>las asíntotas horizontales (y oblicuas) SÍ se pueden atravesar</strong>. La única condición es que "allá a lo lejos", en el infinito, la función termine pegándose a la recta.
                        </p>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-center bg-slate-50 p-4 rounded-lg border border-slate-100">
                            <div className="text-center">
                                <p className="text-slate-600 mb-3 font-semibold text-lg">Ejemplo de curva que cruza su A.H.:</p>
                                <div className="bg-white px-4 py-3 rounded-lg shadow-sm border border-slate-200 inline-block mb-4">
                                    <Latex math="\displaystyle f(x) = \frac{2x^2}{x^2 - 2x + 2}" />
                                </div>
                                <div className="text-sm text-slate-600 text-left space-y-3 bg-white p-4 rounded border border-slate-200">
                                    <p className="flex items-center gap-2">👉 <span>Su Asíntota Horizontal es <Latex math="y = 2" /></span></p>
                                    <p className="flex items-start gap-2">👉 <span>Si igualamos <Latex math="f(x) = 2" />, comprobamos que la curva y la asíntota se cruzan exactamente en <Latex math="\mathbf{x = 1}" />. Luego la función sube hasta un máximo y vuelve a bajar para pegarse a la recta en el infinito.</span></p>
                                </div>
                            </div>
                            <div className="h-[250px] bg-white border border-slate-200 rounded-lg shadow-sm p-2 relative">
                                <SvgGraph 
                                    baseDomain={[-2, 10]} 
                                    baseRange={[-1, 5]} 
                                    func={(x) => (2 * x * x) / (x * x - 2 * x + 2)}
                                    horizontalAsymptote={2}
                                />
                            </div>
                        </div>
                    </div>

                    <div className="bg-slate-50 p-6 rounded-xl border border-slate-200">
                        <h4 className="font-bold text-slate-800 text-lg mb-4">Posición de la curva respecto a la Asíntota Horizontal</h4>
                        <p className="text-lg text-slate-700 mb-6">
                            Para dibujar bien la gráfica, no basta saber que hay una A.H. en <Latex math="y = 2" />. Hay que saber si la función se pega <strong>por encima</strong> o <strong>por debajo</strong>. Para ello, damos un valor muy grande (ej. 100 o 1000) a la <Latex math="x" /> y restamos el valor de la asíntota (<Latex math="f(x) - L" />).
                        </p>

                        <div className="bg-white p-6 rounded-lg border border-slate-200 shadow-inner">
                            <div className="text-center font-bold text-slate-600 mb-4">
                                Ejemplo interactivo con <Latex math="f(x) = \frac{2x+1}{x-1}" /> y Asíntota en <Latex math="y = 2" />
                            </div>
                            
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 items-center">
                                <div className="flex flex-col gap-6 items-center justify-center">
                                    <div className="flex flex-nowrap justify-center gap-2 w-full overflow-x-auto hide-scrollbar">
                                        <button onClick={() => setTestVal(10)} className={`px-4 py-2 rounded font-bold transition-colors whitespace-nowrap shrink-0 ${testVal === 10 ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-700'}`}>x = 10</button>
                                        <button onClick={() => setTestVal(100)} className={`px-4 py-2 rounded font-bold transition-colors whitespace-nowrap shrink-0 ${testVal === 100 ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-700'}`}>x = 100</button>
                                        <button onClick={() => setTestVal(1000)} className={`px-4 py-2 rounded font-bold transition-colors whitespace-nowrap shrink-0 ${testVal === 1000 ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-700'}`}>x = 1000</button>
                                    </div>
                                    
                                    <div className="bg-slate-100 p-4 rounded-lg border border-slate-200 text-center text-lg min-w-[250px] w-full">
                                        <div className="mb-2"><Latex math={`f(${testVal}) - 2 = `} /></div>
                                        <div className="font-bold text-indigo-700 text-xl">
                                            {f_h(testVal).toFixed(4).replace('.', ',')} - 2 = {(diff).toFixed(4).replace('.', ',')}
                                        </div>
                                        <div className={`mt-3 text-sm font-bold px-3 py-1 rounded ${diff > 0 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                                            {diff > 0 ? "Resultado POSITIVO: Va por ENCIMA" : "Resultado NEGATIVO: Va por DEBAJO"}
                                        </div>
                                    </div>
                                </div>
                                <div className="h-[250px] bg-white border border-slate-200 rounded-lg shadow-sm p-2">
                                    <SvgGraph 
                                        baseDomain={[-Math.max(5, testVal * 0.1), Math.max(15, testVal * 1.1)]} 
                                        baseRange={[-2, 6]} 
                                        func={f_h}
                                        horizontalAsymptote={2} 
                                        verticalAsymptote={1}
                                        isInfinityLimit={true}
                                        currentStepRight={testVal}
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ObliqueAsymptotesContent = () => {
            const f_o = (x) => { if (Math.abs(x) < 0.2) return null; return (x*x + 1) / x; };
            
            return (
                <div className="animate-fade-in space-y-8">
                    <div className="bg-indigo-50 border-l-4 border-indigo-500 p-6 rounded-r-lg">
                        <h3 className="font-bold text-indigo-900 mb-2 text-xl">Definición matemática</h3>
                        <p className="text-lg text-slate-700 mb-4">
                            Si la función se estabiliza siguiendo una línea inclinada en el infinito, decimos que tiene una <strong>Asíntota Oblicua</strong>. Su ecuación es la de una recta afin: <Latex math="y = mx + n" /> (con <Latex math="m \neq 0" />).
                        </p>
                        <div className="bg-white p-4 rounded border border-indigo-200 flex flex-col md:flex-row justify-center items-center gap-8 text-lg font-bold text-indigo-800">
                            <div><Latex math="\displaystyle m = \lim_{x \to \infty} \frac{f(x)}{x}" /></div>
                            <div><Latex math="\displaystyle n = \lim_{x \to \infty} [f(x) - mx]" /></div>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-amber-50 p-6 rounded-xl border border-amber-200 shadow-sm">
                            <h4 className="font-bold text-amber-900 text-lg mb-2 flex items-center gap-2"><span className="text-2xl">⚡</span> La Regla de Oro</h4>
                            <p className="text-amber-800">
                                En funciones racionales (polinomio entre polinomio), <strong>si existe Asíntota Horizontal, NO existe Asíntota Oblicua</strong> (y viceversa). Esto nos ahorra muchísimos cálculos.
                            </p>
                        </div>
                        
                        <div className="bg-teal-50 p-6 rounded-xl border border-teal-200 shadow-sm">
                            <h4 className="font-bold text-teal-900 text-lg mb-2 flex items-center gap-2"><span className="text-2xl">👀</span> ¿Cuándo sospechamos de ellas?</h4>
                            <p className="text-teal-800">
                                En fracciones algebraicas, sabemos que hay asíntota oblicua si el <strong>grado del numerador es exactamente UN GRADO MAYOR</strong> que el grado del denominador.
                                <br/><span className="text-sm italic mt-2 block">(Ej. numerador grado 3 y denominador grado 2).</span>
                            </p>
                        </div>
                    </div>

                    <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 mt-6">
                        <h4 className="font-bold text-slate-800 text-lg mb-4 border-b border-slate-200 pb-2">Ejemplo Rápido: <Latex math="f(x) = \frac{x^2+1}{x}" /></h4>
                        
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="flex flex-col gap-4 overflow-x-auto hide-scrollbar text-lg text-center bg-white p-6 rounded-lg shadow-sm border border-slate-100 justify-center">
                                <div className="text-left text-slate-700"><span className="font-bold text-indigo-700">1º) Calculamos m:</span> <div className="mt-2 flex justify-center"><Latex math="\displaystyle m = \lim_{x \to \infty} \frac{\frac{x^2+1}{x}}{x} = \lim_{x \to \infty} \frac{x^2+1}{x^2} = \mathbf{1}" /></div></div>
                                <hr className="border-slate-100 my-2" />
                                <div className="text-left text-slate-700"><span className="font-bold text-indigo-700">2º) Calculamos n:</span> <div className="mt-2 flex justify-center"><Latex math="\displaystyle n = \lim_{x \to \infty} \left( \frac{x^2+1}{x} - 1 \cdot x \right) = \lim_{x \to \infty} \left( \frac{x^2+1 - x^2}{x} \right) = \lim_{x \to \infty} \frac{1}{x} = \mathbf{0}" /></div></div>
                                <div className="mt-4 text-xl font-bold text-indigo-700 bg-indigo-50 py-3 px-4 rounded-lg border border-indigo-100">
                                    Asíntota Oblicua: <Latex math="\displaystyle y = 1x + 0 \implies \mathbf{y = x}" />
                                </div>
                            </div>
                            <div className="h-[300px] bg-white border border-slate-200 rounded-lg shadow-sm p-2 flex items-center justify-center relative">
                                <SvgGraph 
                                    baseDomain={[-5, 5]} baseRange={[-6, 6]} func={f_o}
                                    verticalAsymptote={0} obliqueAsymptote={(x) => x}
                                />
                            </div>
                        </div>
                    </div>

                </div>
            );
        };


        // ---------------------------------------------------------
        // COMPONENTES DE SUBSECCIONES (Pestañas, Ejercicios, etc.)
        // ---------------------------------------------------------

        const InfinityArithmeticTabs = () => {
            const [activeTab, setActiveTab] = useState('suma');

            const tabs = [
                { id: 'suma', label: 'Suma y Resta', icon: '+' },
                { id: 'producto', label: 'Producto', icon: '×' },
                { id: 'cociente', label: 'Cociente', icon: '÷' },
                { id: 'potencia', label: 'Potencia', icon: '^' }
            ];

            return (
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div className="bg-slate-100 px-6 py-4 border-b border-slate-200">
                        <h4 className="font-bold text-lg text-slate-800">Aritmética del Infinito (Operaciones válidas)</h4>
                        <p className="text-sm text-slate-500">Reglas matemáticas para operar con valores infinitos y números reales.</p>
                    </div>
                    
                    <div className="flex flex-wrap border-b border-slate-200 bg-slate-50">
                        {tabs.map(tab => (
                            <button 
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`px-6 py-3 font-semibold text-sm transition-colors flex-1 md:flex-none ${activeTab === tab.id ? 'bg-white text-blue-600 border-b-2 border-blue-600' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-100'}`}
                            >
                                <span className="mr-2 opacity-70">{tab.icon}</span> {tab.label}
                            </button>
                        ))}
                    </div>

                    <div className="p-6">
                        {activeTab === 'suma' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-lg animate-fade-in">
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="(+\infty) + k = +\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="(+\infty) - k = +\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="(-\infty) + k = -\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="(-\infty) - k = -\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="(+\infty) + (+\infty) = +\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="(-\infty) + (-\infty) = -\infty" /></div>
                            </div>
                        )}
                        {activeTab === 'producto' && (
                            <div className="grid grid-cols-1 gap-4 text-lg animate-fade-in">
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-center hide-scrollbar overflow-x-auto">
                                    <Latex math="\displaystyle k \cdot (+\infty) = \begin{cases} +\infty & \text{si } k > 0 \\ -\infty & \text{si } k < 0 \end{cases}" />
                                </div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-center hide-scrollbar overflow-x-auto">
                                    <Latex math="\displaystyle k \cdot (-\infty) = \begin{cases} -\infty & \text{si } k > 0 \\ +\infty & \text{si } k < 0 \end{cases}" />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="(+\infty) \cdot (+\infty) = +\infty" /></div>
                                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="(-\infty) \cdot (-\infty) = +\infty" /></div>
                                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center md:col-span-2 hide-scrollbar overflow-x-auto"><Latex math="(+\infty) \cdot (-\infty) = -\infty" /></div>
                                </div>
                            </div>
                        )}
                        {activeTab === 'cociente' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-lg animate-fade-in">
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="\displaystyle \frac{k}{\pm\infty} = 0" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="\displaystyle \frac{0}{\pm\infty} = 0" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-center md:col-span-2 hide-scrollbar overflow-x-auto">
                                    <Latex math="\displaystyle \frac{k}{0} = \begin{cases} +\infty & \text{si } k > 0 \\ -\infty & \text{si } k < 0 \end{cases}" />
                                    <p className="text-sm text-slate-500 mt-2 italic">* Siempre estudiando el signo de los límites laterales</p>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="\displaystyle \frac{+\infty}{0} = \pm\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="\displaystyle \frac{-\infty}{0} = \pm\infty" /></div>
                            </div>
                        )}
                        {activeTab === 'potencia' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-lg animate-fade-in">
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-center md:col-span-2 hide-scrollbar overflow-x-auto">
                                    <Latex math="\displaystyle k^{+\infty} = \begin{cases} +\infty & \text{si } k > 1 \\ 0 & \text{si } 0 \le k < 1 \end{cases}" />
                                </div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-center md:col-span-2 hide-scrollbar overflow-x-auto">
                                    <Latex math="\displaystyle k^{-\infty} = \begin{cases} 0 & \text{si } k > 1 \\ +\infty & \text{si } 0 \le k < 1 \end{cases}" />
                                </div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 text-center md:col-span-2 hide-scrollbar overflow-x-auto">
                                    <Latex math="\displaystyle (+\infty)^{k} = \begin{cases} +\infty & \text{si } k > 0 \\ 0 & \text{si } k < 0 \end{cases}" />
                                </div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="(+\infty)^{+\infty} = +\infty" /></div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-100 flex justify-center hide-scrollbar overflow-x-auto"><Latex math="(+\infty)^{-\infty} = 0" /></div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const InteractiveSubstitution = () => {
            const [step, setStep] = useState(0);

            return (
                <div className="border border-slate-200 rounded-xl overflow-hidden mb-8 mt-6 max-w-2xl mx-auto shadow-sm">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 text-center">
                        <h4 className="font-bold text-lg text-slate-700">Comprobación interactiva: ¿Qué pasa si sustituyo?</h4>
                    </div>
                    <div className="p-6 text-center bg-white">
                        <div className="flex justify-center mb-8 h-20 items-center">
                            <div className="text-2xl font-bold transition-all duration-500">
                                {step === 0 && <Latex math="\displaystyle \lim_{x \to 1} \frac{x^2 - 3x + 2}{x - 1}" />}
                                {step === 1 && <Latex math="\displaystyle \frac{1^2 - 3(1) + 2}{1 - 1}" />}
                                {step === 2 && <Latex math="\displaystyle \frac{1 - 3 + 2}{0}" />}
                                {step === 3 && <div className="text-red-600 scale-125 transform transition-transform"><Latex math="\displaystyle \frac{0}{0}" /></div>}
                            </div>
                        </div>
                        <div className="flex justify-center gap-4 flex-wrap">
                            <button 
                                onClick={() => setStep(Math.min(3, step + 1))} 
                                disabled={step === 3} 
                                className={`font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2 text-white ${step === 3 ? 'bg-red-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}
                            >
                                {step === 0 ? "Paso 1: Sustituir la x por 1" : 
                                 step === 1 ? "Paso 2: Operar términos" : 
                                 step === 2 ? "Paso 3: Ver resultado final" : 
                                 "Indeterminación detectada"}
                            </button>
                            {step > 0 && (
                                <button onClick={() => setStep(0)} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-6 rounded-lg transition-colors">
                                    Reiniciar
                                </button>
                            )}
                        </div>
                        
                        {step === 3 && (
                            <div className="mt-8 p-4 bg-red-50 text-red-900 rounded-lg animate-fade-in border border-red-200">
                                <span className="block text-2xl mb-2">🚨</span>
                                ¡Atención! Hemos llegado a <Latex math="\frac{0}{0}" />. <br/>
                                Como <strong>no sabemos a qué valor tiende ni si es infinito</strong>, estamos ante una <strong>indeterminación</strong>.
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const InteractiveInfOverInf = () => {
            const [activeCase, setActiveCase] = useState(0);

            const cases = [
                {
                    id: 0,
                    title: "Grado Numerador > Grado Denominador",
                    conclusion: "Gana el numerador: El límite siempre es +∞ o -∞",
                    latexFunc: "\\displaystyle \\lim_{x \\to +\\infty} \\frac{2x^3 - 5x + 1}{x^2 + 3}",
                    latexSteps: [
                        "\\approx \\displaystyle \\lim_{x \\to +\\infty} \\frac{2x^3}{x^2}",
                        "= \\displaystyle \\lim_{x \\to +\\infty} 2x",
                        "= +\\infty"
                    ],
                    func: (x) => (2 * Math.pow(x, 3) - 5 * x + 1) / (Math.pow(x, 2) + 3),
                    asymptote: null
                },
                {
                    id: 1,
                    title: "Grado Numerador < Grado Denominador",
                    conclusion: "Gana el denominador: El límite siempre es 0",
                    latexFunc: "\\displaystyle \\lim_{x \\to +\\infty} \\frac{4x^2 - x}{2x^3 + 5}",
                    latexSteps: [
                        "\\approx \\displaystyle \\lim_{x \\to +\\infty} \\frac{4x^2}{2x^3}",
                        "= \\displaystyle \\lim_{x \\to +\\infty} \\frac{2}{x}",
                        "= 0"
                    ],
                    func: (x) => (4 * Math.pow(x, 2) - x) / (2 * Math.pow(x, 3) + 5),
                    asymptote: 0
                },
                {
                    id: 2,
                    title: "Grados Iguales",
                    conclusion: "Empate: El límite es el cociente de los coeficientes",
                    latexFunc: "\\displaystyle \\lim_{x \\to +\\infty} \\frac{6x^2 + 2x}{3x^2 - 1}",
                    latexSteps: [
                        "\\approx \\displaystyle \\lim_{x \\to +\\infty} \\frac{6x^2}{3x^2}",
                        "= \\displaystyle \\lim_{x \\to +\\infty} \\frac{6}{3}",
                        "= 2"
                    ],
                    func: (x) => (6 * Math.pow(x, 2) + 2 * x) / (3 * Math.pow(x, 2) - 1),
                    asymptote: 2
                }
            ];

            const current = cases[activeCase];
            const infinitySteps = [10, 50, 200, 1000];

            return (
                <div className="mb-4 border border-slate-200 rounded-xl overflow-hidden mt-6 shadow-sm">
                    {/* Selector de casos */}
                    <div className="flex flex-col md:flex-row border-b border-slate-200 bg-slate-100">
                        {cases.map((c, idx) => (
                            <button 
                                key={c.id}
                                onClick={() => setActiveCase(idx)}
                                className={`flex-1 py-4 px-4 text-center transition-colors border-b md:border-b-0 md:border-r border-slate-200 last:border-r-0 last:border-b-0 ${activeCase === idx ? 'bg-white border-b-2 border-blue-600 shadow-inner' : 'hover:bg-slate-200'}`}
                            >
                                <span className={`block font-bold text-sm md:text-base ${activeCase === idx ? 'text-blue-700' : 'text-slate-600'}`}>{c.title}</span>
                            </button>
                        ))}
                    </div>

                    <div className="p-4 md:p-6 bg-white">
                        {/* Explicación matemática paso a paso */}
                        <div className="bg-slate-50 p-4 md:p-6 rounded-xl border border-slate-200 mb-8 flex flex-col items-center">
                            <h4 className="font-bold text-lg md:text-xl text-slate-800 mb-6 text-center border-b border-slate-300 pb-2">{current.conclusion}</h4>
                            
                            <div className="flex flex-col lg:flex-row items-center justify-center gap-6 text-lg md:text-xl w-full">
                                <div className="bg-white px-6 py-4 rounded-lg shadow-sm border border-slate-200 overflow-x-auto hide-scrollbar min-w-[200px] text-center">
                                    <Latex math={current.latexFunc} />
                                </div>
                                <div className="text-slate-400 text-3xl rotate-90 lg:rotate-0">➜</div>
                                <div className="flex flex-col gap-3 bg-white px-6 py-4 rounded-lg shadow-sm border border-slate-200 overflow-x-auto hide-scrollbar min-w-[200px]">
                                    {current.latexSteps.map((step, idx) => (
                                        <div key={idx} className={idx === current.latexSteps.length - 1 ? "font-bold text-blue-700 mt-2 text-2xl text-center border-t border-blue-100 pt-2" : "text-slate-600"}>
                                            <Latex math={step} />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Motor Gráfico Reutilizado */}
                        <div key={`graph-case-${activeCase}`}>
                            <h4 className="font-bold text-slate-700 mb-4 text-center">Comprobación gráfica interactiva:</h4>
                            <InfinityInteractive 
                                func={current.func} 
                                infinitySteps={infinitySteps} 
                                horizontalAsymptote={current.asymptote} 
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const ExerciseCard = ({ letter, limit, indet, formalSteps, trickSteps, directSteps, isDirect, finalResult }) => {
            const [showSol, setShowSol] = useState(false);
            return (
                <div className="mb-6 border border-slate-200 rounded-xl overflow-hidden shadow-sm bg-white">
                    <div className="flex justify-between items-center bg-slate-50 p-4 border-b border-slate-200">
                        <div className="flex items-center gap-4 overflow-x-auto hide-scrollbar overflow-y-hidden py-1">
                            <span className="font-bold text-xl text-slate-700">{letter})</span>
                            <div className="text-lg"><Latex math={limit} /></div>
                        </div>
                        <button
                            onClick={() => setShowSol(!showSol)}
                            className={`ml-4 shrink-0 px-4 py-2 rounded-lg font-semibold transition-colors ${showSol ? 'bg-slate-200 text-slate-700 hover:bg-slate-300' : 'bg-blue-600 text-white hover:bg-blue-700'}`}
                        >
                            {showSol ? 'Ocultar' : 'Ver solución'}
                        </button>
                    </div>
                    {showSol && (
                        <div className="p-6 animate-fade-in bg-white">
                            <div className="text-center mb-6 text-lg text-red-600 font-bold border-b border-slate-100 pb-4">
                                {isDirect ? (
                                    <>Al sustituir observamos que no hay indeterminación: <Latex math={indet} /></>
                                ) : indet.includes("frac") ? (
                                    <>Al sustituir obtenemos la indeterminación: <Latex math={indet} /></>
                                ) : (
                                    <>Al sustituir observamos: <Latex math={indet} /></>
                                )}
                            </div>
                            
                            {!isDirect ? (
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                    {/* Método Tradicional */}
                                    <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                                        <h5 className="font-bold text-slate-700 mb-4 text-center border-b border-slate-300 pb-2">Método Tradicional</h5>
                                        <p className="text-sm text-slate-500 text-center mb-4">Dividimos todos los términos entre la <Latex math="x" /> de mayor grado.</p>
                                        <div className="flex flex-col items-center gap-4 overflow-x-auto hide-scrollbar text-lg py-2">
                                            {formalSteps.map((step, i) => (
                                                <div key={i} className="text-slate-700"><Latex math={step} /></div>
                                            ))}
                                        </div>
                                    </div>
                                    {/* Regla Práctica */}
                                    <div className="bg-blue-50 p-5 rounded-xl border border-blue-200">
                                        <h5 className="font-bold text-blue-800 mb-4 text-center border-b border-blue-300 pb-2">Regla Práctica (Truco)</h5>
                                        <p className="text-sm text-blue-600 text-center mb-4">Nos quedamos solo con los términos dominantes de mayor grado.</p>
                                        <div className="flex flex-col items-center gap-4 overflow-x-auto hide-scrollbar text-lg py-2">
                                            {trickSteps.map((step, i) => (
                                                <div key={i} className="text-slate-700"><Latex math={step} /></div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 max-w-2xl mx-auto">
                                    <h5 className="font-bold text-slate-700 mb-4 text-center border-b border-slate-300 pb-2">Cálculo Directo</h5>
                                    <p className="text-sm text-slate-500 text-center mb-4">Al no haber indeterminación, aplicamos la aritmética del infinito directamente.</p>
                                    <div className="flex flex-col items-center gap-4 overflow-x-auto hide-scrollbar text-lg py-2">
                                        {directSteps.map((step, i) => (
                                            <div key={i} className="text-slate-700"><Latex math={step} /></div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="mt-8 text-center text-2xl font-bold text-blue-800 bg-blue-100 p-4 rounded-lg shadow-sm border border-blue-200">
                                Solución: <Latex math={`\\mathbf{${finalResult}}`} />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ExerciseListInfOverInf = () => {
            const exercises = [
                {
                    letter: 'a',
                    limit: "\\displaystyle \\lim_{x \\to +\\infty} \\frac{3x - 2}{2x + 5}",
                    indet: "\\left[ \\frac{\\infty}{\\infty} \\right]",
                    formalSteps: [
                        "\\displaystyle = \\lim_{x \\to +\\infty} \\frac{\\frac{3x}{x} - \\frac{2}{x}}{\\frac{2x}{x} + \\frac{5}{x}}",
                        "\\displaystyle = \\lim_{x \\to +\\infty} \\frac{3 - \\frac{2}{x}}{2 + \\frac{5}{x}}",
                        "\\displaystyle = \\frac{3 - 0}{2 + 0}"
                    ],
                    trickSteps: [
                        "\\displaystyle \\approx \\lim_{x \\to +\\infty} \\frac{3x}{2x}",
                        "\\text{Simplificamos las } x",
                        "\\displaystyle = \\lim_{x \\to +\\infty} \\frac{3}{2}"
                    ],
                    finalResult: "\\frac{3}{2}"
                },
                {
                    letter: 'b',
                    limit: "\\displaystyle \\lim_{x \\to -\\infty} \\frac{x^2 - 3}{7x - 2}",
                    indet: "\\left[ \\frac{+\\infty}{-\\infty} \\right]",
                    formalSteps: [
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{\\frac{x^2}{x^2} - \\frac{3}{x^2}}{\\frac{7x}{x^2} - \\frac{2}{x^2}}",
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{1 - \\frac{3}{x^2}}{\\frac{7}{x} - \\frac{2}{x^2}}",
                        "\\displaystyle = \\frac{1 - 0}{0^- - 0} = \\frac{1}{0^-}"
                    ],
                    trickSteps: [
                        "\\displaystyle \\approx \\lim_{x \\to -\\infty} \\frac{x^2}{7x}",
                        "\\text{Simplificamos las } x",
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{x}{7} = \\frac{-\\infty}{7}"
                    ],
                    finalResult: "-\\infty"
                },
                {
                    letter: 'c',
                    limit: "\\displaystyle \\lim_{x \\to -\\infty} \\frac{5 - x}{x + 5}",
                    indet: "\\left[ \\frac{+\\infty}{-\\infty} \\right]",
                    formalSteps: [
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{\\frac{5}{x} - \\frac{x}{x}}{\\frac{x}{x} + \\frac{5}{x}}",
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{\\frac{5}{x} - 1}{1 + \\frac{5}{x}}",
                        "\\displaystyle = \\frac{0 - 1}{1 + 0}"
                    ],
                    trickSteps: [
                        "\\displaystyle \\approx \\lim_{x \\to -\\infty} \\frac{-x}{x}",
                        "\\text{Simplificamos las } x",
                        "\\displaystyle = \\lim_{x \\to -\\infty} -1"
                    ],
                    finalResult: "-1"
                },
                {
                    letter: 'd',
                    limit: "\\displaystyle \\lim_{x \\to -\\infty} \\frac{3 - 2x}{x^2 + 1}",
                    indet: "\\left[ \\frac{+\\infty}{+\\infty} \\right]",
                    formalSteps: [
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{\\frac{3}{x^2} - \\frac{2x}{x^2}}{\\frac{x^2}{x^2} + \\frac{1}{x^2}}",
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{\\frac{3}{x^2} - \\frac{2}{x}}{1 + \\frac{1}{x^2}}",
                        "\\displaystyle = \\frac{0 - 0}{1 + 0}"
                    ],
                    trickSteps: [
                        "\\displaystyle \\approx \\lim_{x \\to -\\infty} \\frac{-2x}{x^2}",
                        "\\text{Simplificamos las } x",
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{-2}{x} = \\frac{-2}{-\\infty}"
                    ],
                    finalResult: "0"
                },
                {
                    letter: 'e',
                    limit: "\\displaystyle \\lim_{x \\to -\\infty} \\frac{3}{x^2 + 5}",
                    indet: "\\frac{3}{+\\infty}",
                    isDirect: true,
                    directSteps: [
                        "\\displaystyle = \\frac{3}{(-\\infty)^2 + 5}",
                        "\\displaystyle = \\frac{3}{+\\infty + 5}",
                        "\\displaystyle = \\frac{3}{+\\infty}"
                    ],
                    finalResult: "0"
                },
                {
                    letter: 'f',
                    limit: "\\displaystyle \\lim_{x \\to -\\infty} \\frac{-x}{x^2 - 4}",
                    indet: "\\left[ \\frac{+\\infty}{+\\infty} \\right]",
                    formalSteps: [
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{\\frac{-x}{x^2}}{\\frac{x^2}{x^2} - \\frac{4}{x^2}}",
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{-\\frac{1}{x}}{1 - \\frac{4}{x^2}}",
                        "\\displaystyle = \\frac{0}{1 - 0}"
                    ],
                    trickSteps: [
                        "\\displaystyle \\approx \\lim_{x \\to -\\infty} \\frac{-x}{x^2}",
                        "\\text{Simplificamos las } x",
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{-1}{x} = \\frac{-1}{-\\infty}"
                    ],
                    finalResult: "0"
                },
                {
                    letter: 'g',
                    limit: "\\displaystyle \\lim_{x \\to -\\infty} \\frac{2x^2 + 1}{4x^2 - 3}",
                    indet: "\\left[ \\frac{+\\infty}{+\\infty} \\right]",
                    formalSteps: [
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{\\frac{2x^2}{x^2} + \\frac{1}{x^2}}{\\frac{4x^2}{x^2} - \\frac{3}{x^2}}",
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{2 + \\frac{1}{x^2}}{4 - \\frac{3}{x^2}}",
                        "\\displaystyle = \\frac{2 + 0}{4 - 0}"
                    ],
                    trickSteps: [
                        "\\displaystyle \\approx \\lim_{x \\to -\\infty} \\frac{2x^2}{4x^2}",
                        "\\text{Simplificamos las } x^2",
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{2}{4} = \\frac{1}{2}"
                    ],
                    finalResult: "\\frac{1}{2}"
                },
                {
                    letter: 'h',
                    limit: "\\displaystyle \\lim_{x \\to -\\infty} \\frac{5x^3 - x^2}{x^5 + x^2}",
                    indet: "\\left[ \\frac{-\\infty}{-\\infty} \\right]",
                    formalSteps: [
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{\\frac{5x^3}{x^5} - \\frac{x^2}{x^5}}{\\frac{x^5}{x^5} + \\frac{x^2}{x^5}}",
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{\\frac{5}{x^2} - \\frac{1}{x^3}}{1 + \\frac{1}{x^3}}",
                        "\\displaystyle = \\frac{0 - 0}{1 + 0}"
                    ],
                    trickSteps: [
                        "\\displaystyle \\approx \\lim_{x \\to -\\infty} \\frac{5x^3}{x^5}",
                        "\\text{Simplificamos las } x^3",
                        "\\displaystyle = \\lim_{x \\to -\\infty} \\frac{5}{x^2} = \\frac{5}{+\\infty}"
                    ],
                    finalResult: "0"
                }
            ];
            
            return (
                <div>
                    {exercises.map(ex => <ExerciseCard key={ex.letter} {...ex} />)}
                </div>
            );
        }

        const InfinityDegrees = () => {
            return (
                <div className="mt-16 bg-gradient-to-br from-slate-50 to-blue-50 p-6 md:p-8 rounded-xl border border-blue-200 shadow-sm">
                    <h3 className="text-2xl font-bold text-blue-900 mb-4">Grados de infinito (Otras funciones elementales)</h3>
                    <p className="text-lg text-slate-700 mb-4">
                        Si en vez de 2 polinomios tenemos otras funciones elementales, debemos tener en cuenta que <strong>los infinitos pueden ser "distintos"</strong>.
                    </p>
                    <p className="text-lg text-slate-700 mb-8">
                        No todos los infinitos son iguales. Debemos determinar cuál es el término dominante en cada caso, es decir, <strong>qué término crece más rápidamente que los demás</strong> y determina el valor del límite.
                    </p>

                    {/* Jerarquía Visual */}
                    <div className="flex flex-wrap items-center justify-center gap-2 md:gap-4 mb-10 p-6 bg-white rounded-xl shadow-sm border border-slate-100">
                        <div className="bg-red-100 text-red-800 px-4 py-3 rounded-lg font-bold shadow-sm text-center">Exponencial<br/><span className="text-sm font-normal opacity-80">(ej. <Latex math="e^x, 2^x" />)</span></div>
                        <div className="text-slate-400 font-bold text-2xl">≫</div>
                        <div className="bg-orange-100 text-orange-800 px-4 py-3 rounded-lg font-bold shadow-sm text-center">Polinómica<br/><span className="text-sm font-normal opacity-80">(ej. <Latex math="x^3, x^2" />)</span></div>
                        <div className="text-slate-400 font-bold text-2xl">≫</div>
                        <div className="bg-amber-100 text-amber-800 px-4 py-3 rounded-lg font-bold shadow-sm text-center">Raíz<br/><span className="text-sm font-normal opacity-80">(ej. <Latex math="\sqrt{x}" />)</span></div>
                        <div className="text-slate-400 font-bold text-2xl">≫</div>
                        <div className="bg-green-100 text-green-800 px-4 py-3 rounded-lg font-bold shadow-sm text-center">Logarítmica<br/><span className="text-sm font-normal opacity-80">(ej. <Latex math="\ln x" />)</span></div>
                        <div className="text-slate-400 font-bold text-2xl">≫</div>
                        <div className="bg-slate-200 text-slate-700 px-4 py-3 rounded-lg font-bold shadow-sm text-center">Constante<br/><span className="text-sm font-normal opacity-80">(ej. <Latex math="5" />)</span></div>
                    </div>

                    {/* Ejemplo de los apuntes */}
                    <div className="bg-white p-6 md:p-8 rounded-xl border border-slate-200 shadow-sm max-w-3xl mx-auto">
                        <h4 className="font-bold text-xl text-slate-800 mb-6 border-b border-slate-100 pb-2">Ejemplo resuelto:</h4>
                        
                        <div className="flex flex-col items-center text-lg gap-6">
                            <div className="flex items-center gap-4 text-2xl">
                                <Latex math="\displaystyle \lim_{x \to +\infty} \frac{\sqrt{x - 2}}{x + 6}" />
                                <span>=</span>
                                <Latex math="\left[ \frac{+\infty}{+\infty} \right]" />
                            </div>
                            
                            <div className="flex flex-col md:flex-row gap-6 w-full items-stretch justify-center mt-2">
                                <div className="bg-amber-50 p-4 rounded-lg border border-amber-200 flex-1 text-center">
                                    <p className="text-amber-800 font-semibold mb-1">Numerador</p>
                                    <Latex math="\sqrt{x - 2}" />
                                    <p className="text-sm text-amber-700 mt-2">Comportamiento de <br/><strong>Raíz</strong></p>
                                </div>
                                <div className="bg-orange-50 p-4 rounded-lg border border-orange-200 flex-1 text-center relative">
                                    <div className="absolute -top-3 -right-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full shadow transform rotate-12 animate-pulse">¡Crece más rápido!</div>
                                    <p className="text-orange-800 font-semibold mb-1">Denominador</p>
                                    <Latex math="x + 6" />
                                    <p className="text-sm text-orange-700 mt-2">Comportamiento de <br/><strong>Polinomio (grado 1)</strong></p>

                            <div className="mt-4 text-center">
                                <p className="text-slate-600 mb-4">
                                    Al igual que vimos en el <em>Caso 1</em> de los polinomios (cuando ganaba el denominador), como la función polinómica crece mucho más rápido que la raíz, el infinito del denominador es inmensamente más grande.
                                </p>
                                <div className="text-3xl font-bold text-blue-700 bg-blue-50 px-8 py-4 rounded-xl inline-block border border-blue-200">
                                    <Latex math="\displaystyle \lim_{x \to +\infty} \frac{\sqrt{x - 2}}{x + 6} = \mathbf{0}" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const GenericExerciseCard = ({ letter, limit, indet, steps, finalResult, isTrick, colorTheme = "green" }) => {
            const [showSol, setShowSol] = useState(false);
            
            // Colores dinámicos basados en el tema
            const theme = {
                green: {
                    btn: 'bg-green-600 text-white hover:bg-green-700',
                    resultBg: 'bg-green-100 border-green-200 text-green-800'
                },
                orange: {
                    btn: 'bg-orange-500 text-white hover:bg-orange-600',
                    resultBg: 'bg-orange-100 border-orange-200 text-orange-800'
                },
                purple: {
                    btn: 'bg-purple-600 text-white hover:bg-purple-700',
                    resultBg: 'bg-purple-100 border-purple-200 text-purple-800'
                },
                teal: {
                    btn: 'bg-teal-600 text-white hover:bg-teal-700',
                    resultBg: 'bg-teal-100 border-teal-200 text-teal-800'
                }
            };
            
            const currentTheme = theme[colorTheme] || theme.green;

            return (
                <div className="mb-6 border border-slate-200 rounded-xl overflow-hidden shadow-sm bg-white">
                    <div className="flex justify-between items-center bg-slate-50 p-4 border-b border-slate-200">
                        <div className="flex items-center gap-4 overflow-x-auto hide-scrollbar overflow-y-hidden py-1">
                            <span className="font-bold text-xl text-slate-700">{letter})</span>
                            <div className="text-lg"><Latex math={limit} /></div>
                        </div>
                        <button
                            onClick={() => setShowSol(!showSol)}
                            className={`ml-4 shrink-0 px-4 py-2 rounded-lg font-semibold transition-colors ${showSol ? 'bg-slate-200 text-slate-700 hover:bg-slate-300' : currentTheme.btn}`}
                        >
                            {showSol ? 'Ocultar' : 'Ver solución'}
                        </button>
                    </div>
                    {showSol && (
                        <div className="p-6 animate-fade-in bg-white">
                            <div className="text-center mb-6 text-lg text-red-600 font-bold border-b border-slate-100 pb-4">
                                {isTrick ? (
                                    <>¡Ojo! Al sustituir comprobamos que: <Latex math={indet} /></>
                                ) : (
                                    <>Al sustituir obtenemos la indeterminación: <Latex math={indet} /></>
                                )}
                            </div>

                            <div className="bg-slate-50 p-5 rounded-xl border border-slate-200 max-w-3xl mx-auto">
                                <h5 className="font-bold text-slate-700 mb-4 text-center border-b border-slate-300 pb-2">Resolución paso a paso</h5>
                                <div className="flex flex-col items-center gap-4 overflow-x-auto hide-scrollbar text-lg py-2">
                                    {steps.map((step, i) => (
                                        <React.Fragment key={i}>
                                            {typeof step === 'string' ? (
                                                <div className="text-slate-700"><Latex math={step} /></div>
                                            ) : (
                                                step
                                            )}
                                        </React.Fragment>
                                    ))}
                                </div>
                            </div>

                            <div className={`mt-8 text-center text-2xl font-bold ${isTrick ? 'text-red-800 bg-red-100 border-red-200' : currentTheme.resultBg} p-4 rounded-lg shadow-sm border`}>
                                Solución: <Latex math={finalResult.includes("No hay") ? finalResult : `\\mathbf{${finalResult}}`} />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const InteractiveZeroOverZero = () => {
            const [activeTab, setActiveTab] = useState('polinomios');

            return (
                <div>
                    {/* Pestañas */}
                    <div className="flex flex-col md:flex-row border-b border-slate-200 bg-slate-100 rounded-t-lg overflow-hidden">
                        <button onClick={() => setActiveTab('polinomios')} className={`flex-1 py-4 px-4 text-center transition-colors font-bold ${activeTab === 'polinomios' ? 'bg-white border-b-2 border-green-600 text-green-700 shadow-inner' : 'text-slate-600 hover:bg-slate-200'}`}>
                            1. Polinomios (Sin radicales)
                        </button>
                        <button onClick={() => setActiveTab('radicales')} className={`flex-1 py-4 px-4 text-center transition-colors font-bold ${activeTab === 'radicales' ? 'bg-white border-b-2 border-green-600 text-green-700 shadow-inner' : 'text-slate-600 hover:bg-slate-200'}`}>
                            2. Con Radicales
                        </button>
                    </div>

                    <div className="p-6 bg-white border border-t-0 border-slate-200 rounded-b-lg shadow-sm">
                        {activeTab === 'polinomios' && (
                            <div className="animate-fade-in">
                                <p className="text-lg mb-6 text-slate-700">
                                    <strong>Regla:</strong> Factorizamos el numerador y el denominador (sacando factor común, identidades notables o Ruffini) y simplificamos el factor problemático.
                                </p>

                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                                    {/* Ejemplo A */}
                                    <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm">
                                        <h5 className="font-bold text-slate-700 mb-4 border-b border-slate-200 pb-2">Ejemplo a)</h5>
                                        <div className="flex flex-col items-center gap-4 overflow-x-auto hide-scrollbar text-lg">
                                            <Latex math="\displaystyle \lim_{x \to -1} \frac{x+1}{x^2-x-2} = \left[ \frac{0}{0} \right]" />
                                            <div className="text-sm text-slate-500 italic">Factorizamos (teniendo en cuenta que (x+1) será factor común):</div>
                                            <Latex math="\displaystyle = \lim_{x \to -1} \frac{x+1}{(x+1)(x-2)}" />
                                            <Latex math="\displaystyle = \lim_{x \to -1} \frac{1}{x-2}" />
                                            <Latex math="\displaystyle = \frac{1}{-1-2} = \mathbf{-\frac{1}{3}}" />
                                        </div>
                                    </div>

                                    {/* Ejemplo B */}
                                    <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm">
                                        <h5 className="font-bold text-slate-700 mb-4 border-b border-slate-200 pb-2">Ejemplo b)</h5>
                                        <div className="flex flex-col items-center gap-4 overflow-x-auto hide-scrollbar text-lg">
                                            <Latex math="\displaystyle \lim_{x \to 1} \frac{x^2-3x+2}{x^2+x-2} = \left[ \frac{0}{0} \right]" />
                                            <div className="text-sm text-slate-500 italic">Factorizamos sabiendo que (x-1) anula a ambos:</div>
                                            <Latex math="\displaystyle = \lim_{x \to 1} \frac{(x-1)(x-2)}{(x-1)(x+2)}" />
                                            <Latex math="\displaystyle = \lim_{x \to 1} \frac{x-2}{x+2}" />
                                            <Latex math="\displaystyle = \frac{1-2}{1+2} = \mathbf{-\frac{1}{3}}" />
                                        </div>
                                    </div>
                                </div>

                                {/* Tips del profesor */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-amber-50 p-5 rounded-xl border border-amber-200 shadow-sm">
                                        <h5 className="font-bold text-amber-800 mb-2 flex items-center gap-2"><span className="text-xl">💡</span> Truco para Ruffini</h5>
                                        <p className="text-amber-900 text-sm">
                                            Si usas Ruffini para factorizar polinomios de grado 3 o superior, ¡no pierdas tiempo probando raíces a ciegas! Ya sabes qué número poner en la "cajita": es exactamente el valor al que tiende el límite (<Latex math="x \to a" />).
                                        </p>
                                    </div>
                                    <div className="bg-red-50 p-5 rounded-xl border border-red-200 shadow-sm">
                                        <h5 className="font-bold text-red-800 mb-2 flex items-center gap-2"><span className="text-xl">⚠️</span> El 0/0 "Mutante"</h5>
                                        <p className="text-red-900 text-sm mb-3">
                                            A veces, al simplificar el factor, el límite no da un número exacto y se transforma en un <Latex math="\frac{k}{0}" /> (Caso B). Esto ocurre si el factor estaba repetido en el denominador:
                                        </p>
                                        <div className="overflow-x-auto hide-scrollbar text-sm text-center font-semibold text-red-800">
                                            <Latex math="\displaystyle \lim_{x \to 1} \frac{x^2-1}{x^2-2x+1} = \lim_{x \to 1} \frac{(x-1)(x+1)}{(x-1)^2} = \frac{2}{0} \to \infty" />
                                        </div>
                                        <p className="text-red-900 text-sm mt-2">
                                            ¡En este caso tendrías que calcular límites laterales para hallar el signo!
                                        </p>
                                    </div>
                                </div>

                            </div>
                        )}

                        {activeTab === 'radicales' && (
                            <div className="animate-fade-in">
                                <p className="text-lg mb-6 text-slate-700">
                                    <strong>Regla:</strong> Multiplicamos numerador y denominador por el <strong>conjugado</strong> de la expresión que lleva la raíz. Si tras operar la indeterminación sigue, factorizamos y simplificamos el factor problemático.
                                </p>

                                <div className="bg-slate-50 p-6 md:p-8 rounded-xl border border-slate-200 w-full overflow-hidden shadow-sm max-w-4xl mx-auto">
                                    <h5 className="font-bold text-slate-700 mb-4 border-b border-slate-200 pb-2">Ejemplo con Radicales</h5>
                                    <div className="flex flex-col items-center gap-6 overflow-x-auto hide-scrollbar text-lg w-full">
                                        <div className="bg-white px-6 py-3 rounded-lg shadow-sm border border-slate-200">
                                            <Latex math="\displaystyle \lim_{x \to 3} \frac{\sqrt{6+x}-3}{x^2-9} = \left[ \frac{0}{0} \right]" />
                                        </div>
                                        
                                        <div className="text-sm text-slate-500 italic mt-2">1. Multiplicamos y dividimos por el conjugado: <Latex math="(\sqrt{6+x}+3)" /></div>
                                        <div className="bg-white px-6 py-3 rounded-lg shadow-sm border border-slate-200">
                                            <Latex math="\displaystyle = \lim_{x \to 3} \frac{(\sqrt{6+x}-3)(\sqrt{6+x}+3)}{(x^2-9)(\sqrt{6+x}+3)}" />
                                        </div>

                                        <div className="text-sm text-slate-500 italic mt-2">2. Suma por Diferencia = Diferencia de Cuadrados en el numerador:</div>
                                        <div className="bg-white px-6 py-3 rounded-lg shadow-sm border border-slate-200 flex flex-col gap-4">
                                            <Latex math="\displaystyle = \lim_{x \to 3} \frac{(\sqrt{6+x})^2 - 3^2}{(x^2-9)(\sqrt{6+x}+3)}" />
                                            <Latex math="\displaystyle = \lim_{x \to 3} \frac{6+x-9}{(x^2-9)(\sqrt{6+x}+3)} = \lim_{x \to 3} \frac{x-3}{(x^2-9)(\sqrt{6+x}+3)} = \left[ \frac{0}{0} \right]" />
                                        </div>

                                        <div className="text-sm text-red-500 font-bold italic mt-2">3. ¡Sigue la indeterminación 0/0! Factorizamos el denominador <Latex math="(x^2-9)" />:</div>
                                        <div className="bg-white px-6 py-3 rounded-lg shadow-sm border border-red-200">
                                            <Latex math="\displaystyle = \lim_{x \to 3} \frac{x-3}{(x-3)(x+3)(\sqrt{6+x}+3)}" />
                                        </div>

                                        <div className="text-sm text-slate-500 italic mt-2">4. Simplificamos el factor problemático <Latex math="(x-3)" /> y ya podemos sustituir:</div>
                                        <div className="bg-green-50 px-8 py-4 rounded-lg shadow-sm border border-green-300">
                                            <Latex math="\displaystyle = \lim_{x \to 3} \frac{1}{(x+3)(\sqrt{6+x}+3)} = \frac{1}{(3+3)(\sqrt{9}+3)} = \frac{1}{6 \cdot 6} = \mathbf{\frac{1}{36}}" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            )
        };

        const ExerciseListZeroOverZero = () => {
            const exercises = [
                {
                    letter: 'a',
                    limit: "\\displaystyle \\lim_{x \\to 2} \\frac{x^2 - 4}{x - 2}",
                    indet: "\\left[ \\frac{0}{0} \\right]",
                    steps: [
                        <div className="text-sm text-slate-500 italic mt-2">Factorizamos el numerador (Diferencia de cuadrados):</div>,
                        "\\displaystyle = \\lim_{x \\to 2} \\frac{(x - 2)(x + 2)}{x - 2}",
                        <div className="text-sm text-slate-500 italic mt-2">Simplificamos el factor problemático <Latex math="(x-2)" /> :</div>,
                        "\\displaystyle = \\lim_{x \\to 2} (x + 2)",
                        "\\displaystyle = 2 + 2 = 4"
                    ],
                    finalResult: "4"
                },
                {
                    letter: 'b',
                    limit: "\\displaystyle \\lim_{x \\to 3} \\frac{x^2 - 5x + 6}{x - 3}",
                    indet: "\\left[ \\frac{0}{0} \\right]",
                    steps: [
                        <div className="text-sm text-slate-500 italic mt-2">Factorizamos el numerador: <Latex math="x^2 - 5x + 6 = (x - 3)(x - 2)" /></div>,
                        "\\displaystyle = \\lim_{x \\to 3} \\frac{(x - 3)(x - 2)}{x - 3}",
                        <div className="text-sm text-slate-500 italic mt-2">Simplificamos el factor problemático <Latex math="(x-3)" /> :</div>,
                        "\\displaystyle = \\lim_{x \\to 3} (x - 2)",
                        "\\displaystyle = 3 - 2 = 1"
                    ],
                    finalResult: "1"
                },
                {
                    letter: 'c',
                    limit: "\\displaystyle \\lim_{x \\to 1} \\frac{x^3 - 3x + 2}{x^2 - 1}",
                    indet: "\\left[ \\frac{0}{0} \\right]",
                    steps: [
                        <div className="text-sm text-slate-500 italic mt-2">Factorizamos por Ruffini el numerador y por identidades el denominador:</div>,
                        "\\displaystyle = \\lim_{x \\to 1} \\frac{(x - 1)(x^2 + x - 2)}{(x - 1)(x + 1)} = \\lim_{x \\to 1} \\frac{(x - 1)^2(x + 2)}{(x - 1)(x + 1)}",
                        <div className="text-sm text-slate-500 italic mt-2">Simplificamos un factor <Latex math="(x-1)" /> arriba y abajo:</div>,
