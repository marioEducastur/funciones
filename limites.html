                    pathD += `M ${mapX(x)} ${mapY(y)} L ${mapX(x + 1)} ${mapY(y)} `;
                }
            } else {
                let isFirstPoint = true;
                let prevSide = null;
                const NUM_STEPS = 400; 
                for (let i = 0; i <= NUM_STEPS; i++) {
                    let x = minX + (i / NUM_STEPS) * (maxX - minX);
                    
                    if (holeAtTarget && targetX !== null && Math.abs(x - targetX) < ((maxX-minX)/100)) continue; 
                    if (breakAtTarget && targetX !== null && Math.abs(x - targetX) < ((maxX-minX)/80)) { isFirstPoint = true; continue; }
                    
                    if (verticalAsymptote !== null) {
                        let currentSide = x < verticalAsymptote ? -1 : (x > verticalAsymptote ? 1 : 0);
                        if (prevSide !== null && currentSide !== prevSide) {
                            isFirstPoint = true; 
                        }
                        prevSide = currentSide;
                        if (currentSide === 0) continue;
                    }

                    let y = func(x);
                    const rangeY = maxY - minY;
                    
                    if (y === null || isNaN(y) || y > maxY + rangeY * 3 || y < minY - rangeY * 3) {
                        isFirstPoint = true;
                        continue;
                    }

                    if (isFirstPoint) {
                        pathD += `M ${mapX(x)} ${mapY(y)} `;
                        isFirstPoint = false;
                    } else {
                        pathD += `L ${mapX(x)} ${mapY(y)} `;
                    }
                }
            }

            let pointsToDraw = [];
            const addPoint = (xVal, yVal, color) => {
                pointsToDraw.push({ cx: mapX(xVal), cy: mapY(yVal), color });
            };

            if (!isInfinityLimit && !isZoomed) {
                if (baseAnim.stepL !== null) {
                    let yLeft = func(targetX - baseAnim.stepL);
                    if (yLeft !== null) addPoint(targetX - baseAnim.stepL, yLeft, "#1d4ed8");
                }
                if (baseAnim.stepR !== null) {
                    let yRight = func(targetX + baseAnim.stepR);
                    if (yRight !== null) addPoint(targetX + baseAnim.stepR, yRight, "#be123c");
                }
            }
            if (isInfinityLimit) { 
                if (baseAnim.stepL !== null && baseAnim.stepL > 0) {
                    let yLeft = func(-baseAnim.stepL);
                    if (yLeft !== null) addPoint(-baseAnim.stepL, yLeft, "#1d4ed8");
                }
                if (baseAnim.stepR !== null && baseAnim.stepR > 0) {
                    let yRight = func(baseAnim.stepR);
                    if (yRight !== null) addPoint(baseAnim.stepR, yRight, "#be123c");
                }
            }

            return (
                <svg width="100%" height="100%" viewBox={`0 0 ${width} ${height}`} className="max-w-full">
                    {/* Cuadrículas */}
                    {yTicks.map(y => (
                        <g key={`hy${y}`}>
                            <line x1={padding} y1={mapY(y)} x2={width - padding} y2={mapY(y)} stroke="#f1f5f9" strokeWidth="1" />
                            <text x={padding - 5} y={mapY(y) + 4} fontSize="10" fill="#94a3b8" textAnchor="end">
                                {formatTick(y).includes('×') ? formatTick(y).split('^')[0] : formatTick(y)}
                            </text>
                            {formatTick(y).includes('×') && (
                                <text x={padding - 5} y={mapY(y) - 2} fontSize="7" fill="#94a3b8" textAnchor="start">
                                    {formatTick(y).split('^')[1].replace(/[{}]/g, '')}
                                </text>
                            )}
                        </g>
                    ))}
                    {xTicks.map(x => (
                        <g key={`hx${x}`}>
                            <line x1={mapX(x)} y1={padding} x2={mapX(x)} y2={height - padding} stroke="#f1f5f9" strokeWidth="1" />
                            <text x={mapX(x)} y={height - padding + 15} fontSize="10" fill="#94a3b8" textAnchor="middle">
                                {formatTick(x).includes('×') ? formatTick(x).split('^')[0] : formatTick(x)}
                            </text>
                            {formatTick(x).includes('×') && (
                                <text x={mapX(x) + 10} y={height - padding + 10} fontSize="7" fill="#94a3b8" textAnchor="start">
                                    {formatTick(x).split('^')[1].replace(/[{}]/g, '')}
                                </text>
                            )}
                        </g>
                    ))}

                    {/* Ejes principales */}
                    {minY <= 0 && maxY >= 0 && <line x1={padding} y1={mapY(0)} x2={width-padding} y2={mapY(0)} stroke="#64748b" strokeWidth="2" />}
                    {minX <= 0 && maxX >= 0 && <line x1={mapX(0)} y1={padding} x2={mapX(0)} y2={height-padding} stroke="#64748b" strokeWidth="2" />}

                    {/* Dibujo de Asíntotas */}
                    {verticalAsymptote !== null && (
                        <line x1={mapX(verticalAsymptote)} y1={padding} x2={mapX(verticalAsymptote)} y2={height-padding} stroke="#f59e0b" strokeWidth="2" strokeDasharray="6 4" />
                    )}
                    {horizontalAsymptote !== undefined && horizontalAsymptote !== null && (
                        <line x1={padding} y1={mapY(horizontalAsymptote)} x2={width-padding} y2={mapY(horizontalAsymptote)} stroke="#8b5cf6" strokeWidth="2" strokeDasharray="6 4" />
                    )}

                    {/* Curva principal */}
                    <path d={pathD} fill="none" stroke="#0ea5e9" strokeWidth="3" />
                    
                    {/* Funciones a trozos / Etiquetas de Zoom */}
                    {isStepFunction && [...Array(Math.ceil(maxX) - Math.floor(minX) + 1).keys()].map(i => {
                        const x = Math.floor(minX) + i; const y = func(x);
                        return <g key={`step-${x}`}><circle cx={mapX(x)} cy={mapY(y)} r="4" fill="#0ea5e9" /><circle cx={mapX(x+1)} cy={mapY(y)} r="4" fill="white" stroke="#0ea5e9" strokeWidth="2" /></g>
                    })}

                    {animProgress > 0.8 && !isStepFunction && !breakAtTarget && !isInfinityLimit && targetX !== null && targetY !== null && (
                        <g className="transition-opacity duration-300">
                            {holeAtTarget ? (
                                <><circle cx={mapX(targetX)} cy={mapY(targetY)} r="8" fill="white" stroke="#0ea5e9" strokeWidth="3" /><text x={mapX(targetX)} y={mapY(targetY) - 15} fontSize="12" fontWeight="bold" fill="#0284c7" textAnchor="middle">¡HUECO!</text></>
                            ) : (
                                <><circle cx={mapX(targetX)} cy={mapY(targetY)} r="8" fill="#0ea5e9" /><text x={mapX(targetX)} y={mapY(targetY) - 15} fontSize="12" fontWeight="bold" fill="#0284c7" textAnchor="middle">Punto Definido</text></>
                            )}
                        </g>
                    )}

                    {breakAtTarget && animProgress > 0.8 && targetX !== null && targetY !== null && (
                        <g className="transition-opacity duration-300">
                            <circle cx={mapX(targetX)} cy={mapY(func(targetX - 0.001))} r="6" fill="white" stroke="#1d4ed8" strokeWidth="3" />
                            <text x={mapX(targetX) - 15} y={mapY(func(targetX - 0.001)) - 10} fontSize="12" fontWeight="bold" fill="#1d4ed8" textAnchor="end">Límite Izq.</text>
                            <circle cx={mapX(targetX)} cy={mapY(func(targetX + 0.001))} r="6" fill="white" stroke="#be123c" strokeWidth="3" />
                            <text x={mapX(targetX) + 15} y={mapY(func(targetX + 0.001)) + 16} fontSize="12" fontWeight="bold" fill="#be123c" textAnchor="start">Límite Der.</text>
                            <line x1={mapX(targetX)} y1={mapY(func(targetX - 0.001))} x2={mapX(targetX)} y2={mapY(func(targetX + 0.001))} stroke="#94a3b8" strokeWidth="2" strokeDasharray="4 4" />
                            <text x={mapX(targetX) + 8} y={mapY(targetY) + 4} fontSize="11" fill="#64748b" textAnchor="start">No definida</text>
                        </g>
                    )}

                    {/* Puntos móviles matemáticos */}
                    {pointsToDraw.map((p, i) => (
                        <circle key={`p-${i}`} cx={p.cx} cy={p.cy} r="6" fill={p.color} />
                    ))}
                </svg>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
