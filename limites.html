                        "\\displaystyle = \\lim_{x \\to 2} \\frac{(x+2) - x}{x^2-4} = \\lim_{x \\to 2} \\frac{2}{x^2-4} = \\frac{2}{0} \\to \\infty",
                        <div className="text-red-600 font-semibold mt-2">¡Cuidado! Se ha transformado en un caso de divergencia <Latex math="(k/0)" />.</div>,
                        <div className="text-sm text-slate-500 italic mt-2">Estudiamos los límites laterales para deducir el signo del cero:</div>,
                        "\\displaystyle \\lim_{x \\to 2^-} \\dots = \\frac{2}{0^-} = -\\infty \\quad \\text{y} \\quad \\lim_{x \\to 2^+} \\dots = \\frac{2}{0^+} = +\\infty"
                    ],
                    finalResult: "\\text{No hay tendencia global}"
                },
                {
                    letter: 'i',
                    limit: "\\displaystyle \\lim_{x \\to +\\infty} (\\sqrt{9x^2+x} - x)",
                    indet: "\\left[ \\infty - \\infty \\right]",
                    isTrick: true,
                    steps: [
                        <div className="text-red-600 font-semibold mt-2">¡Atención! Antes de lanzarnos a usar conjugados, comprobamos los términos dominantes:</div>,
                        "\\displaystyle \\lim_{x \\to +\\infty} (\\sqrt{9x^2} - x) = \\lim_{x \\to +\\infty} (3x - x)",
                        <div className="text-sm text-slate-500 italic mt-2">Como <Latex math="3x \neq x" />, no hay empate de coeficientes. El primer término domina claramente.</div>,
                        <div className="text-sm text-slate-500 italic mt-2">No necesitamos conjugado. Calculamos directamente:</div>,
                        "\\displaystyle = \\lim_{x \\to +\\infty} 2x = +\\infty"
                    ],
                    finalResult: "+\\infty"
                },
                {
                    letter: 'j',
                    limit: "\\displaystyle \\lim_{x \\to +\\infty} (\\sqrt{x^3+2x} - x)",
                    indet: "\\left[ \\infty - \\infty \\right]",
                    steps: [
                        <div className="text-sm text-slate-500 italic mt-2">Estudiamos los grados de los términos:</div>,
                        "\\text{La raíz tiene grado interior } 3 \\text{, que equivale a un grado exterior } 3/2 = 1.5.",
                        "\\text{El monomio del sustraendo tiene grado } 1.",
                        <div className="text-sm text-slate-500 italic mt-2">Como el grado de la raíz es mayor, no hay empate y domina la carrera hacia el infinito:</div>,
                        "\\displaystyle = \\lim_{x \\to +\\infty} \\sqrt{x^3} = +\\infty"
                    ],
                    finalResult: "+\\infty"
                }
            ];

            return (
                <div>
                    {exercises.map(ex => <GenericExerciseCard key={ex.letter} {...ex} colorTheme="orange" />)}
                </div>
            );
        };

        const InteractiveZeroTimesInf = () => {
            return (
                <div id="indet-0-por-inf" className="mt-16 bg-white rounded-xl shadow-md border border-purple-200 overflow-hidden scroll-mt-24">
                    <div className="bg-purple-600 p-6">
                        <h3 className="text-2xl font-bold text-white mb-2">Resolución: Indeterminación <Latex math="0 \cdot \infty" /></h3>
                        <p className="text-purple-100 text-lg">Esta indeterminación no tiene reglas de resolución propias, sino que sirve de "puente" hacia otras que ya sabemos resolver.</p>
                    </div>
                    
                    <div className="p-6">
                        <div className="bg-purple-50 p-6 rounded-lg mb-10 border-l-4 border-purple-500 shadow-sm">
                            <h3 className="font-bold text-purple-800 mb-2 text-xl">La regla de oro: Multiplicar</h3>
                            <p className="text-lg text-slate-700 mb-4">
                                Para resolver un <Latex math="0 \cdot \infty" />, el único paso que debemos dar es <strong>realizar la operación de multiplicación indicada</strong>.
                            </p>
                            <p className="text-lg text-slate-700">
                                Al multiplicar y juntar los términos en una sola fracción, el límite se transformará automáticamente en un <Latex math="\left[ \frac{0}{0} \right]" /> o en un <Latex math="\left[ \frac{\infty}{\infty} \right]" />. ¡A partir de ahí, solo hay que aplicar las reglas que ya conocemos!
                            </p>
                        </div>

                        <h3 className="text-xl font-bold text-slate-800 mb-6 border-b border-slate-200 pb-2">Ejercicios resueltos:</h3>
                        <ExerciseListZeroTimesInf />
                    </div>
                </div>
            );
        };

        const ExerciseListZeroTimesInf = () => {
            const exercises = [
                {
                    letter: 'a',
                    limit: "\\displaystyle \\lim_{x \\to 1} \\left[ (x^2 - 2x + 1) \\cdot \\frac{1}{x - 1} \\right]",
                    indet: "\\left[ 0 \\cdot \\infty \\right]",
                    steps: [
                        <div className="text-sm text-slate-500 italic mt-2">Multiplicamos para juntar la expresión en una sola fracción:</div>,
                        "\\displaystyle = \\lim_{x \\to 1} \\frac{x^2 - 2x + 1}{x - 1} = \\left[ \\frac{0}{0} \\right]",
                        <div className="text-sm text-slate-500 italic mt-2">Se transforma en 0/0. Factorizamos el numerador (identidad notable):</div>,
                        "\\displaystyle = \\lim_{x \\to 1} \\frac{(x - 1)^2}{x - 1}",
                        <div className="text-sm text-slate-500 italic mt-2">Simplificamos:</div>,
                        "\\displaystyle = \\lim_{x \\to 1} (x - 1) = 1 - 1 = 0"
                    ],
                    finalResult: "0"
                },
                {
                    letter: 'b',
                    limit: "\\displaystyle \\lim_{x \\to +\\infty} \\left[ x \\cdot \\frac{5}{2x + 1} \\right]",
                    indet: "\\left[ \\infty \\cdot 0 \\right]",
                    steps: [
                        <div className="text-sm text-slate-500 italic mt-2">Multiplicamos la x por el numerador de la fracción:</div>,
                        "\\displaystyle = \\lim_{x \\to +\\infty} \\frac{5x}{2x + 1} = \\left[ \\frac{\\infty}{\\infty} \\right]",
                        <div className="text-sm text-slate-500 italic mt-2">Se transforma en infinito partido por infinito. Nos quedamos con los términos dominantes:</div>,
                        "\\displaystyle = \\lim_{x \\to +\\infty} \\frac{5x}{2x} = \\frac{5}{2}"
                    ],
                    finalResult: "\\frac{5}{2}"
                },
                {
                    letter: 'c',
                    limit: "\\displaystyle \\lim_{x \\to +\\infty} x \\cdot (\\sqrt{x^2 + 1} - x)",
                    indet: "\\left[ \\infty \\cdot 0 \\right]",
                    steps: [
                        <div className="text-sm text-slate-500 italic mt-2">Al sustituir el paréntesis da infinito menos infinito. Multiplicamos y dividimos por su conjugado:</div>,
                        "\\displaystyle = \\lim_{x \\to +\\infty} x \\cdot \\frac{(\\sqrt{x^2 + 1} - x)(\\sqrt{x^2 + 1} + x)}{\\sqrt{x^2 + 1} + x}",
                        "\\displaystyle = \\lim_{x \\to +\\infty} x \\cdot \\frac{(x^2 + 1) - x^2}{\\sqrt{x^2 + 1} + x} = \\lim_{x \\to +\\infty} x \\cdot \\frac{1}{\\sqrt{x^2 + 1} + x}",
                        <div className="text-sm text-slate-500 italic mt-2">Multiplicamos la x:</div>,
                        "\\displaystyle = \\lim_{x \\to +\\infty} \\frac{x}{\\sqrt{x^2 + 1} + x} = \\left[ \\frac{\\infty}{\\infty} \\right]",
                        <div className="text-sm text-slate-500 italic mt-2">Ahora aplicamos términos dominantes de mayor grado (despreciamos el +1 interior):</div>,
                        "\\displaystyle = \\lim_{x \\to +\\infty} \\frac{x}{\\sqrt{x^2} + x} = \\lim_{x \\to +\\infty} \\frac{x}{x + x} = \\lim_{x \\to +\\infty} \\frac{x}{2x} = \\frac{1}{2}"
                    ],
                    finalResult: "\\frac{1}{2}"
                },
                {
                    letter: 'd',
                    limit: "\\displaystyle \\lim_{x \\to 0} \\left[ x \\cdot \\left( \\frac{1}{x} - \\frac{1}{x^2 + x} \\right) \\right]",
                    indet: "\\left[ 0 \\cdot \\infty \\right]",
                    steps: [
                        <div className="text-sm text-slate-500 italic mt-2">Multiplicamos la x por ambas fracciones aplicando la propiedad distributiva:</div>,
                        "\\displaystyle = \\lim_{x \\to 0} \\left( \\frac{x}{x} - \\frac{x}{x^2 + x} \\right)",
                        <div className="text-sm text-slate-500 italic mt-2">Simplificamos las fracciones:</div>,
                        "\\displaystyle = \\lim_{x \\to 0} \\left( 1 - \\frac{x}{x(x + 1)} \\right) = \\lim_{x \\to 0} \\left( 1 - \\frac{1}{x + 1} \\right)",
                        <div className="text-sm text-slate-500 italic mt-2">Volvemos a intentar la sustitución directa:</div>,
                        "\\displaystyle = 1 - \\frac{1}{0 + 1} = 1 - 1 = 0"
                    ],
                    finalResult: "0"
                }
            ];

            return (
                <div>
                    {exercises.map(ex => <GenericExerciseCard key={ex.letter} {...ex} colorTheme="purple" />)}
                </div>
            );
        };

        const InteractiveOneToInf = () => {
            return (
                <div id="indet-1-inf" className="mt-16 bg-white rounded-xl shadow-md border border-teal-200 overflow-hidden scroll-mt-24">
                    <div className="bg-teal-600 p-6">
                        <h3 className="text-2xl font-bold text-white mb-2">Resolución: Indeterminación <Latex math="1^\infty" /></h3>
                        <p className="text-teal-100 text-lg">Aparece en funciones exponenciales donde la base tiende a 1 y el exponente a infinito. Está íntimamente ligada al número <Latex math="e" />.</p>
                    </div>
                    
                    <div className="p-6">
                        <div className="bg-teal-50 p-6 rounded-lg mb-10 border-l-4 border-teal-500 shadow-sm">
                            <h3 className="font-bold text-teal-800 mb-2 text-xl">El origen: El número <Latex math="e" /></h3>
                            <p className="text-lg text-slate-700 mb-4">
                                El número de Euler (<Latex math="e \approx 2,71828..." />) se define matemáticamente mediante este famoso límite:
                            </p>
                            <div className="bg-white p-4 rounded border border-teal-200 text-center text-xl font-bold text-teal-700 mb-4 overflow-x-auto hide-scrollbar">
                                <Latex math="\displaystyle \lim_{x \to +\infty} \left( 1 + \frac{1}{x} \right)^x = e" />
                            </div>
                            <p className="text-lg text-slate-700 mb-4">
                                Aunque podríamos intentar manipular algebraicamente nuestra función paso a paso para que se parezca a esta definición, en 1º de Bachillerato utilizamos una <strong>fórmula resolutiva directa</strong> que nos simplifica enormemente el trabajo.
                            </p>

                            <h3 className="font-bold text-teal-800 mt-8 mb-2 text-xl">La fórmula resolutiva (Regla Rápida):</h3>
                            <p className="text-lg text-slate-700 mb-4">
                                Si al calcular <Latex math="\lim_{x \to a} f(x)^{g(x)}" /> comprobamos que la base tiende a 1 y el exponente a infinito, el resultado siempre será <Latex math="e" /> elevado a un nuevo límite mucho más fácil de resolver:
                            </p>
                            <div className="bg-white p-6 rounded-xl border-2 border-teal-300 text-center text-2xl font-bold text-teal-900 shadow-sm overflow-x-auto hide-scrollbar">
                                <Latex math="\displaystyle \lim_{x \to a} f(x)^{g(x)} = e^{\displaystyle \lim_{x \to a} g(x) \cdot [f(x) - 1]}" />
                            </div>
                            <p className="text-sm text-teal-700 mt-3 text-center italic">
                                * Se multiplica el exponente original por la base menos uno.
                            </p>
                        </div>

                        <h3 className="text-xl font-bold text-slate-800 mb-6 border-b border-slate-200 pb-2">Ejercicios resueltos:</h3>
                        <ExerciseListOneToInf />
                    </div>
                </div>
            );
        };

        const ExerciseListOneToInf = () => {
            const exercises = [
                {
                    letter: 'a',
                    limit: "\\displaystyle \\lim_{x \\to +\\infty} \\left( \\frac{x + 2}{x - 1} \\right)^{3x}",
                    indet: "\\left[ 1^{\\infty} \\right]",
                    steps: [
                        <div className="text-sm text-slate-500 italic mt-2">Comprobamos primero que la base tiende a 1 y el exponente a infinito. Luego aplicamos la fórmula:</div>,
                        "\\displaystyle L = e^{\\displaystyle \\lim_{x \\to +\\infty} 3x \\cdot \\left( \\frac{x + 2}{x - 1} - 1 \\right)}",
                        <div className="text-sm text-slate-500 italic mt-2">Hacemos común denominador dentro del paréntesis para restar 1:</div>,
                        "\\displaystyle = e^{\\displaystyle \\lim_{x \\to +\\infty} 3x \\cdot \\left( \\frac{x + 2 - (x - 1)}{x - 1} \\right)} = e^{\\displaystyle \\lim_{x \\to +\\infty} 3x \\cdot \\left( \\frac{x + 2 - x + 1}{x - 1} \\right)}",
                        "\\displaystyle = e^{\\displaystyle \\lim_{x \\to +\\infty} 3x \\cdot \\left( \\frac{3}{x - 1} \\right)}",
                        <div className="text-sm text-slate-500 italic mt-2">Multiplicamos la fracción por el <Latex math="3x" /> exterior:</div>,
                        "\\displaystyle = e^{\\displaystyle \\lim_{x \\to +\\infty} \\frac{9x}{x - 1}}",
                        <div className="text-sm text-slate-500 italic mt-2">Resolvemos el límite del exponente (es un <Latex math="\frac{\infty}{\infty}" /> de mismo grado):</div>,
                        "\\displaystyle = e^{\\frac{9}{1}} = e^9"
                    ],
                    finalResult: "e^9"
                },
                {
                    letter: 'b',
                    limit: "\\displaystyle \\lim_{x \\to +\\infty} \\left( \\frac{2x^2 + 1}{2x^2 - 3} \\right)^{x^2 + 2}",
                    indet: "\\left[ 1^{\\infty} \\right]",
                    steps: [
                        <div className="text-sm text-slate-500 italic mt-2">Aplicamos la fórmula resolutiva: <Latex math="L = e^{\lim g(x) \cdot (f(x) - 1)}" /></div>,
                        "\\displaystyle L = e^{\\displaystyle \\lim_{x \\to +\\infty} (x^2 + 2) \\cdot \\left( \\frac{2x^2 + 1}{2x^2 - 3} - 1 \\right)}",
                        <div className="text-sm text-slate-500 italic mt-2">Restamos 1 haciendo común denominador:</div>,
                        "\\displaystyle = e^{\\displaystyle \\lim_{x \\to +\\infty} (x^2 + 2) \\cdot \\left( \\frac{2x^2 + 1 - (2x^2 - 3)}{2x^2 - 3} \\right)}",
                        "\\displaystyle = e^{\\displaystyle \\lim_{x \\to +\\infty} (x^2 + 2) \\cdot \\left( \\frac{4}{2x^2 - 3} \\right)}",
                        <div className="text-sm text-slate-500 italic mt-2">Multiplicamos el polinomio por el numerador de la fracción:</div>,
                        "\\displaystyle = e^{\\displaystyle \\lim_{x \\to +\\infty} \\frac{4x^2 + 8}{2x^2 - 3}}",
                        <div className="text-sm text-slate-500 italic mt-2">Tomamos los términos dominantes en el exponente:</div>,
                        "\\displaystyle = e^{\\frac{4}{2}} = e^2"
                    ],
                    finalResult: "e^2"
                },
                {
                    letter: 'c',
                    limit: "\\displaystyle \\lim_{x \\to +\\infty} \\left( \\frac{x - 5}{x + 1} \\right)^{\\frac{x}{2}}",
                    indet: "\\left[ 1^{\\infty} \\right]",
                    steps: [
                        <div className="text-sm text-slate-500 italic mt-2">Aplicamos la fórmula:</div>,
                        "\\displaystyle L = e^{\\displaystyle \\lim_{x \\to +\\infty} \\frac{x}{2} \\cdot \\left( \\frac{x - 5}{x + 1} - 1 \\right)}",
                        <div className="text-sm text-slate-500 italic mt-2">Operamos el paréntesis:</div>,
                        "\\displaystyle = e^{\\displaystyle \\lim_{x \\to +\\infty} \\frac{x}{2} \\cdot \\left( \\frac{x - 5 - (x + 1)}{x + 1} \\right)} = e^{\\displaystyle \\lim_{x \\to +\\infty} \\frac{x}{2} \\cdot \\left( \\frac{-6}{x + 1} \\right)}",
                        <div className="text-sm text-slate-500 italic mt-2">Multiplicamos las fracciones (numerador por numerador, denominador por denominador):</div>,
                        "\\displaystyle = e^{\\displaystyle \\lim_{x \\to +\\infty} \\frac{-6x}{2x + 2}}",
                        <div className="text-sm text-slate-500 italic mt-2">Calculamos el límite (mismos grados, se dividen coeficientes):</div>,
                        "\\displaystyle = e^{\\frac{-6}{2}} = e^{-3} = \\frac{1}{e^3}"
                    ],
                    finalResult: "\\frac{1}{e^3}"
                }
            ];

            return (
                <div>
                    {exercises.map(ex => <GenericExerciseCard key={ex.letter} {...ex} colorTheme="teal" />)}
                </div>
            );
        };

        const FutureIndeterminations = () => {
            return (
                <div id="indet-futuras" className="mt-16 bg-slate-50 rounded-xl shadow-inner border-2 border-dashed border-slate-300 overflow-hidden scroll-mt-24">
                    <div className="bg-slate-700 p-6 flex justify-between items-center flex-wrap gap-4">
                        <div>
                            <h3 className="text-2xl font-bold text-white mb-2">Indeterminaciones <Latex math="\infty^0" /> y <Latex math="0^0" /></h3>
                            <p className="text-slate-300 text-lg">¿Por qué no las calculamos este año?</p>
                        </div>
                        <div className="bg-amber-400 text-amber-950 font-bold px-4 py-2 rounded-lg shadow-sm transform md:rotate-2">
                            ¡Próximamente en 2º de Bachillerato!
                        </div>
                    </div>
                    
                    <div className="p-6 md:p-8">
                        <p className="text-lg text-slate-700 mb-6">
                            Para resolver estas dos indeterminaciones exponenciales, el método matemático universal consiste en tomar <strong>logaritmos neperianos</strong> en ambos lados de la igualdad para poder "bajar" el exponente:
                        </p>
                        
                        <div className="bg-white p-6 rounded-lg border border-slate-200 shadow-sm overflow-x-auto hide-scrollbar text-center mb-6">
                            <Latex math="A = \lim_{x \to a} f(x)^{g(x)} \implies \ln A = \lim_{x \to a} [g(x) \cdot \ln f(x)]" display={true} />
                        </div>

                        <p className="text-lg text-slate-700 mb-6">
                            Esto transforma el límite inicial en un <Latex math="0 \cdot \infty" />, que a su vez (como vimos en apartados anteriores) se pasa a fracción para que quede como <Latex math="\left[ \frac{0}{0} \right]" /> o <Latex math="\left[ \frac{\infty}{\infty} \right]" />.
                        </p>

                        <div className="bg-red-50 p-6 rounded-lg border-l-4 border-red-500 mb-6 shadow-sm">
                            <h3 className="font-bold text-red-800 mb-2 text-xl">¿Cuál es el problema?</h3>
                            <p className="text-lg text-slate-700">
                                Que al llegar a esa fracción llena de logaritmos, la inmensa mayoría de las veces es <strong>imposible resolverla factorizando o quedándonos con los grados dominantes</strong>. Requiere obligatoriamente usar herramientas analíticas más potentes.
                            </p>
                        </div>

                        <div className="bg-indigo-50 p-6 md:p-8 rounded-xl border border-indigo-200 text-center shadow-sm">
                            <h3 className="font-bold text-indigo-900 mb-4 text-2xl">La solución: La Regla de L'Hôpital</h3>
                            <p className="text-lg text-indigo-800 mb-4">
                                Esta regla mágica (que utiliza el cálculo de <strong>derivadas</strong> para salvar límites), junto con el manejo fluido de la regla de la cadena en funciones compuestas, es contenido troncal de <strong>2º de Bachillerato</strong>. 
                            </p>
                            <p className="text-lg text-indigo-800 font-semibold bg-indigo-100 py-3 px-6 rounded-lg inline-block">
                                Intentar resolver estos límites ahora mismo nos metería en un callejón sin salida matemático. ¡Así que paciencia, lo mejor está por llegar!
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const InteractiveExample1 = () => {
            const [step, setStep] = useState(0);
            const steps = [0.1, 0.01, 0.001];
            const func = (x) => x * x + 1;

            return (
                <div className="mb-12 border border-slate-200 rounded-xl overflow-hidden">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 1: Función continua</h4>
                        <div className="text-xl font-bold text-blue-700 bg-white px-4 py-3 rounded-lg shadow-sm">
                            <Latex math="\displaystyle \lim_{x \to 2} (x^2 + 1) = 5" />
                        </div>
                    </div>
                    <div className="p-6">
                        <LimitInteractive targetX={2} targetY={5} func={func} step={step} setStep={setStep} steps={steps} graphDomain={[0, 4]} graphRange={[0, 7]} />
                    </div>
                </div>
            );
        };

        const InteractiveExample2 = () => {
            const [step, setStep] = useState(0);
            const steps = [0.1, 0.01, 0.001];
            const func = (x) => {
                if (Math.abs(x - 1) < 0.0000001) return null;
                return (x * x - 1) / (x - 1);
            };

            return (
                <div className="mb-12 border border-slate-200 rounded-xl overflow-hidden">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 2: Discontinuidad evitable</h4>
                        <div className="text-xl font-bold text-blue-700 bg-white px-4 py-3 rounded-lg shadow-sm">
                            <Latex math="\displaystyle \lim_{x \to 1} \frac{x^2 - 1}{x - 1} = 2" />
                        </div>
                    </div>
                    <div className="p-6">
                        <LimitInteractive targetX={1} targetY={2} func={func} step={step} setStep={setStep} steps={steps} holeAtTarget={true} graphDomain={[-1, 3]} graphRange={[-1, 4]} />
                    </div>
                </div>
            );
        };

        const InteractiveExample3 = () => {
            const [step, setStep] = useState(0);
            const steps = [0.1, 0.01, 0.000001];
            const func = (x) => Math.floor(x);

            return (
                <div className="mb-12 border border-slate-200 rounded-xl overflow-hidden">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 3: Función "Parte Entera"</h4>
                        <div className="text-xl font-bold text-red-700 bg-white px-4 py-3 rounded-lg shadow-sm">
                            <Latex math="\displaystyle \lim_{x \to 3} [x] \to \text{No existe}" />
                        </div>
                    </div>
                    <div className="p-6">
                        <LimitInteractive targetX={3} targetY={3} func={func} step={step} setStep={setStep} steps={steps} isStepFunction={true} graphDomain={[0, 5]} graphRange={[0, 5]} />
                    </div>
                </div>
            );
        };

        const InteractiveExample4 = () => {
            const [step, setStep] = useState(0);
            const steps = [0.1, 0.01, 0.001];
            const func = (x) => {
                if (Math.abs(x - 2) < 0.000001) return null;
                if (x < 2) return x + 1;
                return x - 1;
            };

            return (
                <div className="mb-8 border border-slate-200 rounded-xl overflow-hidden mt-8">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 4: Salto Finito</h4>
                        <div className="text-lg font-bold text-purple-700 bg-white px-4 py-2 rounded-lg shadow-sm">
                            <Latex math="f(x) = \begin{cases} x+1 & x < 2 \\ x-1 & x > 2 \end{cases}" />
                        </div>
                    </div>
                    <div className="p-6">
                        <LimitInteractive targetX={2} targetY={2} func={func} step={step} setStep={setStep} steps={steps} breakAtTarget={true} graphDomain={[0, 4]} graphRange={[0, 4]} />
                    </div>
                </div>
            );
        };

        const InteractiveExample5 = () => {
            const [step, setStep] = useState(0);
            const steps = [0.1, 0.01, 0.001, 0.0001, 0.00001];
            
            const func = (x) => {
                if (Math.abs(x) < 0.0000001) return null; // Asíntota en x=0
                return 1 / (x * x);
            };

            let currentDx = 4;
            let maxY = 12;
            if (step > 0) {
                currentDx = steps[step - 1] * 5; 
                maxY = func(0 - steps[step - 1]) * 1.2; 
            }

            return (
                <div className="mb-8 border border-slate-200 rounded-xl overflow-hidden mt-8">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 5: Divergencia positiva</h4>
                        <div className="text-lg font-bold text-blue-700 bg-white px-4 py-2 rounded-lg shadow-sm">
                            <Latex math="\displaystyle \lim_{x \to 0} \frac{1}{x^2} = +\infty" />
                        </div>
                    </div>
                    <div className="p-6">
                        <LimitInteractive 
                            targetX={0} targetY={null} func={func} 
                            step={step} setStep={setStep} steps={steps} 
                            verticalAsymptote={0} 
                            graphDomain={[-currentDx, currentDx]} 
                            graphRange={[-maxY * 0.1, maxY]} 
                            hideZoom={true} 
                            isDivergent={true}
                        />
                    </div>
                </div>
            );
        };

        const InteractiveExample6 = () => {
            const [stepLeft, setStepLeft] = useState(0);
            const [stepRight, setStepRight] = useState(0);
            const steps = [0.1, 0.01, 0.001, 0.0001, 0.00001];
            
            const func = (x) => {
                if (Math.abs(x - 2) < 0.0000001) return null; // Asíntota en x=2
                return 1 / (x - 2);
            };

            const handleSetStepLeft = (val) => {
                setStepLeft(val);
                if (val > 0) setStepRight(0);
            };

            const handleSetStepRight = (val) => {
                setStepRight(val);
                if (val > 0) setStepLeft(0);
            };

            let currentDx = 4;
            let minY = -15;
            let maxY = 15;
            let centerX = 2;

            if (stepLeft > 0) {
                currentDx = steps[stepLeft - 1] * 5;
                minY = func(2 - steps[stepLeft - 1]) * 1.2; 
                maxY = Math.abs(minY) * 0.1; 
                centerX = 2 - steps[stepLeft - 1]; 
            } else if (stepRight > 0) {
                currentDx = steps[stepRight - 1] * 5;
                maxY = func(2 + steps[stepRight - 1]) * 1.2; 
                minY = -maxY * 0.1; 
                centerX = 2 + steps[stepRight - 1]; 
            }

            return (
                <div className="mb-8 border border-slate-200 rounded-xl overflow-hidden mt-8">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center flex-wrap gap-4">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 6: Divergencia con cambio de signo</h4>
                        <div className="flex gap-4">
                            <div className="text-lg font-bold text-blue-700 bg-white px-4 py-2 rounded-lg shadow-sm">
                                <Latex math="\displaystyle \lim_{x \to 2^-} \frac{1}{x-2} = -\infty" />
                            </div>
                            <div className="text-lg font-bold text-rose-700 bg-white px-4 py-2 rounded-lg shadow-sm">
                                <Latex math="\displaystyle \lim_{x \to 2^+} \frac{1}{x-2} = +\infty" />
                            </div>
                        </div>
                    </div>
                    <div className="p-6">
                        <LimitInteractive 
                            targetX={2} targetY={null} func={func} steps={steps} 
                            verticalAsymptote={2} 
                            graphDomain={[centerX - currentDx, centerX + currentDx]} 
                            graphRange={[minY, maxY]} 
                            hideZoom={true} 
                            splitApproaches={true}
                            stepLeft={stepLeft} setStepLeft={handleSetStepLeft}
                            stepRight={stepRight} setStepRight={handleSetStepRight}
                            isDivergent={true}
                        />
                    </div>
                </div>
            );
        };

        const InteractiveExample7 = () => {
            const func = (x) => (10 + 2 * x * x) / (8 + x * x);
            const infinitySteps = [10, 50, 200, 1000];

            return (
                <div className="mb-8 border border-slate-200 rounded-xl overflow-hidden mt-8">
                    <div className="bg-slate-100 p-4 border-b border-slate-200 flex justify-between items-center">
                        <h4 className="font-bold text-lg text-slate-700">Ejemplo 7: Asíntota Horizontal</h4>
                        <div className="text-lg font-bold text-indigo-700 bg-white px-4 py-2 rounded-lg shadow-sm">
                            <Latex math="\displaystyle \lim_{x \to \pm\infty} \frac{10 + 2x^2}{8 + x^2} = 2" />
                        </div>
                    </div>
                    <div className="p-6">
                        <InfinityInteractive func={func} infinitySteps={infinitySteps} horizontalAsymptote={2} />
                    </div>
                </div>
            );
        };

        const LimitInteractive = ({ targetX, targetY, func, step, setStep, steps, holeAtTarget = false, breakAtTarget = false, isStepFunction = false, verticalAsymptote = null, hideZoom = false, splitApproaches = false, stepLeft, setStepLeft, stepRight, setStepRight, graphDomain, graphRange, isDivergent = false }) => {
            
            const [isZoomed, setIsZoomed] = useState(false);

            const activeStepLeft = splitApproaches ? stepLeft : step;
            const activeStepRight = splitApproaches ? stepRight : step;

            const formatNum = (num) => {
                if (num === null || isNaN(num)) return "Indefinido";
                if (Math.abs(num) >= 100000) {
                    const [base, exp] = num.toExponential(2).split('e');
                    return `${base.replace('.', ',')} \\times 10^{${exp.replace('+', '')}}`;
                }
                return parseFloat(num.toFixed(4)).toString().replace('.', ',');
            };

            const getLeftRows = () => {
                let rows = [];
                for (let i = 0; i < activeStepLeft; i++) {
                    let x = targetX - steps[i];
                    rows.push({ x: parseFloat(x.toFixed(5)).toString().replace('.', ','), y: formatNum(func(x)) });
                }
                return rows;
            };

            const getRightRows = () => {
                let rows = [];
                for (let i = 0; i < activeStepRight; i++) {
                    let x = targetX + steps[i];
                    rows.push({ x: parseFloat(x.toFixed(5)).toString().replace('.', ','), y: formatNum(func(x)) });
                }
                return rows;
            };

            const btnTextLeft = activeStepLeft === steps.length 
                ? (isDivergent ? "Divergencia" : "Límite Izquierdo") 
                : "Acercarse por la izquierda";

            const btnTextRight = activeStepRight === steps.length 
                ? (isDivergent ? "Divergencia" : "Límite Derecho") 
                : "Acercarse por la derecha";

            const btnTextCenter = step === steps.length 
                ? (isDivergent ? "Divergencia" : "Límite alcanzado") 
                : `Acercarse más a x = ${targetX}`;

            return (
                <div>
                    <div className="flex justify-center mb-8 flex-wrap gap-4">
                        {splitApproaches ? (
                            <>
                                <button 
                                    onClick={() => { setStepLeft(Math.min(steps.length, stepLeft + 1)); setIsZoomed(false); }}
                                    disabled={stepLeft === steps.length}
                                    className={`text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2 ${stepLeft === steps.length ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}
                                >
                                    {btnTextLeft}
                                </button>
                                <button 
                                    onClick={() => { setStepRight(Math.min(steps.length, stepRight + 1)); setIsZoomed(false); }}
                                    disabled={stepRight === steps.length}
                                    className={`text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2 ${stepRight === steps.length ? 'bg-rose-400 cursor-not-allowed' : 'bg-rose-600 hover:bg-rose-700'}`}
                                >
                                    {btnTextRight}
                                </button>
                            </>
                        ) : (
                            <button 
                                onClick={() => { setStep(Math.min(steps.length, step + 1)); setIsZoomed(false); }}
                                disabled={step === steps.length}
                                className={`text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2 ${step === steps.length ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}
                            >
                                {btnTextCenter}
                            </button>
                        )}
                        
                        {((splitApproaches ? (stepLeft === steps.length || stepRight === steps.length) : (step === steps.length)) && !hideZoom) && (
                            <button 
                                onClick={() => setIsZoomed(!isZoomed)}
                                className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                                {isZoomed ? "Quitar Zoom" : "Ver detalle del punto"}
                            </button>
                        )}

                        {(splitApproaches ? (stepLeft > 0 || stepRight > 0) : (step > 0)) && (
                            <button 
                                onClick={() => { if(splitApproaches){ setStepLeft(0); setStepRight(0); } else { setStep(0); } setIsZoomed(false); }}
                                className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-6 rounded-lg transition-colors"
                            >
                                Reiniciar
                            </button>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="flex flex-col gap-6">
                            <div className={`bg-white rounded-lg border ${splitApproaches && stepRight > 0 ? 'border-slate-100 opacity-50' : 'border-slate-200'} shadow-sm overflow-hidden transition-opacity`}>
                                <div className="bg-blue-50 py-2 text-center text-sm font-semibold text-blue-800 border-b border-blue-100">
                                    Acercándose por la izquierda (<Latex math={`x \\to ${targetX}^-`} />)
                                </div>
                                <table className="w-full text-center">
                                    <thead className="bg-slate-50 border-b border-slate-200">
                                        <tr><th className="py-2 px-4 w-1/2 border-r border-slate-200"><Latex math="x" /></th><th className="py-2 px-4 w-1/2"><Latex math="f(x)" /></th></tr>
                                    </thead>
                                    <tbody>
                                        {getLeftRows().map((r, i) => (
                                            <tr key={i} className="border-b border-slate-100 bg-blue-50/20">
                                                <td className="py-2 px-4 border-r border-slate-200 font-mono text-sm">{r.x}</td>
                                                <td className="py-2 px-4 font-mono text-sm font-semibold text-blue-700">
                                                    {r.y.includes('times') ? <Latex math={r.y} /> : r.y}
                                                </td>
                                            </tr>
                                        ))}
                                        {activeStepLeft === 0 && <tr><td colSpan="2" className="py-4 text-slate-400 italic text-sm">Haz clic en acercarse...</td></tr>}
                                    </tbody>
                                </table>
                            </div>

                            <div className={`bg-white rounded-lg border ${splitApproaches && stepLeft > 0 ? 'border-slate-100 opacity-50' : 'border-slate-200'} shadow-sm overflow-hidden transition-opacity`}>
                                <div className="bg-rose-50 py-2 text-center text-sm font-semibold text-rose-800 border-b border-rose-100">
                                    Acercándose por la derecha (<Latex math={`x \\to ${targetX}^+`} />)
                                </div>
                                <table className="w-full text-center">
                                    <thead className="bg-slate-50 border-b border-slate-200">
                                        <tr><th className="py-2 px-4 w-1/2 border-r border-slate-200"><Latex math="x" /></th><th className="py-2 px-4 w-1/2"><Latex math="f(x)" /></th></tr>
                                    </thead>
                                    <tbody>
                                        {getRightRows().map((r, i) => (
                                            <tr key={i} className="border-b border-slate-100 bg-rose-50/20">
                                                <td className="py-2 px-4 border-r border-slate-200 font-mono text-sm">{r.x}</td>
                                                <td className="py-2 px-4 font-mono text-sm font-semibold text-rose-700">
                                                    {r.y.includes('times') ? <Latex math={r.y} /> : r.y}
                                                </td>
                                            </tr>
                                        ))}
                                        {activeStepRight === 0 && <tr><td colSpan="2" className="py-4 text-slate-400 italic text-sm">Haz clic en acercarse...</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="bg-white rounded-lg border border-slate-200 shadow-sm p-4 relative flex items-center justify-center min-h-[350px] overflow-hidden">
                            <SvgGraph 
                                baseDomain={graphDomain} baseRange={graphRange} func={func} targetX={targetX} targetY={targetY}
                                currentStepLeft={splitApproaches ? (stepLeft > 0 ? steps[stepLeft - 1] : null) : (step > 0 ? steps[step - 1] : null)} 
                                currentStepRight={splitApproaches ? (stepRight > 0 ? steps[stepRight - 1] : null) : (step > 0 ? steps[step - 1] : null)} 
                                holeAtTarget={holeAtTarget} isStepFunction={isStepFunction} 
                                breakAtTarget={breakAtTarget} verticalAsymptote={verticalAsymptote} isZoomed={isZoomed}
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const InfinityInteractive = ({ func, infinitySteps, horizontalAsymptote }) => {
            const [stepLeft, setStepLeft] = useState(0);
            const [stepRight, setStepRight] = useState(0);
            
            const handleSetStepLeft = (val) => {
                setStepLeft(val);
                if (val > 0) setStepRight(0);
            };

            const handleSetStepRight = (val) => {
                setStepRight(val);
                if (val > 0) setStepLeft(0);
            };

            const formatNum = (num) => {
                if (Math.abs(num) >= 100000) {
                    const [base, exp] = num.toExponential(2).split('e');
                    return `${base.replace('.', ',')} \\times 10^{${exp.replace('+', '')}}`;
                }
                return parseFloat(num.toFixed(6)).toString().replace('.', ',');
            }

            const getLeftRows = () => {
                let rows = [];
                for (let i = 0; i < stepLeft; i++) {
                    let x = -infinitySteps[i];
                    rows.push({ x: x, y: formatNum(func(x)) });
                }
                return rows;
            };

            const getRightRows = () => {
                let rows = [];
                for (let i = 0; i < stepRight; i++) {
                    let x = infinitySteps[i];
                    rows.push({ x: x, y: formatNum(func(x)) });
                }
                return rows;
            };

            let currentMinX = -15;
            let currentMaxX = 15;
            if (stepLeft > 0) currentMinX = -infinitySteps[stepLeft - 1] * 1.2;
            if (stepRight > 0) currentMaxX = infinitySteps[stepRight - 1] * 1.2;
            
            const graphDomain = [currentMinX, currentMaxX];
            
            let currentMinY = 0;
            let currentMaxY = 4;
            const activeStep = Math.max(stepLeft, stepRight);
            
            if (activeStep > 0 && horizontalAsymptote !== null && horizontalAsymptote !== undefined) {
                const currentX = stepLeft > 0 ? -infinitySteps[activeStep - 1] : infinitySteps[activeStep - 1];
                const currentY = func(currentX);
                const gap = horizontalAsymptote - currentY;
                
                if (Math.abs(gap) > 0.0001) {
                    currentMinY = horizontalAsymptote - Math.abs(gap) * 3;
                    currentMaxY = horizontalAsymptote + Math.abs(gap) * 3;
                }
            } else if (activeStep > 0 && horizontalAsymptote === null) {
                const currentX = stepLeft > 0 ? -infinitySteps[activeStep - 1] : infinitySteps[activeStep - 1];
                const currentY = func(currentX);
                if (currentY > 0) {
                    currentMaxY = currentY * 1.2;
                    currentMinY = -currentMaxY * 0.1;
                } else {
                    currentMinY = currentY * 1.2;
                    currentMaxY = Math.abs(currentMinY) * 0.1;
                }
            }

            const graphRange = [currentMinY, currentMaxY];

            return (
                <div>
                    <div className="flex justify-center mb-8 flex-wrap gap-4">
                        <button 
                            onClick={() => handleSetStepLeft(Math.min(infinitySteps.length, stepLeft + 1))}
                            disabled={stepLeft === infinitySteps.length}
                            className={`text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2 ${stepLeft === infinitySteps.length ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}
                        >
                            Alejarse hacia -∞
                        </button>
                        
                        <button 
                            onClick={() => handleSetStepRight(Math.min(infinitySteps.length, stepRight + 1))}
                            disabled={stepRight === infinitySteps.length}
                            className={`text-white font-bold py-3 px-6 rounded-lg shadow transition-colors flex items-center gap-2 ${stepRight === infinitySteps.length ? 'bg-rose-400 cursor-not-allowed' : 'bg-rose-600 hover:bg-rose-700'}`}
                        >
                            Alejarse hacia +∞
                        </button>
                        
                        {(stepLeft > 0 || stepRight > 0) && (
                            <button onClick={() => { setStepLeft(0); setStepRight(0); }} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 px-6 rounded-lg transition-colors">
                                Reiniciar
                            </button>
                        )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div className="flex flex-col gap-6">
                            <div className={`bg-white rounded-lg border ${stepRight > 0 ? 'border-slate-100 opacity-50' : 'border-slate-200'} shadow-sm overflow-hidden transition-opacity`}>
                                <div className="bg-blue-50 py-2 text-center text-sm font-semibold text-blue-800 border-b border-blue-100">
                                    Hacia menos infinito (<Latex math={`x \\to -\\infty`} />)
                                </div>
                                <table className="w-full text-center">
                                    <thead className="bg-slate-50 border-b border-slate-200">
                                        <tr><th className="py-2 px-4 w-1/2 border-r border-slate-200"><Latex math="x" /></th><th className="py-2 px-4 w-1/2"><Latex math="f(x)" /></th></tr>
                                    </thead>
                                    <tbody>
                                        {getLeftRows().map((r, i) => (
                                            <tr key={`neg-${i}`} className="border-b border-slate-100 bg-blue-50/20">
                                                <td className="py-2 px-4 border-r border-slate-200 font-mono text-sm">{r.x}</td>
                                                <td className="py-2 px-4 font-mono text-sm font-semibold text-blue-700">
                                                    {r.y.includes('times') ? <Latex math={r.y} /> : r.y}
                                                </td>
                                            </tr>
                                        ))}
                                        {stepLeft === 0 && <tr><td colSpan="2" className="py-4 text-slate-400 italic text-sm">Haz clic en alejarse...</td></tr>}
                                    </tbody>
                                </table>
                            </div>

                            <div className={`bg-white rounded-lg border ${stepLeft > 0 ? 'border-slate-100 opacity-50' : 'border-slate-200'} shadow-sm overflow-hidden transition-opacity`}>
                                <div className="bg-rose-50 py-2 text-center text-sm font-semibold text-rose-800 border-b border-rose-100">
                                    Hacia más infinito (<Latex math={`x \\to +\\infty`} />)
                                </div>
                                <table className="w-full text-center">
                                    <thead className="bg-slate-50 border-b border-slate-200">
                                        <tr><th className="py-2 px-4 w-1/2 border-r border-slate-200"><Latex math="x" /></th><th className="py-2 px-4 w-1/2"><Latex math="f(x)" /></th></tr>
                                    </thead>
                                    <tbody>
                                        {getRightRows().map((r, i) => (
                                            <tr key={`pos-${i}`} className="border-b border-slate-100 bg-rose-50/20">
                                                <td className="py-2 px-4 border-r border-slate-200 font-mono text-sm">{r.x}</td>
                                                <td className="py-2 px-4 font-mono text-sm font-semibold text-rose-700">
                                                    {r.y.includes('times') ? <Latex math={r.y} /> : r.y}
                                                </td>
                                            </tr>
                                        ))}
                                        {stepRight === 0 && <tr><td colSpan="2" className="py-4 text-slate-400 italic text-sm">Haz clic en alejarse...</td></tr>}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="bg-white rounded-lg border border-slate-200 shadow-sm p-4 relative flex items-center justify-center min-h-[350px] overflow-hidden">
                            <SvgGraph 
                                baseDomain={graphDomain} baseRange={graphRange} func={func} 
                                targetX={0} targetY={0} // Fallback
                                horizontalAsymptote={horizontalAsymptote}
                                isInfinityLimit={true}
                                currentStepLeft={stepLeft > 0 ? infinitySteps[stepLeft - 1] : null}
                                currentStepRight={stepRight > 0 ? infinitySteps[stepRight - 1] : null}
                            />
                        </div>
                    </div>
                </div>
            );
        };

        const SvgGraph = ({ baseDomain, baseRange, func, targetX = null, targetY = null, currentStepLeft = null, currentStepRight = null, holeAtTarget = false, isStepFunction = false, breakAtTarget = false, verticalAsymptote = null, horizontalAsymptote = null, obliqueAsymptote = null, isZoomed = false, isInfinityLimit = false }) => {
            const width = 350, height = 350, padding = 40;
            const [animProgress, setAnimProgress] = useState(0);

            const [baseAnim, setBaseAnim] = useState({
                domain: baseDomain,
                range: baseRange,
                stepL: currentStepLeft,
                stepR: currentStepRight
            });
            const prevBaseRef = useRef({ domain: baseDomain, range: baseRange, stepL: currentStepLeft, stepR: currentStepRight });

            useEffect(() => {
                const target = { domain: baseDomain, range: baseRange, stepL: currentStepLeft, stepR: currentStepRight };
                const start = { ...prevBaseRef.current };
                
                if (start.domain[0] === target.domain[0] && start.domain[1] === target.domain[1] &&
                    start.range[0] === target.range[0] && start.range[1] === target.range[1] &&
                    start.stepL === target.stepL && start.stepR === target.stepR) {
                    return;
                }

                let startTime;
                const duration = 600; 
                let frame;

                const animate = (time) => {
                    if (!startTime) startTime = time;
                    let t = Math.min((time - startTime) / duration, 1);
                    t = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; 

                    const nextState = {
                        domain: [
                            start.domain[0] + (target.domain[0] - start.domain[0]) * t,
                            start.domain[1] + (target.domain[1] - start.domain[1]) * t
                        ],
                        range: [
                            start.range[0] + (target.range[0] - start.range[0]) * t,
                            start.range[1] + (target.range[1] - start.range[1]) * t
                        ],
                        stepL: (start.stepL !== null && target.stepL !== null) 
                            ? start.stepL + (target.stepL - start.stepL) * t 
                            : target.stepL,
                        stepR: (start.stepR !== null && target.stepR !== null)
                            ? start.stepR + (target.stepR - start.stepR) * t
                            : target.stepR
                    };

                    setBaseAnim(nextState);
                    prevBaseRef.current = nextState;

                    if (t < 1) frame = requestAnimationFrame(animate);
                };

                frame = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(frame);
            }, [baseDomain[0], baseDomain[1], baseRange[0], baseRange[1], currentStepLeft, currentStepRight]);

            const animProgressRef = useRef(animProgress);
            useEffect(() => {
                let startTime;
                const duration = 600;
                let frame;
                const startProgress = animProgressRef.current;
                const endProgress = isZoomed ? 1 : 0;

                const animate = (time) => {
                    if (!startTime) startTime = time;
                    let t = Math.min((time - startTime) / duration, 1);
                    t = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
                    const nextVal = startProgress + (endProgress - startProgress) * t;
                    
                    setAnimProgress(nextVal);
                    animProgressRef.current = nextVal;
                    
                    if (t < 1) frame = requestAnimationFrame(animate);
                };
                frame = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(frame);
            }, [isZoomed]);

            let zoomDomain = baseAnim.domain, zoomRange = baseAnim.range;
            if (isZoomed && !isInfinityLimit) {
                zoomDomain = [targetX - 0.05, targetX + 0.05];
                if (isStepFunction) zoomRange = [targetY - 1.5, targetY + 0.5];
                else if (breakAtTarget) zoomRange = [targetY - 1.5, targetY + 1.5];
                else zoomRange = [targetY - 0.1, targetY + 0.1];
            }

            const minX = isInfinityLimit ? baseAnim.domain[0] : baseAnim.domain[0] + (zoomDomain[0] - baseAnim.domain[0]) * animProgress;
            const maxX = isInfinityLimit ? baseAnim.domain[1] : baseAnim.domain[1] + (zoomDomain[1] - baseAnim.domain[1]) * animProgress;
            const minY = isInfinityLimit ? baseAnim.range[0] : baseAnim.range[0] + (zoomRange[0] - baseAnim.range[0]) * animProgress;
            const maxY = isInfinityLimit ? baseAnim.range[1] : baseAnim.range[1] + (zoomRange[1] - baseAnim.range[1]) * animProgress;

            const mapX = (x) => padding + ((x - minX) / (maxX - minX)) * (width - 2 * padding);
            const mapY = (y) => height - padding - ((y - minY) / (maxY - minY)) * (height - 2 * padding);

            const getTicks = (min, max) => {
                const range = max - min;
                const roughStep = range / 5;
                if (roughStep <= 0) return [min];
                const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
                const normalized = roughStep / magnitude;
                let step = magnitude;
                if (normalized > 3.5) step = 5 * magnitude;
                else if (normalized > 1.5) step = 2 * magnitude;
                const start = Math.ceil(min / step) * step;
                const ticks = [];
                for (let i = start; i <= max + step/10; i += step) {
                    ticks.push(parseFloat(i.toPrecision(10)));
                }
                return ticks;
            };

            const formatTick = (val) => {
                if (Math.abs(val) >= 1000) {
                    const [base, exp] = val.toExponential(0).split('e');
                    return `${base.replace('.', ',')}×10^{${exp.replace('+', '')}}`;
                }
                return parseFloat(val.toFixed(6)).toString().replace('.', ',');
            };

            const xTicks = getTicks(minX, maxX);
            const yTicks = getTicks(minY, maxY);

            let pathD = "";
            if (isStepFunction) {
                for (let x = Math.floor(minX) - 1; x <= Math.ceil(maxX); x++) {
                    let y = func(x);
                    pathD += `M ${mapX(x)} ${mapY(y)} L ${mapX(x + 1)} ${mapY(y)} `;
                }
            } else {
                let isFirstPoint = true;
                let prevSide = null;
                const NUM_STEPS = 400; 
                for (let i = 0; i <= NUM_STEPS; i++) {
                    let x = minX + (i / NUM_STEPS) * (maxX - minX);
                    
                    if (holeAtTarget && targetX !== null && Math.abs(x - targetX) < ((maxX-minX)/100)) continue; 
                    if (breakAtTarget && targetX !== null && Math.abs(x - targetX) < ((maxX-minX)/80)) { isFirstPoint = true; continue; }
                    
                    if (verticalAsymptote !== null) {
                        let currentSide = x < verticalAsymptote ? -1 : (x > verticalAsymptote ? 1 : 0);
                        if (prevSide !== null && currentSide !== prevSide) {
                            isFirstPoint = true; 
                        }
                        prevSide = currentSide;
                        if (currentSide === 0) continue;
                    }

                    let y = func(x);
                    const rangeY = maxY - minY;
                    
                    if (y === null || isNaN(y) || y > maxY + rangeY * 3 || y < minY - rangeY * 3) {
                        isFirstPoint = true;
                        continue;
                    }

                    if (isFirstPoint) {
                        pathD += `M ${mapX(x)} ${mapY(y)} `;
                        isFirstPoint = false;
                    } else {
                        pathD += `L ${mapX(x)} ${mapY(y)} `;
                    }
                }
            }

            let pointsToDraw = [];
            const addPoint = (xVal, yVal, color) => {
                pointsToDraw.push({ cx: mapX(xVal), cy: mapY(yVal), color });
            };

            if (!isInfinityLimit && !isZoomed) {
                if (baseAnim.stepL !== null) {
                    let yLeft = func(targetX - baseAnim.stepL);
                    if (yLeft !== null) addPoint(targetX - baseAnim.stepL, yLeft, "#1d4ed8");
                }
                if (baseAnim.stepR !== null) {
                    let yRight = func(targetX + baseAnim.stepR);
                    if (yRight !== null) addPoint(targetX + baseAnim.stepR, yRight, "#be123c");
                }
            }
            if (isInfinityLimit) { 
                if (baseAnim.stepL !== null && baseAnim.stepL > 0) {
                    let yLeft = func(-baseAnim.stepL);
                    if (yLeft !== null) addPoint(-baseAnim.stepL, yLeft, "#1d4ed8");
                }
                if (baseAnim.stepR !== null && baseAnim.stepR > 0) {
                    let yRight = func(baseAnim.stepR);
                    if (yRight !== null) addPoint(baseAnim.stepR, yRight, "#be123c");
                }
            }

            return (
                <svg width="100%" height="100%" viewBox={`0 0 ${width} ${height}`} className="max-w-full">
                    {/* Cuadrículas */}
                    {yTicks.map(y => (
                        <g key={`hy${y}`}>
                            <line x1={padding} y1={mapY(y)} x2={width - padding} y2={mapY(y)} stroke="#f1f5f9" strokeWidth="1" />
                            <text x={padding - 5} y={mapY(y) + 4} fontSize="10" fill="#94a3b8" textAnchor="end">
                                {formatTick(y).includes('×') ? formatTick(y).split('^')[0] : formatTick(y)}
                            </text>
                            {formatTick(y).includes('×') && (
                                <text x={padding - 5} y={mapY(y) - 2} fontSize="7" fill="#94a3b8" textAnchor="start">
                                    {formatTick(y).split('^')[1].replace(/[{}]/g, '')}
                                </text>
                            )}
                        </g>
                    ))}
                    {xTicks.map(x => (
                        <g key={`hx${x}`}>
                            <line x1={mapX(x)} y1={padding} x2={mapX(x)} y2={height - padding} stroke="#f1f5f9" strokeWidth="1" />
                            <text x={mapX(x)} y={height - padding + 15} fontSize="10" fill="#94a3b8" textAnchor="middle">
                                {formatTick(x).includes('×') ? formatTick(x).split('^')[0] : formatTick(x)}
                            </text>
                            {formatTick(x).includes('×') && (
                                <text x={mapX(x) + 10} y={height - padding + 10} fontSize="7" fill="#94a3b8" textAnchor="start">
                                    {formatTick(x).split('^')[1].replace(/[{}]/g, '')}
                                </text>
                            )}
                        </g>
                    ))}

                    {/* Ejes principales */}
                    {minY <= 0 && maxY >= 0 && <line x1={padding} y1={mapY(0)} x2={width-padding} y2={mapY(0)} stroke="#64748b" strokeWidth="2" />}
                    {minX <= 0 && maxX >= 0 && <line x1={mapX(0)} y1={padding} x2={mapX(0)} y2={height-padding} stroke="#64748b" strokeWidth="2" />}

                    {/* Dibujo de Asíntotas */}
                    {verticalAsymptote !== null && (
                        <line x1={mapX(verticalAsymptote)} y1={padding} x2={mapX(verticalAsymptote)} y2={height-padding} stroke="#f59e0b" strokeWidth="2" strokeDasharray="6 4" />
                    )}
                    {horizontalAsymptote !== undefined && horizontalAsymptote !== null && (
                        <line x1={padding} y1={mapY(horizontalAsymptote)} x2={width-padding} y2={mapY(horizontalAsymptote)} stroke="#8b5cf6" strokeWidth="2" strokeDasharray="6 4" />
                    )}
                    {obliqueAsymptote !== undefined && obliqueAsymptote !== null && (
                        <line 
                            x1={mapX(minX)} y1={mapY(obliqueAsymptote(minX))} 
                            x2={mapX(maxX)} y2={mapY(obliqueAsymptote(maxX))} 
                            stroke="#10b981" strokeWidth="2" strokeDasharray="6 4" 
                        />
                    )}

                    {/* Curva principal */}
                    <path d={pathD} fill="none" stroke="#0ea5e9" strokeWidth="3" />
                    
                    {/* Funciones a trozos / Etiquetas de Zoom */}
                    {isStepFunction && [...Array(Math.ceil(maxX) - Math.floor(minX) + 1).keys()].map(i => {
                        const x = Math.floor(minX) + i; const y = func(x);
                        return <g key={`step-${x}`}><circle cx={mapX(x)} cy={mapY(y)} r="4" fill="#0ea5e9" /><circle cx={mapX(x+1)} cy={mapY(y)} r="4" fill="white" stroke="#0ea5e9" strokeWidth="2" /></g>
                    })}

                    {animProgress > 0.8 && !isStepFunction && !breakAtTarget && !isInfinityLimit && targetX !== null && targetY !== null && (
                        <g className="transition-opacity duration-300">
                            {holeAtTarget ? (
                                <><circle cx={mapX(targetX)} cy={mapY(targetY)} r="8" fill="white" stroke="#0ea5e9" strokeWidth="3" /><text x={mapX(targetX)} y={mapY(targetY) - 15} fontSize="12" fontWeight="bold" fill="#0284c7" textAnchor="middle">¡HUECO!</text></>
                            ) : (
                                <><circle cx={mapX(targetX)} cy={mapY(targetY)} r="8" fill="#0ea5e9" /><text x={mapX(targetX)} y={mapY(targetY) - 15} fontSize="12" fontWeight="bold" fill="#0284c7" textAnchor="middle">Punto Definido</text></>
                            )}
                        </g>
                    )}

                    {breakAtTarget && animProgress > 0.8 && targetX !== null && targetY !== null && (
                        <g className="transition-opacity duration-300">
                            <circle cx={mapX(targetX)} cy={mapY(func(targetX - 0.001))} r="6" fill="white" stroke="#1d4ed8" strokeWidth="3" />
                            <text x={mapX(targetX) - 15} y={mapY(func(targetX - 0.001)) - 10} fontSize="12" fontWeight="bold" fill="#1d4ed8" textAnchor="end">Límite Izq.</text>
                            <circle cx={mapX(targetX)} cy={mapY(func(targetX + 0.001))} r="6" fill="white" stroke="#be123c" strokeWidth="3" />
                            <text x={mapX(targetX) + 15} y={mapY(func(targetX + 0.001)) + 16} fontSize="12" fontWeight="bold" fill="#be123c" textAnchor="start">Límite Der.</text>
                            <line x1={mapX(targetX)} y1={mapY(func(targetX - 0.001))} x2={mapX(targetX)} y2={mapY(func(targetX + 0.001))} stroke="#94a3b8" strokeWidth="2" strokeDasharray="4 4" />
                            <text x={mapX(targetX) + 8} y={mapY(targetY) + 4} fontSize="11" fill="#64748b" textAnchor="start">No definida</text>
                        </g>
                    )}

                    {/* Puntos móviles matemáticos */}
                    {pointsToDraw.map((p, i) => (
                        <circle key={`p-${i}`} cx={p.cx} cy={p.cy} r="6" fill={p.color} />
                    ))}
                </svg>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
