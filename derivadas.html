                        {/* ══ SECCIÓN 1 ══════════════════════════════════════════════ */}
                        <SectionCard id="sec-1" title="1. Tasas de variación. Derivada de una función en un punto">

                            {/* 1.1 TVM */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3">1.1 Tasa de variación media (TVM)</h3>

                            <p className="text-lg text-slate-700 mb-4">
                                Imagina que <Latex math="f(t)" /> describe el espacio recorrido por un coche en el instante <Latex math="t" />.
                                Si a las <Latex math="t = a" /> segundos el coche está en <Latex math="f(a)" /> metros y a las <Latex math="t = b" /> está en <Latex math="f(b)" /> metros,
                                la <strong>velocidad media</strong> en ese intervalo es el cociente entre la variación de <Latex math="f" /> y la variación de <Latex math="t" />.
                                Esta misma idea se aplica a cualquier función y recibe el nombre de <strong>tasa de variación media</strong>.
                            </p>

                            <div className="bg-blue-50 p-6 rounded-lg mb-6 border-l-4 border-blue-500">
                                <h4 className="font-bold text-blue-800 mb-3 text-lg">Definición: Tasa de Variación Media</h4>
                                <p className="text-lg text-slate-700 mb-2">
                                    La <strong>tasa de variación media</strong> de <Latex math="f" /> en el intervalo <Latex math="[a,\, b]" /> es:
                                </p>
                                <Latex math="\text{TVM}_{[a,\,b]} \;=\; \frac{f(b) - f(a)}{b - a}" display={true} />
                                <p className="text-lg text-slate-700 mb-2">
                                    Si escribimos <Latex math="b = a + h" /> (con <Latex math="h \neq 0" />), la fórmula equivalente es:
                                </p>
                                <Latex math="\text{TVM} \;=\; \frac{f(a+h) - f(a)}{h}" display={true} />
                            </div>

                            <div className="bg-white border border-slate-200 rounded-xl p-5 mb-6">
                                <h4 className="font-semibold text-slate-700 mb-2">Interpretación geométrica</h4>
                                <p className="text-lg text-slate-700">
                                    Los puntos <Latex math="A = (a,\, f(a))" /> y <Latex math="B = (b,\, f(b))" /> pertenecen a la curva.
                                    La <strong>recta secante</strong> que pasa por <Latex math="A" /> y <Latex math="B" /> tiene exactamente la pendiente:
                                </p>
                                <Latex math="m_{\text{sec}} \;=\; \frac{f(b) - f(a)}{b - a} \;=\; \text{TVM}_{[a,b]}" display={true} />
                                <p className="text-lg text-slate-700">Por tanto, la TVM es la <strong>pendiente de la recta secante</strong>.</p>
                            </div>

                            {/* 1.2 Derivative */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">1.2 Tasa de variación instantánea: la derivada</h3>

                            <p className="text-lg text-slate-700 mb-4">
                                La TVM mide el cambio <em>promedio</em> en <Latex math="[a, b]" />. Pero, ¿qué pasa si queremos saber
                                el ritmo de cambio <em>exacto</em> en el instante <Latex math="x = a" />? La idea clave es hacer el intervalo
                                cada vez más pequeño: dejar que <Latex math="h \to 0" />.
                                Cuando <Latex math="h \to 0" />, el punto <Latex math="B" /> se acerca a <Latex math="A" /> y la recta secante
                                tiende a la <strong>recta tangente</strong>. El valor al que converge la TVM, si existe, es la <strong>derivada de <Latex math="f" /> en <Latex math="x = a" /></strong>.
                            </p>

                            <div className="bg-blue-50 p-6 rounded-lg mb-6 border-l-4 border-blue-500">
                                <h4 className="font-bold text-blue-800 mb-3 text-lg">Definición: Derivada en un punto</h4>
                                <p className="text-lg text-slate-700 mb-3">
                                    Se dice que <Latex math="f" /> es <strong>derivable en <Latex math="x = a" /></strong> si existe el siguiente límite finito.
                                    Ese límite se llama <strong>derivada de <Latex math="f" /> en <Latex math="a" /></strong> y se denota <Latex math="f'(a)" />:
                                </p>
                                <Latex math="f'(a) \;=\; \lim_{h \to 0} \frac{f(a+h) - f(a)}{h}" display={true} />
                                <p className="text-lg text-slate-700 mb-3">
                                    Formulación equivalente (sustituyendo <Latex math="x = a + h" />, de modo que <Latex math="h = x - a" /> y cuando <Latex math="h \to 0" /> se tiene <Latex math="x \to a" />):
                                </p>
                                <Latex math="f'(a) \;=\; \lim_{x \to a} \frac{f(x) - f(a)}{x - a}" display={true} />
                            </div>

                            <div className="bg-white border border-slate-200 rounded-xl p-5 mb-6">
                                <h4 className="font-semibold text-slate-700 mb-3">Interpretación geométrica y notaciones</h4>
                                <p className="text-lg text-slate-700 mb-3">
                                    <strong>Geométricamente:</strong> <Latex math="f'(a)" /> es la <strong>pendiente de la recta tangente</strong> a la curva <Latex math="y = f(x)" /> en el punto <Latex math="(a,\, f(a))" />.
                                </p>
                                <p className="text-lg text-slate-700 mb-2"><strong>Notaciones equivalentes:</strong></p>
                                <Latex math="f'(a) \qquad y'(a) \qquad \left.\frac{df}{dx}\right|_{x=a} \qquad \left[Df(x)\right]_{x=a}" display={true} />
                            </div>

                            {/* Visualization */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">Visualización interactiva</h3>
                            <p className="text-lg text-slate-700 mb-4">
                                Mueve el slider para acercar B a A y observa cómo la pendiente de la secante (azul) converge hacia la pendiente de la tangente (naranja discontinua), que es <Latex math="f'(1) = 2" />.
                            </p>
                            <SecantTangentViz />

                            {/* Worked examples */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">Ejemplos resueltos</h3>
                            <p className="text-lg text-slate-700 mb-4">Pulsa sobre cada ejemplo para ver la solución paso a paso.</p>

                            <WorkedExample title={<>Ejemplo 1: cálculo de <Latex math="f'(2)"/> para <Latex math="f(x)=x^2"/> usando la definición</>}>
                                <p><strong>Paso 1.</strong> Aplicamos la definición:</p>
                                <Latex math="f'(2) = \lim_{h \to 0} \frac{f(2+h) - f(2)}{h}" display={true} />
                                <p><strong>Paso 2.</strong> Calculamos <Latex math="f(2+h)" /> y <Latex math="f(2)" />:</p>
                                <Latex math="f(2+h) = (2+h)^2 = 4 + 4h + h^2 \qquad f(2) = 4" display={true} />
                                <p><strong>Paso 3.</strong> Sustituimos y simplificamos el numerador:</p>
                                <Latex math="f'(2) = \lim_{h \to 0} \frac{4 + 4h + h^2 - 4}{h} = \lim_{h \to 0} \frac{4h + h^2}{h}" display={true} />
                                <p><strong>Paso 4.</strong> Factorizamos <Latex math="h" /> en el numerador y cancelamos:</p>
                                <Latex math="= \lim_{h \to 0} \frac{h(4 + h)}{h} = \lim_{h \to 0} (4 + h)" display={true} />
                                <p><strong>Paso 5.</strong> Tomamos el límite:</p>
                                <Latex math="f'(2) = 4 + 0 = \boxed{4}" display={true} />
                                <p className="text-slate-500 italic text-sm">La pendiente de la tangente a y = x² en el punto (2, 4) es 4.</p>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 2: cálculo de <Latex math="f'(a)"/> para <Latex math="f(x)=3x+2"/> usando la definición</>}>
                                <p><strong>Paso 1.</strong> Aplicamos la definición:</p>
                                <Latex math="f'(a) = \lim_{h \to 0} \frac{f(a+h) - f(a)}{h}" display={true} />
                                <p><strong>Paso 2.</strong> Calculamos <Latex math="f(a+h)" /> y <Latex math="f(a)" />:</p>
                                <Latex math="f(a+h) = 3(a+h)+2 = 3a+3h+2 \qquad f(a) = 3a+2" display={true} />
                                <p><strong>Paso 3.</strong> Sustituimos. Los términos sin <Latex math="h" /> se cancelan:</p>
                                <Latex math="f'(a) = \lim_{h \to 0} \frac{(3a+3h+2) - (3a+2)}{h} = \lim_{h \to 0} \frac{3h}{h} = \lim_{h \to 0} 3" display={true} />
                                <p><strong>Paso 4.</strong> El límite de una constante es esa constante:</p>
                                <Latex math="f'(a) = \boxed{3}" display={true} />
                                <p className="text-slate-500 italic text-sm">Para cualquier función lineal f(x) = mx + b, la derivada es siempre la pendiente m. Aquí m = 3.</p>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 3: cálculo de <Latex math="f'(a)"/> para <Latex math="f(x)=1/x"/> usando la definición <Latex math="(a\neq 0)"/></>}>
                                <p><strong>Paso 1.</strong> Aplicamos la definición:</p>
                                <Latex math="f'(a) = \lim_{h \to 0} \dfrac{\dfrac{1}{a+h} - \dfrac{1}{a}}{h}" display={true} />
                                <p><strong>Paso 2.</strong> Operamos la resta de fracciones del numerador:</p>
                                <Latex math="\frac{1}{a+h} - \frac{1}{a} = \frac{a - (a+h)}{a(a+h)} = \frac{-h}{a(a+h)}" display={true} />
                                <p><strong>Paso 3.</strong> Sustituimos en la definición y cancelamos <Latex math="h" />:</p>
                                <Latex math="f'(a) = \lim_{h \to 0} \frac{-h}{a(a+h) \cdot h} = \lim_{h \to 0} \frac{-1}{a(a+h)}" display={true} />
                                <p><strong>Paso 4.</strong> Tomamos el límite:</p>
                                <Latex math="f'(a) = \frac{-1}{a \cdot a} = \boxed{-\dfrac{1}{a^2}}" display={true} />
                                <p className="text-slate-500 italic text-sm">El signo negativo refleja que 1/x es decreciente en todo su dominio (x ≠ 0).</p>
                            </WorkedExample>

                            {/* Exercises */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">Ejercicios de autoevaluación</h3>
                            <p className="text-lg text-slate-700 mb-5">
                                Escribe tu respuesta (puedes usar coma <strong>,</strong> o punto <strong>.</strong> como separador decimal) y pulsa <strong>Comprobar</strong>.
                                Tras dos intentos fallidos aparece una pista; tras tres puedes ver la solución completa.
                            </p>

                            <Exercise
                                number={1}
                                statement={<>Calcula la <strong>tasa de variación media</strong> de <Latex math="f(x) = x^2" /> en el intervalo <Latex math="[1,\; 3]" />.</>}
                                correctAnswer={4}
                                hint="Aplica TVM = [f(3) − f(1)] / (3 − 1). Recuerda: f(3) = 9, f(1) = 1."
                                solution={<><p><Latex math="\text{TVM}_{[1,3]} = \dfrac{f(3)-f(1)}{3-1} = \dfrac{9-1}{2} = \dfrac{8}{2} = 4" /></p></>}
                            />

                            <Exercise
                                number={2}
                                statement={<>Calcula la <strong>tasa de variación media</strong> de <Latex math="f(x) = x^3" /> en el intervalo <Latex math="[0,\; 2]" />.</>}
                                correctAnswer={4}
                                hint="Aplica TVM = [f(2) − f(0)] / (2 − 0). Recuerda: f(2) = 8, f(0) = 0."
                                solution={<><p><Latex math="\text{TVM}_{[0,2]} = \dfrac{f(2)-f(0)}{2-0} = \dfrac{8-0}{2} = \dfrac{8}{2} = 4" /></p></>}
                            />

                            <Exercise
                                number={3}
                                statement={<>Usa la <strong>definición de derivada</strong> para calcular <Latex math="f'(3)" /> siendo <Latex math="f(x) = x^2" />.</>}
                                correctAnswer={6}
                                hint="f'(3) = lim [((3+h)²−9)/h]. Desarrolla (3+h)² = 9+6h+h², cancela el 9 y factoriza h en el numerador."
                                solution={
                                    <>
                                        <p><Latex math="\displaystyle f'(3) = \lim_{h \to 0} \dfrac{(3+h)^2 - 9}{h} = \lim_{h \to 0} \dfrac{9+6h+h^2-9}{h} = \lim_{h \to 0} \dfrac{h(6+h)}{h} = \lim_{h \to 0}(6+h) = 6" /></p>
                                    </>
                                }
                            />

                            <Exercise
                                number={4}
                                statement={<>Usa la <strong>definición de derivada</strong> para calcular <Latex math="f'(0)" /> siendo <Latex math="f(x) = x^2 + 3x" />.</>}
                                correctAnswer={3}
                                hint="f'(0) = lim [f(h)−f(0)]/h = lim [h²+3h]/h. Factoriza h en el numerador."
                                solution={
                                    <>
                                        <p><Latex math="\displaystyle f'(0) = \lim_{h \to 0} \dfrac{f(h)-f(0)}{h} = \lim_{h \to 0} \dfrac{h^2+3h}{h} = \lim_{h \to 0} \dfrac{h(h+3)}{h} = \lim_{h \to 0}(h+3) = 3" /></p>
                                    </>
                                }
                            />

                            <Exercise
                                number={5}
                                statement={<>Un objeto se mueve siguiendo la ley <Latex math="s(t) = t^2 + 2t" /> metros. Calcula su <strong>velocidad instantánea</strong> en <Latex math="t = 2" /> s usando la definición de derivada.</>}
                                correctAnswer={6}
                                hint="Calcula s'(2) = lim [s(2+h)−s(2)]/h. Halla s(2) = 8, luego desarrolla s(2+h) = (2+h)²+2(2+h)."
                                solution={
                                    <>
                                        <p><Latex math="s(2+h) = (2+h)^2+2(2+h) = 4+4h+h^2+4+2h = 8+6h+h^2" /></p>
                                        <p><Latex math="\displaystyle s'(2) = \lim_{h \to 0} \dfrac{(8+6h+h^2)-8}{h} = \lim_{h \to 0} \dfrac{h(6+h)}{h} = \lim_{h \to 0}(6+h) = 6 \ \text{m/s}" /></p>
                                    </>
                                }
                            />

                        </SectionCard>

                        {/* ══ SECCIÓN 2 ══════════════════════════════════════════════ */}
                        <SectionCard id="sec-2" title="2. Función derivada">

                            {/* 2.1 */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3">2.1 De la derivada en un punto a la función derivada</h3>

                            <p className="text-lg text-slate-700 mb-4">
                                En el Epígrafe 1 aprendimos a calcular la derivada de <Latex math="f"/> en un punto concreto: el resultado era un <strong>número</strong>. Por ejemplo, para <Latex math="f(x)=x^2"/> obtuvimos <Latex math="f'(2)=4"/>. Pero si aplicamos la definición para un <Latex math="x"/> genérico obtenemos <Latex math="f'(x)=2x"/>: ya no es un número, es una <strong>función</strong>. La <em>función derivada</em> asigna a cada punto su pendiente de tangente.
                            </p>

                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 mb-5">
                                <p className="font-semibold text-slate-800 mb-2">Diferencia clave:</p>
                                <ul className="space-y-1 text-slate-700 text-base list-disc list-inside">
                                    <li><Latex math="f'(a)"/> es un <strong>número</strong>: la pendiente de la tangente en el punto concreto <Latex math="x=a"/>.</li>
                                    <li><Latex math="f'(x)"/> es una <strong>función</strong>: asigna a cada <Latex math="x"/> del dominio la pendiente de la tangente en ese punto.</li>
                                </ul>
                            </div>

                            <div className="bg-blue-50 p-6 rounded-lg mb-6 border-l-4 border-blue-500">
                                <h4 className="font-bold text-blue-800 mb-3 text-lg">Definición: Función derivada</h4>
                                <p className="text-lg text-slate-700 mb-3">
                                    La <strong>función derivada</strong> de <Latex math="f"/> es la función <Latex math="f'(x)"/> definida por:
                                </p>
                                <Latex math="f'(x) = \lim_{h \to 0} \dfrac{f(x+h)-f(x)}{h}" display={true}/>
                                <p className="text-lg text-slate-700">
                                    Su dominio es el conjunto de puntos en los que ese límite existe y es finito. Se denota también <Latex math="y'"/>, <Latex math="\dfrac{df}{dx}"/> o <Latex math="Df(x)"/>.
                                </p>
                            </div>

                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">Visualización interactiva</h3>
                            <p className="text-lg text-slate-700 mb-4">
                                Mueve el slider y observa cómo la pendiente de la tangente (izquierda, naranja) coincide exactamente con el valor de <Latex math="f'(x)=2x"/> en ese mismo punto (derecha).
                            </p>
                            <DerivativeFunctionViz/>

                            {/* 2.2 */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">2.2 Reglas básicas de derivación</h3>

                            <p className="text-lg text-slate-700 mb-4">
                                Calcular derivadas desde la definición es tedioso. Las siguientes reglas —que se deducen de ella— permiten derivar directamente las funciones más habituales.
                            </p>

                            <div className="bg-blue-50 p-6 rounded-lg mb-5 border-l-4 border-blue-500">
                                <h4 className="font-bold text-blue-800 mb-4 text-lg">Reglas elementales</h4>
                                <div className="space-y-5">
                                    {[
                                        ["1","Constante", "(c)' = 0", "Una función constante no varía, su tasa de cambio es siempre cero."],
                                        ["2","Potencia", "(x^n)' = n\\cdot x^{n-1} \\quad (n\\in\\mathbb{R})", "Válida para cualquier exponente real: entero, fraccionario o negativo."],
                                        ["3","Suma y resta", "(f\\pm g)' = f'\\pm g'", "La derivada de una suma es la suma de las derivadas."],
                                        ["4","Producto por escalar", "(k\\cdot f)' = k\\cdot f' \\quad (k\\in\\mathbb{R})", "Un factor constante «sale» fuera de la derivada."],
                                    ].map(([num, name, formula, note]) => (
                                        <div key={num} className="flex items-start gap-3">
                                            <span className="bg-blue-600 text-white text-xs font-bold w-6 h-6 rounded flex items-center justify-center shrink-0 mt-0.5">{num}</span>
                                            <div>
                                                <p className="font-semibold text-slate-800">{name}</p>
                                                <Latex math={formula} display={true}/>
                                                <p className="text-sm text-slate-600 -mt-1">{note}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-white border border-slate-200 rounded-xl p-5 mb-6">
                                <p className="font-semibold text-slate-700 mb-2">Ejemplo inmediato: derivar cualquier polinomio</p>
                                <Latex math="f(x)=3x^4-2x^2+7 \;\Rightarrow\; f'(x)=12x^3-4x" display={true}/>
                                <p className="text-sm text-slate-600">La constante 7 desaparece (regla 1); a cada potencia se aplica la regla 2 seguida de la regla 4.</p>
                            </div>

                            {/* 2.3 */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">2.3 Regla del producto</h3>

                            <p className="text-lg text-slate-700 mb-4">
                                La derivada del producto de dos funciones <strong>no</strong> es el producto de sus derivadas. La regla correcta es:
                            </p>

                            <div className="bg-blue-50 p-6 rounded-lg mb-5 border-l-4 border-blue-500">
                                <h4 className="font-bold text-blue-800 mb-3 text-lg">Regla del producto</h4>
                                <Latex math="(f\cdot g)' = f'\cdot g + f\cdot g'" display={true}/>
                                <div className="mt-2 inline-flex items-center gap-2 bg-white rounded-lg px-4 py-2 border border-blue-200">
                                    <span className="text-sm text-slate-600 font-medium">Mnemotécnica:</span>
                                    <span className="text-sm font-bold text-blue-700">"prima · segunda + primera · prima"</span>
                                </div>
                            </div>

                            {/* 2.4 */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">2.4 Regla del cociente</h3>

                            <p className="text-lg text-slate-700 mb-4">
                                Para cocientes, la regla es (válida donde <Latex math="g(x)\neq 0"/>):
                            </p>

                            <div className="bg-blue-50 p-6 rounded-lg mb-5 border-l-4 border-blue-500">
                                <h4 className="font-bold text-blue-800 mb-3 text-lg">Regla del cociente</h4>
                                <Latex math="\left(\dfrac{f}{g}\right)' = \dfrac{f'\cdot g - f\cdot g'}{g^2}" display={true}/>
                                <div className="mt-2 inline-flex items-center gap-2 bg-white rounded-lg px-4 py-2 border border-blue-200">
                                    <span className="text-sm text-slate-600 font-medium">Mnemotécnica:</span>
                                    <span className="text-sm font-bold text-blue-700">"prima · segunda − primera · prima, entre segunda al cuadrado"</span>
                                </div>
                                <p className="text-sm text-slate-600 mt-3">El orden de la resta importa: <Latex math="f'g - fg'"/>, no al revés.</p>
                            </div>

                            {/* 2.5 */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">2.5 Tabla de derivadas inmediatas</h3>

                            <p className="text-lg text-slate-700 mb-4">
                                La siguiente tabla recoge las derivadas de las funciones elementales. Es el <strong>punto de partida</strong> para derivar cualquier expresión más compleja.
                            </p>
                            <DerivativesTable/>

                            {/* Ejemplos */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">Ejemplos resueltos</h3>
                            <p className="text-lg text-slate-700 mb-4">Pulsa sobre cada ejemplo para ver la solución paso a paso.</p>

                            <WorkedExample title={<>Ejemplo 1: Polinomio: <Latex math="f(x)=3x^4-2x^2+5x-1"/></>}>
                                <p>Aplicamos la regla de la potencia (R2), del escalar (R4) y de la suma (R3) término a término:</p>
                                <Latex math="f'(x)=3\cdot 4x^3 - 2\cdot 2x + 5\cdot 1 - 0 = 12x^3-4x+5" display={true}/>
                                <p className="text-slate-500 italic text-sm">La constante −1 desaparece al derivar (su derivada es 0).</p>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 2: Funciones de la tabla: <Latex math="f(x)=\sqrt{x}+e^x-2\ln x"/></>}>
                                <p><strong>Paso 1.</strong> Reescribimos <Latex math="\sqrt{x}=x^{1/2}"/> para aplicar la regla de la potencia.</p>
                                <p><strong>Paso 2.</strong> Derivamos término a término usando la tabla de inmediatas:</p>
                                <Latex math="f'(x)=\tfrac{1}{2}x^{-1/2}+e^x-\dfrac{2}{x}=\dfrac{1}{2\sqrt{x}}+e^x-\dfrac{2}{x}" display={true}/>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 3: Regla del producto: <Latex math="f(x)=x^3(2x-1)"/></>}>
                                <p>Identificamos <Latex math="u=x^3"/>, <Latex math="v=2x-1"/>; luego <Latex math="u'=3x^2"/>, <Latex math="v'=2"/>.</p>
                                <Latex math="f'(x)=3x^2(2x-1)+x^3\cdot 2=6x^3-3x^2+2x^3=8x^3-3x^2" display={true}/>
                                <p className="text-slate-500 italic text-sm">Comprobación: desarrollando primero f(x) = 2x⁴ − x³ y derivando directamente se obtiene el mismo resultado. ✓</p>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 4: Regla del cociente: <Latex math="f(x)=(x^2+1)/(x-1)"/></>}>
                                <p>Sea <Latex math="u=x^2+1"/>, <Latex math="v=x-1"/>; entonces <Latex math="u'=2x"/>, <Latex math="v'=1"/>.</p>
                                <Latex math="f'(x)=\dfrac{2x(x-1)-(x^2+1)\cdot 1}{(x-1)^2}=\dfrac{2x^2-2x-x^2-1}{(x-1)^2}=\dfrac{x^2-2x-1}{(x-1)^2}" display={true}/>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 5: Aplicación: recta tangente a <Latex math="f(x)=x^3-2x"/> en <Latex math="x=1"/></>}>
                                <p><strong>Paso 1.</strong> Punto de tangencia: <Latex math="f(1)=1-2=-1"/>. Punto: <Latex math="(1,\,-1)"/>.</p>
                                <p><strong>Paso 2.</strong> Pendiente: <Latex math="f'(x)=3x^2-2 \;\Rightarrow\; f'(1)=3-2=1"/>.</p>
                                <p><strong>Paso 3.</strong> Ecuación punto-pendiente <Latex math="y-y_0=m(x-x_0)"/>:</p>
                                <Latex math="y-(-1)=1\cdot(x-1)\;\Longrightarrow\; \boxed{y=x-2}" display={true}/>
                            </WorkedExample>

                            {/* Ejercicios */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">Ejercicios de autoevaluación</h3>
                            <p className="text-lg text-slate-700 mb-5">
                                Escribe tu respuesta (coma o punto como decimal) y pulsa <strong>Comprobar</strong>.
                                Tras dos intentos fallidos aparece una pista; tras tres puedes ver la solución completa.
                            </p>

                            <Exercise
                                number={6}
                                statement={<>Calcula <Latex math="f'(2)"/> siendo <Latex math="f(x)=2x^3-5x+1"/>.</>}
                                correctAnswer={19}
                                hint="f'(x) = 6x² − 5. Evalúa en x = 2: 6·4 − 5."
                                solution={<><p><Latex math="f'(x)=6x^2-5\;\Rightarrow\; f'(2)=6\cdot4-5=24-5=19"/></p></>}
                            />

                            <Exercise
                                number={7}
                                statement={<>Calcula <Latex math="f'(4)"/> siendo <Latex math="f(x)=\sqrt{x}"/>. Da el resultado en decimal.</>}
                                correctAnswer={0.25}
                                hint="Escribe √x = x^(1/2). Entonces f'(x) = (1/2)·x^(−1/2) = 1/(2√x). Evalúa en x = 4."
                                solution={<><p><Latex math="f'(x)=\dfrac{1}{2\sqrt{x}}\;\Rightarrow\; f'(4)=\dfrac{1}{2\cdot 2}=\dfrac{1}{4}=0{,}25"/></p></>}
                            />

                            <Exercise
                                number={8}
                                statement={<>Calcula <Latex math="f'(0)"/> siendo <Latex math="f(x)=e^x"/>.</>}
                                correctAnswer={1}
                                hint="La derivada de eˣ es ella misma: f'(x) = eˣ. ¿Cuánto vale e⁰?"
                                solution={<><p><Latex math="f'(x)=e^x\;\Rightarrow\; f'(0)=e^0=1"/></p></>}
                            />

                            <Exercise
                                number={9}
                                statement={<>Usa la regla del producto para calcular <Latex math="f'(1)"/> siendo <Latex math="f(x)=x^2\cdot(x+3)"/>.</>}
                                correctAnswer={9}
                                hint="u = x², v = x+3, u' = 2x, v' = 1. Aplica (u·v)' = u'v + uv' y evalúa en x = 1."
                                solution={<>
                                    <p><Latex math="f'(x)=2x(x+3)+x^2\cdot 1=2x^2+6x+x^2=3x^2+6x"/></p>
                                    <p><Latex math="f'(1)=3+6=9"/></p>
                                </>}
                            />

                            <Exercise
                                number={10}
                                statement={<>Usa la regla del cociente para calcular <Latex math="f'(0)"/> siendo <Latex math="f(x)=\dfrac{2x+1}{x-1}"/>.</>}
                                correctAnswer={-3}
                                hint="u = 2x+1, v = x−1, u' = 2, v' = 1. Aplica (u/v)' = (u'v − uv')/v² y evalúa en x = 0."
                                solution={<>
                                    <p><Latex math="f'(x)=\dfrac{2(x-1)-(2x+1)\cdot 1}{(x-1)^2}=\dfrac{2x-2-2x-1}{(x-1)^2}=\dfrac{-3}{(x-1)^2}"/></p>
                                    <p><Latex math="f'(0)=\dfrac{-3}{(-1)^2}=-3"/></p>
                                </>}
                            />

                            <Exercise
                                number={11}
                                statement={<>¿Cuál es la pendiente de la recta tangente a <Latex math="y=\operatorname{sen}\,x"/> en <Latex math="x=0"/>?</>}
                                correctAnswer={1}
                                hint="La derivada de sen x es cos x. Evalúa cos(0)."
                                solution={<><p><Latex math="y'=\cos x\;\Rightarrow\; y'(0)=\cos 0=1"/></p></>}
                            />

                        </SectionCard>

                        {/* ══ SECCIÓN 3 ══════════════════════════════════════════════ */}
                        <SectionCard id="sec-3" title="3. Derivada de la composición de funciones">

                            {/* 3.1 */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3">3.1 Recordatorio: composición de funciones</h3>

                            <p className="text-lg text-slate-700 mb-4">
                                Dadas dos funciones <Latex math="f"/> y <Latex math="g"/>, la <strong>función compuesta</strong> <Latex math="f\circ g"/> se obtiene aplicando primero <Latex math="g"/> y luego <Latex math="f"/>: el resultado de <Latex math="g"/> «entra» como argumento de <Latex math="f"/>.
                            </p>

                            <div className="bg-slate-50 border border-slate-200 rounded-xl p-5 mb-6">
                                <p className="font-semibold text-slate-700 mb-2">Ejemplo rápido:</p>
                                <p className="text-slate-700 mb-3">Si <Latex math="f(x)=x^2"/> y <Latex math="g(x)=x+1"/>:</p>
                                <Latex math="(f\circ g)(x)=f(g(x))=f(x+1)=(x+1)^2" display={true}/>
                                <p className="text-slate-700">Aquí <Latex math="g"/> es la <strong>función interior</strong> (se aplica primero) y <Latex math="f"/> es la <strong>función exterior</strong> (envuelve el resultado).</p>
                            </div>

                            {/* 3.2 */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">3.2 La regla de la cadena</h3>

                            <p className="text-lg text-slate-700 mb-4">
                                <strong>Intuición:</strong> si <Latex math="u"/> cambia el doble de rápido que <Latex math="x"/>, e <Latex math="y"/> cambia el triple de rápido que <Latex math="u"/>, entonces <Latex math="y"/> cambia <strong>seis veces</strong> más rápido que <Latex math="x"/>. Las tasas de variación se <em>encadenan</em> multiplicándose.
                            </p>

                            <div className="bg-blue-50 p-6 rounded-lg mb-6 border-l-4 border-blue-500">
                                <h4 className="font-bold text-blue-800 mb-4 text-lg">Regla de la cadena</h4>
                                <p className="text-lg text-slate-700 mb-2">Si <Latex math="y=f(u)"/> y <Latex math="u=g(x)"/>, en notación de Leibniz:</p>
                                <Latex math="\frac{dy}{dx}=\frac{dy}{du}\cdot\frac{du}{dx}" display={true}/>
                                <p className="text-lg text-slate-700 mb-2">En notación con <Latex math="f'"/> y <Latex math="g'"/>:</p>
                                <Latex math="(f\circ g)'(x)=f'(g(x))\cdot g'(x)" display={true}/>
                                <div className="mt-3 bg-white rounded-lg px-4 py-3 border border-blue-200 text-sm text-slate-700">
                                    La notación de Leibniz ayuda a recordar la regla: las <Latex math="du"/> se «cancelan» (aunque no sean fracciones literales, la intuición es correcta).
                                </div>
                            </div>

                            {/* 3.3 */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">3.3 La analogía de las cajas</h3>

                            <p className="text-lg text-slate-700 mb-4">
                                Para aplicar la regla de forma mecánica, conviene ver cada función compuesta como <strong>cajas anidadas</strong>: una caja exterior que contiene a una caja interior.
                            </p>

                            <div className="bg-blue-50 p-6 rounded-lg mb-6 border-l-4 border-blue-500">
                                <h4 className="font-bold text-blue-800 mb-4 text-lg">Procedimiento: «de fuera hacia dentro, multiplicando»</h4>
                                <ol className="space-y-3 list-none">
                                    {[
                                        ["1","Identifica la caja exterior f(u) y la caja interior u = g(x)."],
                                        ["2","Deriva la caja exterior dejando la interior intacta: f'(u)."],
                                        ["3","Deriva la caja interior: g'(x)."],
                                        ["4","Multiplica ambas derivadas: [f(g(x))]' = f'(g(x))·g'(x)."],
                                    ].map(([n,txt]) => (
                                        <li key={n} className="flex items-start gap-3 text-slate-700">
                                            <span className="bg-blue-600 text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-0.5">{n}</span>
                                            <span>{txt}</span>
                                        </li>
                                    ))}
                                </ol>
                            </div>

                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">Visualización interactiva</h3>
                            <p className="text-lg text-slate-700 mb-4">
                                Selecciona una función y avanza paso a paso para ver cómo se aplica la regla de las cajas.
                            </p>
                            <ChainRuleBoxes/>

                            {/* 3.4 */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">3.4 Casos típicos y error frecuente</h3>

                            <p className="text-lg text-slate-700 mb-4">
                                Aplicando la regla de la cadena a cada función de la tabla de inmediatas del Epígrafe 2 se obtienen estos patrones:
                            </p>

                            <div className="border border-slate-200 rounded-xl overflow-hidden mb-6">
                                <div className="bg-slate-100 px-5 py-3 border-b border-slate-200">
                                    <h4 className="font-bold text-slate-700">Patrones con la regla de la cadena</h4>
                                </div>
                                <div className="overflow-x-auto hide-scrollbar">
                                    <table className="w-full text-sm">
                                        <thead>
                                            <tr className="bg-slate-50 border-b border-slate-200">
                                                <th className="px-4 py-2.5 text-left font-semibold text-slate-600">Función</th>
                                                <th className="px-4 py-2.5 text-left font-semibold text-slate-600">Derivada (aplicando la cadena)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {[
                                                ["[f(x)]^n","n\\cdot[f(x)]^{n-1}\\cdot f'(x)"],
                                                ["\\sqrt{f(x)}","\\dfrac{f'(x)}{2\\sqrt{f(x)}}"],
                                                ["\\operatorname{sen}(f(x))","\\cos(f(x))\\cdot f'(x)"],
                                                ["\\cos(f(x))","-\\operatorname{sen}(f(x))\\cdot f'(x)"],
                                                ["e^{f(x)}","e^{f(x)}\\cdot f'(x)"],
                                                ["\\ln(f(x))","\\dfrac{f'(x)}{f(x)}"],
                                            ].map(([fx,dfx],i) => (
                                                <tr key={i} className={`border-b border-slate-100 ${i%2===0?'bg-white':'bg-slate-50'}`}>
                                                    <td className="px-4 py-3"><Latex math={fx}/></td>
                                                    <td className="px-4 py-3 font-semibold"><Latex math={dfx}/></td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div className="bg-red-50 border-l-4 border-red-500 rounded-xl p-5 mb-6">
                                <h4 className="font-bold text-red-800 mb-4 text-base">Error frecuente: olvidar la derivada de la caja interior</h4>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div className="bg-white rounded-lg p-4 border-2 border-red-300">
                                        <p className="text-xs font-bold text-red-700 uppercase mb-2">Incorrecto</p>
                                        <Latex math="\bigl[(x^2+1)^5\bigr]'=5(x^2+1)^4" display={true}/>
                                        <p className="text-sm text-red-700">Falta multiplicar por <Latex math="(x^2+1)'"/></p>
                                    </div>
                                    <div className="bg-white rounded-lg p-4 border-2 border-green-400">
                                        <p className="text-xs font-bold text-green-700 uppercase mb-2">Correcto</p>
                                        <Latex math="\bigl[(x^2+1)^5\bigr]'=5(x^2+1)^4\cdot 2x" display={true}/>
                                        <p className="text-sm text-green-700">La interior es <Latex math="x^2+1"/>, su derivada es <Latex math="2x"/>.</p>
                                    </div>
                                </div>
                            </div>

                            {/* Ejemplos */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">Ejemplos resueltos</h3>
                            <p className="text-lg text-slate-700 mb-4">Pulsa sobre cada ejemplo para ver la solución paso a paso.</p>

                            <WorkedExample title={<>Ejemplo 1: <Latex math="f(x)=(2x+1)^5"/></>}>
                                <p>Exterior: <Latex math="u^5"/>. Interior: <Latex math="u=2x+1"/>.</p>
                                <p><strong>Exterior derivada</strong> (interior intacta): <Latex math="5(2x+1)^4"/>.</p>
                                <p><strong>Interior derivada:</strong> <Latex math="(2x+1)'=2"/>.</p>
                                <Latex math="f'(x)=5(2x+1)^4\cdot 2=\boxed{10(2x+1)^4}" display={true}/>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 2: <Latex math="f(x)=\operatorname{sen}(3x^2)"/></>}>
                                <p>Exterior: <Latex math="\operatorname{sen}(u)"/>. Interior: <Latex math="u=3x^2"/>.</p>
                                <p><strong>Exterior derivada:</strong> <Latex math="\cos(3x^2)"/>.</p>
                                <p><strong>Interior derivada:</strong> <Latex math="(3x^2)'=6x"/>.</p>
                                <Latex math="f'(x)=\cos(3x^2)\cdot 6x=\boxed{6x\cos(3x^2)}" display={true}/>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 3: <Latex math="f(x)=e^{x^2+1}"/></>}>
                                <p>Exterior: <Latex math="e^u"/>. Interior: <Latex math="u=x^2+1"/>.</p>
                                <p><strong>Exterior derivada:</strong> la derivada de <Latex math="e^u"/> es <Latex math="e^u"/> → con interior intacta: <Latex math="e^{x^2+1}"/>.</p>
                                <p><strong>Interior derivada:</strong> <Latex math="(x^2+1)'=2x"/>.</p>
                                <Latex math="f'(x)=e^{x^2+1}\cdot 2x=\boxed{2xe^{x^2+1}}" display={true}/>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 4: <Latex math="f(x)=\sqrt{\cos x}"/></>}>
                                <p>Reescribimos: <Latex math="f(x)=(\cos x)^{1/2}"/>. Exterior: <Latex math="u^{1/2}"/>. Interior: <Latex math="u=\cos x"/>.</p>
                                <p><strong>Exterior derivada:</strong> <Latex math="\tfrac{1}{2}(\cos x)^{-1/2}=\dfrac{1}{2\sqrt{\cos x}}"/>.</p>
                                <p><strong>Interior derivada:</strong> <Latex math="(\cos x)'=-\operatorname{sen}\,x"/>.</p>
                                <Latex math="f'(x)=\dfrac{1}{2\sqrt{\cos x}}\cdot(-\operatorname{sen}\,x)=\boxed{-\dfrac{\operatorname{sen}\,x}{2\sqrt{\cos x}}}" display={true}/>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 5: <Latex math="f(x)=x\cdot e^{x^2}"/> (producto + cadena)</>}>
                                <p>Aplicamos primero la <strong>regla del producto</strong> con <Latex math="u=x"/> y <Latex math="v=e^{x^2}"/>:</p>
                                <Latex math="f'(x)=1\cdot e^{x^2}+x\cdot\bigl[e^{x^2}\bigr]'" display={true}/>
                                <p>Para <Latex math="\bigl[e^{x^2}\bigr]'"/> usamos la <strong>regla de la cadena</strong> (exterior <Latex math="e^u"/>, interior <Latex math="x^2"/>):</p>
                                <Latex math="\bigl[e^{x^2}\bigr]'=e^{x^2}\cdot 2x" display={true}/>
                                <p>Resultado:</p>
                                <Latex math="f'(x)=e^{x^2}+2x^2 e^{x^2}=\boxed{e^{x^2}(1+2x^2)}" display={true}/>
                            </WorkedExample>

                            {/* Ejercicios */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">Ejercicios de autoevaluación</h3>
                            <p className="text-lg text-slate-700 mb-5">
                                Escribe tu respuesta y pulsa <strong>Comprobar</strong>. Tras dos intentos fallidos aparece una pista; tras tres puedes ver la solución.
                            </p>

                            <Exercise
                                number={12}
                                statement={<>Calcula <Latex math="f'(0)"/> siendo <Latex math="f(x)=(2x-1)^3"/>.</>}
                                correctAnswer={6}
                                hint="f'(x) = 3(2x−1)²·2 = 6(2x−1)². Evalúa en x = 0: 6·(−1)² = 6."
                                solution={<><p><Latex math="f'(x)=3(2x-1)^2\cdot 2=6(2x-1)^2\;\Rightarrow\; f'(0)=6\cdot(-1)^2=6"/></p></>}
                            />

                            <Exercise
                                number={13}
                                statement={<>Calcula <Latex math="f'(0)"/> siendo <Latex math="f(x)=e^{3x}"/>.</>}
                                correctAnswer={3}
                                hint="Cadena: exterior eᵘ, interior 3x. f'(x) = e^(3x)·3. Evalúa en x = 0: e⁰·3 = 3."
                                solution={<><p><Latex math="f'(x)=e^{3x}\cdot 3\;\Rightarrow\; f'(0)=e^0\cdot 3=3"/></p></>}
                            />

                            <Exercise
                                number={14}
                                statement={<>Calcula <Latex math="f'(0)"/> siendo <Latex math="f(x)=\ln(e^x+1)"/>. Da el resultado en decimal.</>}
                                correctAnswer={0.5}
                                hint="Cadena: exterior ln(u), interior eˣ+1. f'(x) = eˣ/(eˣ+1). Evalúa en x = 0: 1/(1+1) = 0,5."
                                solution={<><p><Latex math="f'(x)=\dfrac{e^x}{e^x+1}\;\Rightarrow\; f'(0)=\dfrac{1}{1+1}=0{,}5"/></p></>}
                            />

                            <Exercise
                                number={15}
                                statement={<>Calcula <Latex math="f'(1)"/> siendo <Latex math="f(x)=(x^2+1)^3"/>.</>}
                                correctAnswer={24}
                                hint="f'(x) = 3(x²+1)²·2x = 6x(x²+1)². Evalúa en x = 1: 6·1·(1+1)² = 6·4 = 24."
                                solution={<><p><Latex math="f'(x)=3(x^2+1)^2\cdot 2x=6x(x^2+1)^2\;\Rightarrow\; f'(1)=6\cdot 4=24"/></p></>}
                            />

                            <Exercise
                                number={16}
                                statement={<>Combina producto y cadena para calcular <Latex math="f'(1)"/> siendo <Latex math="f(x)=x\cdot(x^2+1)^2"/>.</>}
                                correctAnswer={12}
                                hint="u = x, v = (x²+1)², u' = 1, v' = 4x(x²+1) (cadena). Aplica (uv)' = u'v+uv' y evalúa en x = 1."
                                solution={<>
                                    <p><Latex math="f'(x)=(x^2+1)^2+x\cdot 4x(x^2+1)=(x^2+1)(5x^2+1)"/></p>
                                    <p><Latex math="f'(1)=2\cdot 6=12"/></p>
                                </>}
                            />

                            <Exercise
                                number={17}
                                statement={<>Combina cociente y cadena para calcular <Latex math="f'(0)"/> siendo <Latex math="f(x)=\dfrac{e^{2x}}{e^x+1}"/>. Da el resultado en decimal.</>}
                                correctAnswer={0.75}
                                hint="u = e^(2x) (derivada: 2e^(2x), cadena), v = eˣ+1 (derivada: eˣ). Aplica (u/v)' y evalúa en x = 0."
                                solution={<>
                                    <p><Latex math="f'(x)=\dfrac{2e^{2x}(e^x+1)-e^{2x}\cdot e^x}{(e^x+1)^2}=\dfrac{e^{2x}(e^x+2)}{(e^x+1)^2}"/></p>
                                    <p><Latex math="f'(0)=\dfrac{1\cdot 3}{4}=\dfrac{3}{4}=0{,}75"/></p>
                                </>}
                            />

                        </SectionCard>

                        {/* ══ SECCIÓN 4 ══════════════════════════════════════════════ */}
                        <SectionCard id="sec-4" title="4. Continuidad y derivabilidad">

                            {/* 4.1 Repaso continuidad */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3">4.1 Continuidad: recordatorio</h3>
                            <div className="bg-blue-50 border border-blue-200 rounded-xl p-5 mb-6">
                                <p className="font-semibold text-blue-900 mb-4">Una función es <strong>continua en <Latex math="x=a"/></strong> si se cumplen las tres condiciones:</p>
                                <ol className="space-y-3 mb-5">
                                    <li className="flex gap-3 items-start">
                                        <span className="shrink-0 w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold">1</span>
                                        <p className="text-slate-700"><Latex math="f(a)"/> está definida. Es decir, <Latex math="a"/> pertenece al dominio de <Latex math="f"/>.</p>
                                    </li>
                                    <li className="flex gap-3 items-start">
                                        <span className="shrink-0 w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold">2</span>
                                        <p className="text-slate-700">Existe <Latex math="\displaystyle\lim_{x\to a}f(x)"/>. Es decir, los límites laterales coinciden y son finitos.</p>
                                    </li>
                                    <li className="flex gap-3 items-start">
                                        <span className="shrink-0 w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold">3</span>
                                        <p className="text-slate-700">Ambos valores son iguales: <Latex math="\displaystyle\lim_{x\to a}f(x)=f(a)"/>.</p>
                                    </li>
                                </ol>
                                <div className="border-t border-blue-200 pt-4">
                                    <p className="text-blue-900 text-sm font-medium mb-1">En resumen:</p>
                                    <Latex math="\lim_{x \to a} f(x) = f(a)" display={true}/>
                                </div>
                            </div>

                            {/* 4.2 Teorema */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">4.2 Teorema fundamental</h3>
                            <div className="bg-blue-600 text-white rounded-xl p-5 mb-4">
                                <p className="font-bold text-lg mb-1">Teorema</p>
                                <p>Si <Latex math="f"/> es derivable en <Latex math="x=a"/>, entonces <Latex math="f"/> es continua en <Latex math="x=a"/>.</p>
                            </div>
                            <div className="bg-amber-50 border-l-4 border-amber-400 rounded-xl p-5 mb-6">
                                <p className="font-bold text-amber-900 mb-1">El recíproco es falso</p>
                                <p className="text-amber-800">Una función puede ser continua sin ser derivable. El contraejemplo clásico es <Latex math="f(x)=|x|"/> en <Latex math="x=0"/>: es continua pero tiene un <em>punto anguloso</em>.</p>
                            </div>

                            {/* 4.3 Motivación: |x| */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">4.3 El problema de <Latex math="f(x)=|x|"/></h3>
                            <p className="text-lg text-slate-700 mb-4">
                                La función <Latex math="f(x)=|x|"/> es continua en <Latex math="x=0"/>, pero tiene un <strong>vértice abrupto</strong>. Si intentamos calcular la derivada:
                            </p>
                            <div className="bg-slate-50 rounded-xl p-5 mb-4 border border-slate-200">
                                <p className="text-slate-700 mb-2 font-medium">Aproximando por la izquierda (<Latex math="h \to 0^-"/>):</p>
                                <Latex math="f'(0^-)=\lim_{h\to 0^-}\frac{|0+h|-|0|}{h}=\lim_{h\to 0^-}\frac{|h|}{h}=\lim_{h\to 0^-}\frac{-h}{h}=-1" display={true}/>
                                <p className="text-slate-700 mb-2 mt-3 font-medium">Aproximando por la derecha (<Latex math="h \to 0^+"/>):</p>
                                <Latex math="f'(0^+)=\lim_{h\to 0^+}\frac{|h|}{h}=\lim_{h\to 0^+}\frac{h}{h}=+1" display={true}/>
                                <p className="text-red-700 font-semibold mt-3">Como <Latex math="f'(0^-)\neq f'(0^+)"/>, la función <strong>no es derivable</strong> en <Latex math="x=0"/>.</p>
                            </div>
                            <p className="text-lg text-slate-700 mb-6">Este razonamiento generaliza a cualquier función: para decidir si <Latex math="f"/> es derivable en un punto, basta comparar las <strong>derivadas laterales</strong>.</p>

                            {/* 4.4 Derivadas laterales */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">4.4 Derivadas laterales</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                                <div className="bg-orange-50 border border-orange-200 rounded-xl p-5">
                                    <p className="font-bold text-orange-800 mb-2">Derivada lateral izquierda</p>
                                    <Latex math="f'(a^-)=\lim_{h\to 0^-}\dfrac{f(a+h)-f(a)}{h}" display={true}/>
                                </div>
                                <div className="bg-orange-50 border border-orange-200 rounded-xl p-5">
                                    <p className="font-bold text-orange-800 mb-2">Derivada lateral derecha</p>
                                    <Latex math="f'(a^+)=\lim_{h\to 0^+}\dfrac{f(a+h)-f(a)}{h}" display={true}/>
                                </div>
                            </div>
                            <div className="bg-blue-50 border border-blue-200 rounded-xl p-5 mb-6">
                                <p className="font-bold text-blue-900 mb-2">Criterio de derivabilidad</p>
                                <p className="text-blue-800"><Latex math="f"/> es derivable en <Latex math="x=a"/> <strong>si y solo si</strong> <Latex math="f'(a^-)=f'(a^+)"/>. En ese caso, ese valor común es <Latex math="f'(a)"/>.</p>
                            </div>

                            {/* Galería interactiva */}
                            <DerivabilityGallery/>

                            {/* 4.5 Tipos de no-derivabilidad */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">4.5 Tipos de no-derivabilidad</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                                <div className="bg-red-50 border border-red-200 rounded-xl p-4">
                                    <p className="font-bold text-red-800 mb-1">Punto anguloso</p>
                                    <p className="text-red-700 text-sm">La función es continua pero las derivadas laterales son distintas. La gráfica forma un <em>vértice</em>.</p>
                                    <p className="text-red-700 text-sm mt-2">Ejemplo: <Latex math="f(x)=|x|"/> en <Latex math="x=0"/>.</p>
                                </div>
                                <div className="bg-red-50 border border-red-200 rounded-xl p-4">
                                    <p className="font-bold text-red-800 mb-1">Discontinuidad</p>
                                    <p className="text-red-700 text-sm">Si <Latex math="f"/> no es continua en <Latex math="x=a"/>, tampoco puede ser derivable (por el teorema).</p>
                                    <p className="text-red-700 text-sm mt-2">Ejemplo: función a escalones con salto.</p>
                                </div>
                                <div className="bg-red-50 border border-red-200 rounded-xl p-4">
                                    <p className="font-bold text-red-800 mb-1">Tangente vertical</p>
                                    <p className="text-red-700 text-sm">La derivada lateral tiende a <Latex math="\pm\infty"/>. La recta tangente existe pero es vertical.</p>
                                    <p className="text-red-700 text-sm mt-2">Ejemplo: <Latex math="f(x)=\sqrt[3]{x}"/> en <Latex math="x=0"/>.</p>
                                </div>
                            </div>

                            {/* 4.6 Método para funciones a trozos */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">4.6 Método para funciones a trozos</h3>
                            <p className="text-lg text-slate-700 mb-4">Para estudiar la derivabilidad de una función definida a trozos en el punto de unión <Latex math="x=a"/>:</p>
                            <ol className="space-y-3 mb-6">
                                <li className="flex gap-3 items-start">
                                    <span className="shrink-0 w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-bold">1</span>
                                    <div>
                                        <p className="font-semibold text-slate-800">Comprobar continuidad</p>
                                        <p className="text-slate-700">Verifica que <Latex math="f(a^-)=f(a^+)=f(a)"/>. Si no es continua, tampoco es derivable (fin).</p>
                                    </div>
                                </li>
                                <li className="flex gap-3 items-start">
                                    <span className="shrink-0 w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-bold">2</span>
                                    <div>
                                        <p className="font-semibold text-slate-800">Calcular derivadas laterales</p>
                                        <p className="text-slate-700">Deriva cada tramo por separado y evalúa en <Latex math="x=a"/>.</p>
                                    </div>
                                </li>
                                <li className="flex gap-3 items-start">
                                    <span className="shrink-0 w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-bold">3</span>
                                    <div>
                                        <p className="font-semibold text-slate-800">Comparar</p>
                                        <p className="text-slate-700">Si <Latex math="f'(a^-)=f'(a^+)"/>, la función es derivable y ese valor común es <Latex math="f'(a)"/>. Si difieren, hay un punto anguloso.</p>
                                    </div>
                                </li>
                            </ol>

                            {/* Ejemplos */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">Ejemplos resueltos</h3>
                            <p className="text-lg text-slate-700 mb-4">Pulsa sobre cada ejemplo para ver la solución paso a paso.</p>

                            <WorkedExample title={<>Ejemplo 1: <Latex math="f(x)=|x|"/> es continua pero no derivable en <Latex math="x=0"/></>}>
                                <p><strong>Continuidad.</strong> <Latex math="f(0)=0"/>. <Latex math="\displaystyle\lim_{x\to 0^-}(-x)=0"/> y <Latex math="\displaystyle\lim_{x\to 0^+}x=0"/>. Los tres valores coinciden: <Latex math="f"/> es continua en <Latex math="x=0"/>.</p>
                                <p><strong>Derivabilidad.</strong></p>
                                <Latex math="f'(0^-)=\lim_{h\to 0^-}\frac{|h|}{h}=\lim_{h\to 0^-}\frac{-h}{h}=-1" display={true}/>
                                <Latex math="f'(0^+)=\lim_{h\to 0^+}\frac{|h|}{h}=\lim_{h\to 0^+}\frac{h}{h}=+1" display={true}/>
                                <p>Como <Latex math="f'(0^-)\neq f'(0^+)"/>, la función <strong>no es derivable</strong> en <Latex math="x=0"/>. Hay un punto anguloso.</p>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 2: hallar <Latex math="a"/> y <Latex math="b"/> para que <Latex math="f"/> sea derivable en <Latex math="x=1"/></>}>
                                <p>Sea <Latex math="f(x)=\begin{cases}ax+b & \text{si } x\leq 1\\ x^2 & \text{si } x>1\end{cases}"/>.</p>
                                <p><strong>Paso 1 &ndash; Continuidad en <Latex math="x=1"/>:</strong></p>
                                <Latex math="f(1^-)=a+b;\quad f(1^+)=1" display={true}/>
                                <Latex math="\Rightarrow\quad a+b=1 \qquad (1)" display={true}/>
                                <p><strong>Paso 2 &ndash; Derivadas laterales:</strong></p>
                                <Latex math="f'(1^-)=a;\quad f'(1^+)=2\cdot 1=2" display={true}/>
                                <Latex math="\Rightarrow\quad a=2 \qquad (2)" display={true}/>
                                <p><strong>Resultado:</strong> De (2): <Latex math="a=2"/>. Sustituyendo en (1): <Latex math="b=1-2=-1"/>. Con <Latex math="a=2"/> y <Latex math="b=-1"/> la función es derivable en <Latex math="x=1"/> y <Latex math="f'(1)=2"/>.</p>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 3: función a trozos con potencia cúbica</>}>
                                <p>Sea <Latex math="f(x)=\begin{cases}x^3 & \text{si } x\leq 1\\ 3x-2 & \text{si } x>1\end{cases}"/>. Estudia la derivabilidad en <Latex math="x=1"/>.</p>
                                <p><strong>Paso 1 &ndash; Continuidad:</strong></p>
                                <Latex math="f(1^-)=1^3=1;\quad f(1^+)=3(1)-2=1" display={true}/>
                                <p>Ambos coinciden con <Latex math="f(1)=1"/>: la función es continua.</p>
                                <p><strong>Paso 2 &ndash; Derivadas laterales:</strong></p>
                                <Latex math="f'(1^-)=(x^3)'\big|_{x=1}=3x^2\big|_{x=1}=3" display={true}/>
                                <Latex math="f'(1^+)=(3x-2)'=3" display={true}/>
                                <p><strong>Conclusión:</strong> <Latex math="f'(1^-)=f'(1^+)=3"/> &rarr; <Latex math="f"/> es derivable en <Latex math="x=1"/> y <Latex math="f'(1)=3"/>.</p>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 4: análisis completo de <Latex math="f"/> en <Latex math="x=0"/></>}>
                                <p>Sea <Latex math="f(x)=\begin{cases}1 & \text{si } x\leq 0\\ x+1 & \text{si } x>0\end{cases}"/>. Estudia continuidad y derivabilidad en <Latex math="x=0"/>.</p>
                                <p><strong>Continuidad:</strong></p>
                                <Latex math="f(0)=1;\quad f(0^-)=1;\quad f(0^+)=0+1=1" display={true}/>
                                <p>Los tres valores coinciden: <Latex math="f"/> es continua en <Latex math="x=0"/>.</p>
                                <p><strong>Derivadas laterales:</strong></p>
                                <Latex math="f'(0^-)=(1)'=0;\quad f'(0^+)=(x+1)'=1" display={true}/>
                                <p><Latex math="f'(0^-)\neq f'(0^+)"/> &rarr; <Latex math="f"/> <strong>no es derivable</strong> en <Latex math="x=0"/>. Hay un punto anguloso aunque la gráfica parezca suave.</p>
                            </WorkedExample>

                            <WorkedExample title={<>Ejemplo 5: puntos no derivables de <Latex math="f(x)=|x^2-4|"/></>}>
                                <p>Reescribimos: <Latex math="|x^2-4|=|(x-2)(x+2)|"/>. El módulo introduce vértices donde el interior se anula: <Latex math="x^2-4=0\Rightarrow x=\pm 2"/>.</p>
                                <p><strong>Análisis en <Latex math="x=2"/>:</strong></p>
                                <Latex math="f'(2^-)=\bigl(4-x^2\bigr)'\big|_{x=2}=-2x\big|_{x=2}=-4" display={true}/>
                                <Latex math="f'(2^+)=\bigl(x^2-4\bigr)'\big|_{x=2}=2x\big|_{x=2}=+4" display={true}/>
                                <p>Como <Latex math="-4\neq+4"/>, hay un <strong>punto anguloso</strong> en <Latex math="x=2"/>. Por simetría, ocurre lo mismo en <Latex math="x=-2"/>.</p>
                                <p><strong>Conclusión:</strong> <Latex math="f(x)=|x^2-4|"/> no es derivable en <Latex math="x=-2"/> ni en <Latex math="x=2"/>.</p>
                            </WorkedExample>

                            {/* Ejercicios */}
                            <h3 className="text-xl font-bold text-slate-800 mb-3 mt-8 pt-6 border-t border-slate-100">Ejercicios</h3>
                            <div className="space-y-4">

                                <Exercise
                                    number={18}
                                    statement={<>Sea <Latex math="f(x)=\begin{cases}ax+2 & x\leq 1\\ x^2+5 & x>1\end{cases}"/>. Halla <Latex math="a"/> para que <Latex math="f"/> sea continua en <Latex math="x=1"/>.</>}
                                    hint="Iguala f(1⁻) = f(1⁺): escribe la expresión del tramo izquierdo en x = 1 y la del tramo derecho, y despeja a."
                                    solution={<><Latex math="f(1^-)=a\cdot 1+2=a+2"/>; <Latex math="f(1^+)=1+5=6"/>. Igualando: <Latex math="a+2=6\Rightarrow a=4"/>.</>}
                                    correctAnswer={4}
                                />

                                <Exercise
                                    number={19}
                                    statement={<>Sea <Latex math="f(x)=\begin{cases}x^2+2x & x\leq 2\\ ax+b & x>2\end{cases}"/>. Para que <Latex math="f"/> sea derivable en <Latex math="x=2"/>, ¿cuánto vale <Latex math="a"/>?</>}
                                    hint="La derivada del tramo izquierdo en x = 2 debe coincidir con la del tramo derecho (que es a). Deriva x²+2x y evalúa en x = 2."
                                    solution={<><Latex math="f'(2^-)=(x^2+2x)'\big|_{x=2}=(2x+2)\big|_{x=2}=6"/>. Para derivabilidad: <Latex math="a=f'(2^-)=6"/>.</>}
                                    correctAnswer={6}
                                />

                                <Exercise
                                    number={20}
                                    statement={<>Sea <Latex math="f(x)=\begin{cases}x^2 & x\leq 0\\ 1-\tfrac{x}{2} & x>0\end{cases}"/>. Calcula <Latex math="f'(0^+)"/>.</>}
                                    hint="Deriva el tramo x > 0 y evalúa en x = 0."
                                    solution={<>Para <Latex math="x>0"/>: <Latex math="f(x)=1-x/2"/>, luego <Latex math="f'(x)=-1/2"/>. Por tanto <Latex math="f'(0^+)=-0{,}5"/>.</>}
                                    correctAnswer={-0.5}
                                />

                                <Exercise
                                    number={21}
                                    statement={<>Sea <Latex math="f(x)=\begin{cases}ax-1 & x\leq 2\\ x^2-3x+3 & x>2\end{cases}"/>. Halla <Latex math="a"/> para que <Latex math="f"/> sea continua en <Latex math="x=2"/>.</>}
                                    hint="Calcula f(2⁺) sustituyendo x = 2 en x² − 3x + 3, y después iguala con f(2⁻) = 2a − 1."
                                    solution={<><Latex math="f(2^+)=4-6+3=1"/>; <Latex math="f(2^-)=2a-1"/>. Igualando: <Latex math="2a-1=1\Rightarrow a=1"/>.</>}
                                    correctAnswer={1}
                                />

                                <Exercise
                                    number={22}
                                    statement={<>Sea <Latex math="f(x)=\begin{cases}x^2+a & x\leq 2\\ 5x-3 & x>2\end{cases}"/>. Halla <Latex math="a"/> para que <Latex math="f"/> sea continua en <Latex math="x=2"/>.</>}
                                    hint="Calcula f(2⁺) = 5·2 − 3 y después iguala con f(2⁻) = 4 + a."
                                    solution={<><Latex math="f(2^+)=10-3=7"/>; <Latex math="f(2^-)=4+a"/>. Igualando: <Latex math="4+a=7\Rightarrow a=3"/>.</>}
                                    correctAnswer={3}
                                />

                                <Exercise
                                    number={23}
                                    statement={<>Sea <Latex math="f(x)=\begin{cases}3x^2-6x & x\leq 2\\ ax+b & x>2\end{cases}"/>. Para que <Latex math="f"/> sea derivable en <Latex math="x=2"/>, ¿cuánto vale <Latex math="a"/>?</>}
                                    hint="Deriva el tramo izquierdo en x = 2; ese valor debe coincidir con la pendiente a del tramo derecho."
                                    solution={<><Latex math="f'(2^-)=(3x^2-6x)'\big|_{x=2}=(6x-6)\big|_{x=2}=6"/>. Para derivabilidad: <Latex math="a=6"/>.</>}
                                    correctAnswer={6}
                                />

                                <Exercise
                                    number={24}
                                    statement={<>¿En qué valor de <Latex math="x"/> <strong>no es derivable</strong> <Latex math="f(x)=|2x-6|"/>?</>}
                                    hint="Una función con valor absoluto no es derivable donde su interior se anula. Resuelve 2x − 6 = 0."
                                    solution={<><Latex math="|2x-6|"/> tiene un punto anguloso donde <Latex math="2x-6=0"/>, es decir, <Latex math="x=3"/>. En ese punto: <Latex math="f'(3^-)=-2"/> y <Latex math="f'(3^+)=+2"/>, distintos, luego <Latex math="f"/> no es derivable en <Latex math="x=3"/>.</>}
                                    correctAnswer={3}
                                />

                            </div>

                        </SectionCard>

                    </main>
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
