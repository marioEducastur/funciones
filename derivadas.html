<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derivadas - 1º Bachillerato</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
</head>
<body class="bg-slate-50">
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── Latex ──────────────────────────────────────────────────────────────
    const Latex = ({ math, display = false }) => {
        const ref = useRef(null);
        useEffect(() => {
            if (window.katex && ref.current) {
                window.katex.render(math, ref.current, { displayMode: display, throwOnError: false });
            }
        }, [math, display]);
        return <span ref={ref} className={display ? "my-4 block text-center overflow-x-auto hide-scrollbar" : ""} />;
    };

    // ── SectionCard ────────────────────────────────────────────────────────
    const SectionCard = ({ id, title, children }) => (
        <section id={id} className="scroll-mt-24 mb-12 border border-slate-200 rounded-xl bg-white shadow-sm overflow-hidden">
            <div className="bg-slate-100 p-4 md:p-6 border-b border-slate-200">
                <h2 className="text-2xl font-bold text-slate-800">{title}</h2>
            </div>
            <div className="p-4 md:p-6">{children}</div>
        </section>
    );

    // ── SecantTangentViz ───────────────────────────────────────────────────
    const SecantTangentViz = () => {
        const [h, setH] = useState(2.0);

        const xA = 1, yA = 1;
        const xB = xA + h;
        const yB = xB * xB;
        const tvm = (yB - yA) / h;          // = 2 + h
        const derA = 2;                      // f'(1) = 2

        const W = 480, H = 420, PAD = 46;
        const xMin = -0.5;
        const xMax = 4.5;
        const yMin = -1, yMax = 17;

        const mx = x => PAD + (x - xMin) / (xMax - xMin) * (W - 2 * PAD);
        const my = y => H - PAD - (y - yMin) / (yMax - yMin) * (H - 2 * PAD);

        // Parabola path
        let pathD = ''; let first = true;
        for (let i = 0; i <= 320; i++) {
            const x = xMin + (i / 320) * (xMax - xMin);
            const y = x * x;
            if (y > yMax + 1) { first = true; continue; }
            pathD += (first ? 'M' : ' L') + ` ${mx(x).toFixed(1)} ${my(y).toFixed(1)}`;
            first = false;
        }

        const secY = x => tvm * (x - xA) + yA;
        const tanY = x => derA * (x - xA) + yA;
        const isClose = h < 0.25;
        const bVisible = yB <= yMax + 0.5;

        const triangleVisible = h >= 0.35;
        const catetoPxH = triangleVisible ? my(yA) - my(yB) : 0;
        const catLabelVisible = catetoPxH > 60;

        return (
            <div className="border border-slate-200 rounded-xl overflow-hidden bg-white mb-8">
                <div className="bg-slate-100 p-4 border-b border-slate-200">
                    <h4 className="font-bold text-lg text-slate-700">De la recta secante a la tangente — <span className="font-mono">f(x) = x²</span></h4>
                </div>
                <div className="p-4 md:p-6">
                    <div className="flex flex-col md:flex-row items-start gap-3 md:gap-5">
                        <div className="flex flex-wrap items-center justify-center gap-x-5 gap-y-1 md:flex-col md:items-start md:justify-start md:w-36 shrink-0 md:pt-2">
                            <div className="flex items-center gap-2">
                                <svg width="24" height="10" style={{display:'block'}}>
                                    <line x1="0" y1="5" x2="24" y2="5" stroke="#2563eb" strokeWidth="2.5"/>
                                </svg>
                                <span className="text-sm text-slate-600">Recta secante</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <svg width="24" height="10" style={{display:'block'}}>
                                    <line x1="0" y1="5" x2="24" y2="5" stroke="#f97316" strokeWidth="2" strokeDasharray="6 3"/>
                                </svg>
                                <span className="text-sm text-slate-600">Recta tangente</span>
                            </div>
                            {!triangleVisible && (
                                <p className="w-full text-center md:text-left text-xs text-slate-400 md:mt-2">
                                    El triángulo es muy pequeño — los valores siguen disponibles abajo.
                                </p>
                            )}
                        </div>
                        <div className="flex-1 min-w-0 overflow-x-auto hide-scrollbar">
                            <svg viewBox={`0 0 ${W} ${H}`} className="w-full max-w-[480px] mx-auto block" style={{minWidth:260}}>
                                {[0,1,2,3,4].map(x => <line key={`gx${x}`} x1={mx(x)} y1={PAD} x2={mx(x)} y2={H-PAD} stroke="#f1f5f9" strokeWidth="1"/>)}
                                {[0,2,4,6,8,10,12,14,16].map(y => <line key={`gy${y}`} x1={PAD} y1={my(y)} x2={W-PAD} y2={my(y)} stroke="#f1f5f9" strokeWidth="1"/>)}
                                <line x1={PAD} y1={my(0)} x2={W-PAD} y2={my(0)} stroke="#64748b" strokeWidth="1.5"/>
                                <line x1={mx(0)} y1={PAD} x2={mx(0)} y2={H-PAD} stroke="#64748b" strokeWidth="1.5"/>
                                {[1,2,3,4].map(x => <text key={`lx${x}`} x={mx(x)} y={my(0)+15} fontSize="11" fill="#94a3b8" textAnchor="middle">{x}</text>)}
                                {[2,4,6,8,10,12,14,16].map(y => <text key={`ly${y}`} x={mx(0)-6} y={my(y)+4} fontSize="11" fill="#94a3b8" textAnchor="end">{y}</text>)}
                                {/* Triangle catetos */}
                                {triangleVisible && <>
                                    <line x1={mx(xA)} y1={my(yA)} x2={mx(xB)} y2={my(yA)} stroke="#64748b" strokeWidth="1.2" strokeDasharray="5 3"/>
                                    <line x1={mx(xB)} y1={my(yA)} x2={mx(xB)} y2={my(yB)} stroke="#64748b" strokeWidth="1.2" strokeDasharray="5 3"/>
                                    <rect x={mx(xB)-8} y={my(yA)-8} width="8" height="8" fill="none" stroke="#64748b" strokeWidth="1.2"/>
                                    <text x={(mx(xA)+mx(xB))/2} y={my(yA)+12} fontSize="12" fontWeight="bold" fill="#475569" textAnchor="middle">h</text>
                                    {catLabelVisible && <text x={mx(xB)+8} y={(my(yA)+my(yB))/2} fontSize="11" fill="#475569" textAnchor="start">f(b)−f(a)</text>}
                                </>}
                                {/* Tangent (orange dashed) */}
                                <line x1={mx(xMin)} y1={my(tanY(xMin))} x2={mx(xMax)} y2={my(tanY(xMax))} stroke="#f97316" strokeWidth="2" strokeDasharray="8 4" opacity="0.9"/>
                                {/* Secant (blue) */}
                                <line x1={mx(xMin)} y1={my(secY(xMin))} x2={mx(xMax)} y2={my(secY(xMax))} stroke="#2563eb" strokeWidth="2.5"/>
                                {/* Parabola */}
                                <path d={pathD} fill="none" stroke="#1e293b" strokeWidth="2.5"/>
                                {/* Point B */}
                                {bVisible && <circle cx={mx(xB)} cy={my(yB)} r="6" fill="#2563eb" stroke="white" strokeWidth="2"/>}
                                {/* Point A */}
                                <circle cx={mx(xA)} cy={my(yA)} r="7" fill="#dc2626" stroke="white" strokeWidth="2.5"/>
                                <rect x={mx(xA)-60} y={my(yA)-27} width={48} height={17} rx="2" fill="white" fillOpacity="0.85"/>
                                <text x={mx(xA)-36} y={my(yA)-14} fontSize="12" fontWeight="bold" fill="#dc2626" textAnchor="middle">A(1,1)</text>
                                {!isClose && bVisible && <>
                                    <rect x={mx(xB)+8} y={my(yB)-26} width={16} height={17} rx="2" fill="white" fillOpacity="0.85"/>
                                    <text x={mx(xB)+16} y={my(yB)-13} fontSize="12" fontWeight="bold" fill="#1d4ed8">B</text>
                                </>}
                            </svg>
                        </div>
                    </div>

                    <div className="mt-4 px-1">
                        <label className="block text-sm font-semibold text-slate-600 mb-2">
                            Incremento <span className="font-mono font-bold">h = {h.toFixed(2)}</span>
                            <span className="text-slate-400 font-normal ml-2">(arrastra para acercar B a A)</span>
                        </label>
                        <input type="range" min="0.05" max="3" step="0.05" value={h}
                               onChange={e => setH(parseFloat(e.target.value))} className="w-full accent-blue-600"/>
                        <div className="flex justify-between text-xs text-slate-400 mt-1">
                            <span>h → 0 (B se acerca a A)</span>
                            <span>h = 3 (B lejos de A)</span>
                        </div>
                    </div>

                    <div className="mt-5 grid grid-cols-3 gap-3">
                        <div className="bg-slate-50 rounded-lg p-3 border border-slate-200 text-center">
                            <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">h</div>
                            <div className="text-2xl font-bold text-slate-700">{h.toFixed(4)}</div>
                        </div>
                        <div className={`rounded-lg p-3 border text-center transition-colors duration-300 ${isClose ? 'bg-orange-50 border-orange-200' : 'bg-blue-50 border-blue-200'}`}>
                            <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">TVM (pendiente secante)</div>
                            <div className={`text-2xl font-bold transition-colors duration-300 ${isClose ? 'text-orange-600' : 'text-blue-700'}`}>{tvm.toFixed(4)}</div>
                        </div>
                        <div className="bg-orange-50 rounded-lg p-3 border border-orange-200 text-center">
                            <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1">f'(1) — tangente</div>
                            <div className="text-2xl font-bold text-orange-600">2</div>
                        </div>
                    </div>

                    <div className={`mt-4 p-4 rounded-lg text-sm font-medium border transition-colors duration-300 ${isClose ? 'bg-orange-50 border-orange-200 text-orange-800' : 'bg-blue-50 border-blue-200 text-blue-800'}`}>
                        {isClose
                            ? `¡La secante casi coincide con la tangente! Con h = ${h.toFixed(4)}, TVM = ${tvm.toFixed(4)} ≈ 2 = f'(1).`
                            : `Con h = ${h.toFixed(2)}: B = (${xB.toFixed(2)}, ${yB.toFixed(2)}). Pendiente secante = TVM = ${tvm.toFixed(4)}. Acerca B a A para ver cómo converge a f'(1) = 2.`
                        }
                    </div>
                </div>
            </div>
        );
    };

    // ── WorkedExample (acordeón) ───────────────────────────────────────────
    const WorkedExample = ({ title, children }) => {
        const [open, setOpen] = useState(false);
        return (
            <div className="border border-slate-200 rounded-xl overflow-hidden mb-3">
                <button onClick={() => setOpen(o => !o)}
                        className="w-full flex items-center justify-between px-5 py-4 bg-slate-50 hover:bg-slate-100 transition-colors text-left gap-3">
                    <span className="font-semibold text-slate-800 text-base">{title}</span>
                    <svg className={`w-5 h-5 text-slate-400 shrink-0 transition-transform duration-200 ${open ? 'rotate-180' : ''}`}
                         fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                {open && (
                    <div className="p-5 border-t border-slate-200 bg-white space-y-3 text-slate-700 text-base leading-relaxed">
                        {children}
                    </div>
                )}
            </div>
        );
    };

    // ── Exercise ───────────────────────────────────────────────────────────
    const Exercise = ({ number, statement, correctAnswer, hint, solution }) => {
        const [value, setValue] = useState('');
        const [attempts, setAttempts] = useState(0);
        const [status, setStatus] = useState('idle');
        const [showSolution, setShowSolution] = useState(false);

        const normalize = s => s.trim().replace(',', '.');

        const check = () => {
            const parsed = parseFloat(normalize(value));
            if (isNaN(parsed)) { setStatus('wrong'); setAttempts(a => a + 1); return; }
            if (Math.abs(parsed - correctAnswer) < 0.01) {
                setStatus('correct');
            } else {
                setStatus('wrong');
                setAttempts(a => a + 1);
            }
        };

        const reset = () => { setValue(''); setStatus('idle'); setAttempts(0); setShowSolution(false); };

        return (
            <div className={`rounded-xl border p-5 mb-4 transition-colors ${status === 'correct' ? 'bg-green-50 border-green-300' : status === 'wrong' ? 'bg-red-50 border-red-200' : 'bg-white border-slate-200'}`}>
                <div className="flex items-start gap-3 mb-4">
                    <span className="bg-blue-600 text-white text-sm font-bold w-7 h-7 rounded-full flex items-center justify-center shrink-0 mt-0.5">{number}</span>
                    <div className="text-slate-800 text-base leading-relaxed">{statement}</div>
                </div>

                {status !== 'correct' && !showSolution && (
                    <div className="flex items-center gap-3 flex-wrap">
                        <input type="text" value={value}
                               onChange={e => { setValue(e.target.value); setStatus('idle'); }}
                               onKeyDown={e => e.key === 'Enter' && check()}
                               placeholder="Tu respuesta..."
                               className="border border-slate-300 rounded-lg px-3 py-2 text-base w-36 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
                        <button onClick={check} className="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-lg transition-colors">
                            Comprobar
                        </button>
                        {status === 'wrong' && (
                            <button onClick={reset} className="text-slate-500 hover:text-slate-700 text-sm underline">Reintentar</button>
                        )}
                    </div>
                )}

                {status === 'correct' && (
                    <div className="flex items-center gap-2 text-green-700 font-semibold">
                        <svg className="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7"/>
                        </svg>
                        ¡Correcto! La respuesta es {correctAnswer}.
                    </div>
                )}

                {status === 'wrong' && (
                    <div className="mt-2 text-sm font-medium text-red-700">
                        Respuesta incorrecta.{attempts >= 2 && <span className="ml-1">💡 <strong>Pista:</strong> {hint}</span>}
                    </div>
                )}

                {attempts >= 3 && status !== 'correct' && !showSolution && (
                    <button onClick={() => setShowSolution(true)} className="mt-3 text-sm text-blue-600 hover:text-blue-800 underline font-medium">
                        Ver solución completa
                    </button>
                )}

                {showSolution && (
                    <div className="mt-4 p-4 rounded-lg bg-white border border-slate-200 text-sm text-slate-700 space-y-2">
                        <div className="font-bold text-slate-800 mb-1">Solución paso a paso:</div>
                        {solution}
                    </div>
                )}
            </div>
        );
    };

    // ── DerivativeFunctionViz ─────────────────────────────────────────────
    const DerivativeFunctionViz = () => {
        const [x0, setX0] = useState(1.0);
        const slope = 2 * x0;
        const py = x0 * x0;

        const W = 260, H = 220, PAD = 36;
        const xMin = -2.8, xMax = 2.8;
        const yF1 = -0.3, yF2 = 8.5, yD1 = -6, yD2 = 6;
        const mx  = x => PAD + (x - xMin) / (xMax - xMin) * (W - 2 * PAD);
        const myF = y => H - PAD - (y - yF1) / (yF2 - yF1) * (H - 2 * PAD);
        const myD = y => H - PAD - (y - yD1) / (yD2 - yD1) * (H - 2 * PAD);

        let pF = '', firstF = true;
        for (let i = 0; i <= 240; i++) {
            const x = xMin + i / 240 * (xMax - xMin), y = x * x;
            if (y > yF2 + 0.5) { firstF = true; continue; }
            pF += (firstF ? 'M' : 'L') + `${mx(x).toFixed(1)} ${myF(y).toFixed(1)} `;
            firstF = false;
        }
        let pD = '', firstD = true;
        for (let i = 0; i <= 240; i++) {
            const x = xMin + i / 240 * (xMax - xMin), y = 2 * x;
            if (y > yD2 + 0.5 || y < yD1 - 0.5) { firstD = true; continue; }
            pD += (firstD ? 'M' : 'L') + `${mx(x).toFixed(1)} ${myD(y).toFixed(1)} `;
            firstD = false;
        }

        return (
            <div className="border border-slate-200 rounded-xl overflow-hidden bg-white mb-8">
                <div className="bg-slate-100 p-4 border-b border-slate-200">
                    <h4 className="font-bold text-lg text-slate-700">De la derivada en un punto a la función derivada — <span className="font-mono">f(x) = x²</span></h4>
                </div>
                <div className="p-4 md:p-6">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                        <div>
                            <p className="text-xs font-semibold text-center text-slate-500 uppercase tracking-wide mb-1">f(x) = x² con recta tangente</p>
                            <svg viewBox={`0 0 ${W} ${H}`} className="w-full block">
                                <defs><clipPath id="cpF"><rect x={PAD} y={PAD} width={W-2*PAD} height={H-2*PAD}/></clipPath></defs>
                                {[-2,-1,0,1,2].map(x => <line key={x} x1={mx(x)} y1={PAD} x2={mx(x)} y2={H-PAD} stroke="#f1f5f9" strokeWidth="1"/>)}
                                {[2,4,6,8].map(y => <line key={y} x1={PAD} y1={myF(y)} x2={W-PAD} y2={myF(y)} stroke="#f1f5f9" strokeWidth="1"/>)}
                                <line x1={PAD} y1={myF(0)} x2={W-PAD} y2={myF(0)} stroke="#64748b" strokeWidth="1.5"/>
                                <line x1={mx(0)} y1={PAD} x2={mx(0)} y2={H-PAD} stroke="#64748b" strokeWidth="1.5"/>
                                {[-2,-1,1,2].map(x => <text key={x} x={mx(x)} y={myF(0)+14} fontSize="10" fill="#94a3b8" textAnchor="middle">{x}</text>)}
                                {[2,4,6].map(y => <text key={y} x={mx(0)-6} y={myF(y)+4} fontSize="10" fill="#94a3b8" textAnchor="end">{y}</text>)}
                                <line x1={mx(xMin-1)} y1={myF(slope*(xMin-1-x0)+py)} x2={mx(xMax+1)} y2={myF(slope*(xMax+1-x0)+py)}
                                      stroke="#f97316" strokeWidth="2" strokeDasharray="7 4" clipPath="url(#cpF)"/>
                                <path d={pF} fill="none" stroke="#1e293b" strokeWidth="2.5" clipPath="url(#cpF)"/>
                                <circle cx={mx(x0)} cy={myF(py)} r="6" fill="#dc2626" stroke="white" strokeWidth="2"/>
                            </svg>
                        </div>
                        <div>
                            <p className="text-xs font-semibold text-center text-slate-500 uppercase tracking-wide mb-1">f'(x) = 2x — función derivada</p>
                            <svg viewBox={`0 0 ${W} ${H}`} className="w-full block">
                                <defs><clipPath id="cpD"><rect x={PAD} y={PAD} width={W-2*PAD} height={H-2*PAD}/></clipPath></defs>
                                {[-2,-1,0,1,2].map(x => <line key={x} x1={mx(x)} y1={PAD} x2={mx(x)} y2={H-PAD} stroke="#f1f5f9" strokeWidth="1"/>)}
                                {[-4,-2,0,2,4].map(y => <line key={y} x1={PAD} y1={myD(y)} x2={W-PAD} y2={myD(y)} stroke="#f1f5f9" strokeWidth="1"/>)}
                                <line x1={PAD} y1={myD(0)} x2={W-PAD} y2={myD(0)} stroke="#64748b" strokeWidth="1.5"/>
                                <line x1={mx(0)} y1={PAD} x2={mx(0)} y2={H-PAD} stroke="#64748b" strokeWidth="1.5"/>
                                {[-2,-1,1,2].map(x => <text key={x} x={mx(x)} y={myD(0)+14} fontSize="10" fill="#94a3b8" textAnchor="middle">{x}</text>)}
                                {[-4,-2,2,4].map(y => <text key={y} x={mx(0)-6} y={myD(y)+4} fontSize="10" fill="#94a3b8" textAnchor="end">{y}</text>)}
                                <path d={pD} fill="none" stroke="#f97316" strokeWidth="2.5" clipPath="url(#cpD)"/>
                                <line x1={mx(x0)} y1={myD(0)} x2={mx(x0)} y2={myD(slope)} stroke="#dc2626" strokeWidth="1.5" strokeDasharray="4 3" clipPath="url(#cpD)"/>
                                <circle cx={mx(x0)} cy={myD(slope)} r="6" fill="#dc2626" stroke="white" strokeWidth="2"/>
                            </svg>
                        </div>
                    </div>
                    <div className="px-1">
                        <label className="block text-sm font-semibold text-slate-600 mb-1">
                            Punto: <span className="font-mono font-bold">x = {x0.toFixed(2)}</span>
                            <span className="text-slate-400 font-normal ml-2">(arrastra para mover el punto)</span>
                        </label>
                        <input type="range" min="-2.5" max="2.5" step="0.05" value={x0}
                               onChange={e => setX0(parseFloat(e.target.value))} className="w-full accent-red-600"/>
                        <div className="flex justify-between text-xs text-slate-400 mt-1"><span>x = −2.5</span><span>x = 2.5</span></div>
                    </div>
                    <div className="mt-3 grid grid-cols-3 gap-2 text-center">
                        <div className="bg-slate-50 rounded-lg p-2 border border-slate-200">
                            <div className="text-xs text-slate-500 mb-0.5">x</div>
                            <div className="text-xl font-bold text-slate-700">{x0.toFixed(2)}</div>
                        </div>
                        <div className="bg-orange-50 rounded-lg p-2 border border-orange-200">
                            <div className="text-xs text-slate-500 mb-0.5">Pendiente tangente</div>
                            <div className="text-xl font-bold text-orange-600">{slope.toFixed(2)}</div>
                        </div>
                        <div className="bg-red-50 rounded-lg p-2 border border-red-200">
                            <div className="text-xs text-slate-500 mb-0.5">f'(x) = 2x</div>
                            <div className="text-xl font-bold text-red-600">{slope.toFixed(2)}</div>
                        </div>
                    </div>
                    <div className={`mt-3 p-3 rounded-lg text-sm font-medium border ${Math.abs(slope) < 0.06 ? 'bg-green-50 border-green-200 text-green-800' : slope > 0 ? 'bg-blue-50 border-blue-200 text-blue-800' : 'bg-orange-50 border-orange-200 text-orange-800'}`}>
                        {Math.abs(slope) < 0.06
                            ? 'En x = 0 la tangente es horizontal (pendiente 0): es el mínimo de f(x) = x². La derivada valdrá 0 en ese punto.'

    // ── ChainRuleBoxes ────────────────────────────────────────────────────

                innerLabel: "u=g(x)=2x+1",

                innerD: "2",
                result: "5(2x+1)^4\\cdot 2=10(2x+1)^4",
            },
            {

                outerLabel: "f(u)=\\operatorname{sen}(u)",

                outerDIntact: "\\cos(3x^2+1)",
                innerLabel: "u=g(x)=3x^2+1",
                inner: "3x^2+1",
                innerD: "6x",

    // ── DerivabilityGallery ───────────────────────────────────────────────
    const DerivabilityGallery = () => {

        const cases = [

            { btnTex:"|x|",              heading:"f(x) = |x|  en  x = 0",         xMin:-2.2,xMax:2.2,yMin:-0.3,yMax:2.5, yTicks:[1,2],    continuous:true,  derivable:false, deriv:null, leftD:"−1", rightD:"+1", type:"abs",  noteColor:"red",   note:"Punto anguloso: f es continua pero NO derivable. Las derivadas laterales existen pero son distintas: f'(0⁻) = −1 ≠ +1 = f'(0⁺)." },
            { btnTex:"\\sqrt[3]{x}",     heading:"f(x) = ∛x  en  x = 0",          xMin:-2.5,xMax:2.5,yMin:-1.6,yMax:1.6, yTicks:[-1,1],   continuous:true,  derivable:false, deriv:null, leftD:null,  rightD:null,  type:"cbrt", noteColor:"red",   note:"Tangente vertical: f es continua pero NO derivable. La pendiente tiende a +∞ cuando x → 0; no existe derivada finita." },
            { btnLabel:"Salto en x = 0", heading:"Función con salto en x = 0",     xMin:-2.2,xMax:2.2,yMin:-1.5,yMax:2.5, yTicks:[-1,1,2], continuous:false, derivable:false, deriv:null, leftD:null,  rightD:null,  type:"jump", noteColor:"red",   note:"Discontinuidad: f no es continua en x = 0 (salto de 0 a 1). Sin continuidad, no puede haber derivada." },
        ];

        const c = cases[fi];
        const mx = x => PAD + (x-c.xMin)/(c.xMax-c.xMin)*(W-2*PAD);
        const my = y => H-PAD-(y-c.yMin)/(c.yMax-c.yMin)*(H-2*PAD);

        const buildPath = (fn, xL, xR) => {
            let d='', first=true;
            for(let i=0;i<=300;i++){
                const x=xL+(i/300)*(xR-xL), y=fn(x);
                if(!isFinite(y)||y>c.yMax+1||y<c.yMin-1){first=true;continue;}
                d+=(first?'M':'L')+`${mx(x).toFixed(1)} ${my(y).toFixed(1)} `;

            return d;
        };

        const curve = () => {
            if(c.type==='par') return (

                    <line x1={mx(c.xMin)} y1={my(0)} x2={mx(c.xMax)} y2={my(0)} stroke="#f97316" strokeWidth="2" strokeDasharray="7 4" clipPath="url(#dgC)"/>
                    <path d={buildPath(x=>x*x,c.xMin,c.xMax)} fill="none" stroke="#2563eb" strokeWidth="2.5" clipPath="url(#dgC)"/>

                    <line x1={mx(c.xMin)} y1={my(-c.xMin)} x2={mx(0)} y2={my(0)} stroke="#f97316" strokeWidth="2" strokeDasharray="7 4" clipPath="url(#dgC)"/>
                    <line x1={mx(0)} y1={my(0)} x2={mx(c.xMax)} y2={my(c.xMax)} stroke="#f97316" strokeWidth="2" strokeDasharray="7 4" clipPath="url(#dgC)"/>
                    <path d={buildPath(x=>Math.abs(x),c.xMin,c.xMax)} fill="none" stroke="#2563eb" strokeWidth="2.5" clipPath="url(#dgC)"/>
                    <circle cx={mx(0)} cy={my(0)} r="6" fill="#dc2626" stroke="white" strokeWidth="2"/>

                    <text x={mx(0.5)} y={my(0.7)+13} fontSize="10" fill="#f97316">m = +1</text>
                </>
            );
            if(c.type==='cbrt'){
                const cb=x=>Math.sign(x)*Math.pow(Math.abs(x),1/3);

                    <>
                        <line x1={mx(0)} y1={PAD} x2={mx(0)} y2={H-PAD} stroke="#f97316" strokeWidth="2" strokeDasharray="7 4"/>
                        <path d={buildPath(cb,c.xMin,-0.01)} fill="none" stroke="#2563eb" strokeWidth="2.5" clipPath="url(#dgC)"/>
                        <path d={buildPath(cb,0.01,c.xMax)} fill="none" stroke="#2563eb" strokeWidth="2.5" clipPath="url(#dgC)"/>
                        <circle cx={mx(0)} cy={my(0)} r="6" fill="#dc2626" stroke="white" strokeWidth="2"/>
                        <text x={mx(0.15)} y={my(0.65)} fontSize="11" fill="#f97316">tang. vert.</text>
                    </>
                );

            if(c.type==='jump') return (
                <>
                    <path d={buildPath(x=>x,c.xMin,-0.01)} fill="none" stroke="#2563eb" strokeWidth="2.5" clipPath="url(#dgC)"/>
                    <path d={buildPath(x=>x+1,0,c.xMax)} fill="none" stroke="#2563eb" strokeWidth="2.5" clipPath="url(#dgC)"/>
                    <circle cx={mx(0)} cy={my(0)} r="6" fill="white" stroke="#2563eb" strokeWidth="2.5"/>
                    <circle cx={mx(0)} cy={my(1)} r="6" fill="#dc2626" stroke="white" strokeWidth="2"/>

        return (
            <div className="border border-slate-200 rounded-xl overflow-hidden bg-white mb-8">
                <div className="bg-slate-100 p-4 border-b border-slate-200">
                    <h4 className="font-bold text-lg text-slate-700">Los 4 escenarios: continua, derivable, o ninguna de las dos</h4>
                </div>
                <div className="p-4 md:p-6">
                    {/* Selector */}
                    <div className="flex flex-wrap gap-2 mb-5">
                        {cases.map((cas,i) => (
                            <button key={i} onClick={()=>setFi(i)}
                                className={`px-3 py-2.5 min-w-[4rem] rounded-lg font-semibold border transition-colors ${fi===i?'bg-blue-600 text-white border-blue-600':'bg-white text-slate-700 border-slate-300 hover:border-blue-400'}`}>

                        {c.yTicks.filter(y=>y!==0).map(y=><text key={`ly${y}`} x={mx(0)-6} y={my(y)+4} fontSize="10" fill="#94a3b8" textAnchor="end">{y}</text>)}
                        {curve()}
                    </svg>

                    {/* Status cards */}
                    <div className="grid grid-cols-2 gap-3 mb-3">
                        <div className={`rounded-xl p-4 text-center border-2 ${c.continuous?'bg-green-50 border-green-400':'bg-red-50 border-red-400'}`}>
                            <p className="text-xs font-bold uppercase tracking-wide mb-1 text-slate-600">Continua en x = 0</p>
                            <p className={`text-xl font-bold ${c.continuous?'text-green-700':'text-red-700'}`}>{c.continuous?'✓ Sí':'✗ No'}</p>

                        <div className={`rounded-xl p-4 text-center border-2 ${c.derivable?'bg-green-50 border-green-400':'bg-red-50 border-red-400'}`}>

                </div>

    // ── CarVelocityWidget ─────────────────────────────────────────────────
    const CarVelocityWidget = () => {
        const [t, setT]                 = useState(0);
        const [isPlaying, setIsPlaying] = useState(true);
        const tRef   = useRef(0);
        const animRef = useRef({ lastTs: null, waitStart: null });

        // ─── Physics ──────────────────────────────────────────────────────
        const S_MAX      = 25;   // km at t = 15 min
        const V_MAX_DIAL = 150;  // km/h, top of speedometer dial
        const K          = 25 / 24; // calibration: raw integral gives 24 km, scale to 25

        const smooth = (x) => 3*x*x - 2*x*x*x; // smoothstep: f(0)=0, f(1)=1, f'(0)=f'(1)=0

        const vFunc = (t) => {
            if (t <= 0)  return 0;
            if (t <= 3)  return 120 * smooth(t / 3);
            if (t <= 12) return 120;
            if (t <= 15) return 120 * smooth((15 - t) / 3);
            return 0;
        };

        // Analytical integral of v(τ)/60 dτ, scaled by K so s(15) = 25 km exactly
        const sFunc = (t) => {
            if (t <= 0)  return 0;
            if (t <= 3) {
                return K * ((2/9)*t*t*t - (1/27)*t*t*t*t);
            }
            if (t <= 12) {
                return K * (2*t - 3);
            }
            if (t <= 15) {
                const r = 15 - t;
                return K * (24 - (2/9)*r*r*r + (1/27)*r*r*r*r);
            }
            return 25;
        };

        const sNow = sFunc(t);
        const vNow = vFunc(t);

        // ─── Keep tRef in sync ─────────────────────────────────────────────
        useEffect(() => { tRef.current = t; }, [t]);

        // ─── Animation loop ────────────────────────────────────────────────
        useEffect(() => {
            if (!isPlaying) return;

            animRef.current.lastTs    = null;
            animRef.current.waitStart = null;
            let currentT = tRef.current; // resume from current slider position

            const RATE          = 15 / 18000; // min per ms → full trip in 18 s
            const RESTART_DELAY = 1500;        // ms pause at end before looping

            let animId;
            const step = (ts) => {
                const a = animRef.current;
                if (a.lastTs === null) a.lastTs = ts;
                const dt = Math.min(ts - a.lastTs, 50); // cap large gaps (tab was hidden)
                a.lastTs = ts;

                if (a.waitStart !== null) {
                    if (ts - a.waitStart >= RESTART_DELAY) {
                        currentT      = 0;
                        a.waitStart   = null;
                    }
                } else {
                    currentT += dt * RATE;
                    if (currentT >= 15) {
                        currentT    = 15;
                        a.waitStart = ts;
                    }
                }

                setT(currentT);
                animId = requestAnimationFrame(step);
            };

            animId = requestAnimationFrame(step);
            return () => cancelAnimationFrame(animId);
        }, [isPlaying]); // eslint-disable-line react-hooks/exhaustive-deps

        // ─── Road SVG ─────────────────────────────────────────────────────
        const RW = 560, RH = 110, roadTop = 65;

        const carX = 80 + (sNow / S_MAX) * 400;
        const cgx  = carX - 47;
        const cgy  = roadTop - 67;

        const kmToX = (km) => 80 + (km / S_MAX) * 400;
        const kmMarkers = [
            { km: 0,  label: '0 km'  },
            { km: 5,  label: '5 km'  },
            { km: 10, label: '10 km' },
            { km: 15, label: '15 km' },
            { km: 20, label: '20 km' },
            { km: 25, label: '25 km' },
        ];

        // ─── Speedometer ──────────────────────────────────────────────────
        const SCX = 100, SCY = 108, SR = 88, NL = 73;
        const needleAngle = Math.PI * (1 - Math.min(vNow, V_MAX_DIAL) / V_MAX_DIAL);
        const needleX = SCX + NL * Math.cos(needleAngle);
        const needleY = SCY - NL * Math.sin(needleAngle);

        const arcPath = (cx, cy, r, a1, a2) => {
            const x1 = cx + r * Math.cos(a1), y1 = cy - r * Math.sin(a1);
            const x2 = cx + r * Math.cos(a2), y2 = cy - r * Math.sin(a2);
            const lg = Math.abs(a1 - a2) > Math.PI ? 1 : 0;
            return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${lg} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
        };

        const tickAt = (v, r) => ({
            x: SCX + r * Math.cos(Math.PI * (1 - v / V_MAX_DIAL)),
            y: SCY - r * Math.sin(Math.PI * (1 - v / V_MAX_DIAL)),
        });

        return (
            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden mb-6">

                {/* ── Road ──────────────────────────────────────────────── */}
                <svg viewBox={`0 0 ${RW} ${RH}`} className="w-full" style={{ display: 'block' }}>

                    {/* Sky */}
                    <rect width={RW} height={roadTop} fill="#e0f2fe"/>
                    {/* Asphalt */}
                    <rect y={roadTop} width={RW} height={RH - roadTop} fill="#334155"/>
                    {/* Road edge line */}
                    <rect y={roadTop} width={RW} height={3} fill="#64748b"/>
                    {/* Centre dashes */}
                    <line x1={0} y1={Math.round((roadTop + RH) / 2)} x2={RW} y2={Math.round((roadTop + RH) / 2)}
                          stroke="white" strokeWidth={2} strokeDasharray="20 14" opacity={0.5}/>

                    {/* Km markers — drawn before car so car appears on top */}
                    {kmMarkers.map(({ km, label }) => {
                        const mx = kmToX(km);
                        return (
                            <g key={km}>
                                <rect x={mx - 1.5} y={roadTop - 22} width={3}  height={22} rx={1} fill="#94a3b8"/>
                                <rect x={mx - 20}  y={roadTop - 38} width={40} height={16} rx={2} fill="#1e293b"/>
                                <text x={mx} y={roadTop - 30} textAnchor="middle" dominantBaseline="middle"
                                      fill="white" fontSize={8} fontFamily="monospace" fontWeight="bold">{label}</text>
                            </g>
                        );
                    })}

                    {/* Car */}
                    <g transform={`translate(${cgx.toFixed(1)},${cgy.toFixed(1)})`}>
                        <ellipse cx={47} cy={70} rx={42} ry={4} fill="rgba(0,0,0,0.28)"/>
                        <rect x={5}  y={34} width={88} height={22} rx={7} fill="#2563eb"/>
                        <rect x={20} y={12} width={52} height={26} rx={8} fill="#1d4ed8"/>
                        <rect x={23} y={16} width={13} height={18} rx={2} fill="#bfdbfe" opacity={0.9}/>
                        <rect x={39} y={16} width={18} height={18} rx={2} fill="#bfdbfe" opacity={0.9}/>
                        <rect x={60} y={16} width={10} height={18} rx={2} fill="#bfdbfe" opacity={0.9}/>
                        <rect x={90} y={39} width={5}  height={9}  rx={2} fill="#fef08a"/>
                        <rect x={3}  y={39} width={4}  height={9}  rx={2} fill="#f87171"/>
                        <circle cx={22} cy={56} r={11} fill="#1e293b"/>
                        <circle cx={22} cy={56} r={5}  fill="#475569"/>
                        <circle cx={22} cy={56} r={2}  fill="#94a3b8"/>
                        <circle cx={74} cy={56} r={11} fill="#1e293b"/>
                        <circle cx={74} cy={56} r={5}  fill="#475569"/>
                        <circle cx={74} cy={56} r={2}  fill="#94a3b8"/>
                    </g>
                </svg>

                {/* ── Instruments + controls ────────────────────────────── */}
                <div className="p-4 bg-slate-50 border-t border-slate-200">

                    <div className="flex flex-col sm:flex-row gap-4 mb-5 items-center">

                        {/* Odometer */}
                        <div className="flex-1 flex justify-center w-full">
                            <div className="bg-slate-900 rounded-xl px-6 py-4 text-center w-full max-w-[220px]">
                                <p className="text-xs text-slate-400 tracking-widest font-mono uppercase mb-1">Posición s(t)</p>
                                <p className="font-mono text-4xl font-bold text-green-400 leading-none">
                                    {sNow.toFixed(1)}<span className="text-xl text-green-600 ml-1">km</span>
                                </p>
                            </div>
                        </div>

                        {/* Speedometer */}
                        <div className="flex-1 flex justify-center w-full">
                            <svg viewBox="0 0 200 140" style={{ width: '100%', maxWidth: '230px' }}>

                                <path d={arcPath(SCX, SCY, SR, Math.PI, 0)}
                                      fill="none" stroke="#e2e8f0" strokeWidth={14} strokeLinecap="round"/>

                                {vNow > 1 && (
                                    <path d={arcPath(SCX, SCY, SR, Math.PI, needleAngle)}
                                          fill="none" stroke="#f97316" strokeWidth={10} strokeLinecap="round" opacity={0.85}/>
                                )}

                                {[0, 50, 100, 150].map(v => {
                                    const inn = tickAt(v, SR - 14);
                                    const out = tickAt(v, SR + 5);
                                    const lbl = tickAt(v, SR - 29);
                                    return (
                                        <g key={v}>
                                            <line x1={inn.x.toFixed(1)} y1={inn.y.toFixed(1)}
                                                  x2={out.x.toFixed(1)} y2={out.y.toFixed(1)}
                                                  stroke="#94a3b8" strokeWidth={2}/>
                                            <text x={lbl.x.toFixed(1)} y={(lbl.y + 4).toFixed(1)}
                                                  textAnchor="middle" fill="#64748b" fontSize={9}>{v}</text>
                                        </g>
                                    );
                                })}

                                <text x={SCX} y={SCY - 32} textAnchor="middle" dominantBaseline="middle"
                                      fill="#1e293b" fontSize={20} fontWeight="bold" fontFamily="monospace">
                                    {vNow.toFixed(0)}
                                </text>
                                <text x={SCX} y={SCY - 17} textAnchor="middle" dominantBaseline="middle"
                                      fill="#64748b" fontSize={9}>km/h</text>

                                <line x1={SCX} y1={SCY}
                                      x2={needleX.toFixed(1)} y2={needleY.toFixed(1)}
                                      stroke="#dc2626" strokeWidth={3} strokeLinecap="round"/>
                                <circle cx={SCX} cy={SCY} r={7}   fill="#1e293b"/>
                                <circle cx={SCX} cy={SCY} r={3.5} fill="#f97316"/>

                                <text x={SCX} y={SCY + 22} textAnchor="middle"
                                      fill="#475569" fontSize={9} fontWeight="bold">VELOCIDAD v(t) = s&#8242;(t)</text>
                            </svg>
                        </div>
                    </div>

                    {/* Slider + play/pause */}
                    <div className="mb-4">
                        <div className="flex justify-between items-center mb-2 gap-3">
                            <label className="text-sm font-semibold text-slate-700 shrink-0">
                                Tiempo: <span className="font-mono text-blue-700">{t.toFixed(1)} min</span>
                            </label>
                            <span className="text-xs text-slate-400 font-mono hidden sm:inline">t &#8712; [0, 15]</span>
                            <button
                                onClick={() => setIsPlaying(p => !p)}
                                className={`flex items-center gap-1.5 px-4 py-1.5 rounded-lg text-sm font-semibold transition-colors shrink-0 ${
                                    isPlaying
                                        ? 'bg-slate-200 text-slate-700 hover:bg-slate-300'
                                        : 'bg-blue-600 text-white hover:bg-blue-700'
                                }`}
                            >
                                {isPlaying ? '⏸ Pausar' : '▶ Reproducir'}
                            </button>
                        </div>
                        <input type="range" min={0} max={15} step={0.1} value={t}
                               onChange={e => {
                                   const val = parseFloat(e.target.value);
                                   tRef.current = val;
                                   setT(val);
                                   setIsPlaying(false);
                               }}
                               className="w-full accent-blue-600"/>
                        <div className="flex justify-between text-xs text-slate-400 mt-1 font-mono">
                            <span>0</span><span>5 min</span><span>10 min</span><span>15 min</span>
                        </div>
                    </div>

                    {/* Explanation */}
                    <div className="bg-blue-50 border border-blue-200 rounded-xl p-4 text-sm text-blue-900 leading-relaxed">
                        Mueve el slider y observa: cuando el coche <strong>acelera</strong> (la posición sube rápido), el velocímetro marca alto. Cuando <strong>frena</strong> (la posición sube despacio), el velocímetro baja. La velocidad <strong>v(t) es la derivada de la posición s(t)</strong>: mide cuánto cambia la posición en cada instante.
                    </div>
                </div>
            </div>
        );
    };

    // ── App ────────────────────────────────────────────────────────────────
    function App() {

        const toggleMenu = () => setMobileMenuOpen(m => !m);

        return (

                {/* Navbar */}
                <header className="fixed top-0 left-0 right-0 h-16 bg-blue-600 text-white shadow-md z-50 flex items-center px-4 lg:px-6">
                    <div className="flex items-center gap-4 w-full max-w-[1600px] mx-auto">

                        </button>
                        <div>
                            <h2 className="text-xs font-semibold tracking-wider text-blue-200 uppercase hidden sm:block">Matemáticas I - 1º Bachillerato</h2>

                    </div>
                </header>

                <div className="pt-16 flex max-w-[1600px] mx-auto">

                    {/* Sidebar */}
                    <aside className={`fixed inset-y-0 left-0 pt-16 w-72 bg-white border-r border-slate-200 z-40 transform transition-transform duration-300 lg:translate-x-0 ${mobileMenuOpen ? 'translate-x-0 shadow-2xl' : '-translate-x-full'} lg:sticky lg:top-16 lg:h-[calc(100vh-4rem)]`}>
                        <div className="h-full overflow-y-auto p-6 hide-scrollbar">
                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 pl-2">Índice del Tema</h3>
                            <nav className="space-y-1">

                    <main className="flex-1 p-4 md:p-8 lg:p-10 min-w-0 max-w-5xl">

                        {/* Intro */}
                        <div className="mb-12">
                            <h2 className="text-3xl font-bold text-slate-800 mb-6">¿Qué es una derivada?</h2>
                            <p className="text-lg text-slate-700 mb-4">
                                Imagina que vas en coche y miras el velocímetro: te indica no dónde estás, sino <strong>cómo de rápido cambia tu posición</strong> en ese instante. Esa idea —medir la velocidad de cambio de una magnitud en un momento concreto— es exactamente lo que captura la derivada. En matemáticas, dada una función <Latex math="f(x)" />, su derivada en un punto nos dice cuánto varía (y cómo de rápido lo hace) al pasar por ese punto.
                            </p>
                            <CarVelocityWidget/>
                            <p className="text-lg text-slate-700 mb-4">
                                Geométricamente, la derivada de <Latex math="f" /> en un punto <Latex math="x = a" /> es la <strong>pendiente de la recta tangente</strong> a la curva en ese punto. Si la pendiente es positiva, la función crece; si es negativa, decrece; si es cero, la función tiene un máximo o un mínimo local.
                            </p>
                            <p className="text-lg text-slate-700">
